name: Cloudflare upstream drift

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      refresh_open_pr:
        description: "Replace an existing schema-update PR from current main"
        required: false
        default: false
        type: boolean

# Keep repository defaults restricted. Only the updater job receives the two
# write scopes it needs to maintain its branch and review PR.
permissions: {}

concurrency:
  group: cloudflare-upstream-drift
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'SalixiaHoldings/Cloudflare-Postman'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Protect open schema-update review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/cloudflare-schema-update
          REFRESH_OPEN_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_open_pr == true }}
        shell: bash
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr_number" && "$REFRESH_OPEN_PR" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Open schema-update PR #$pr_number is awaiting human review; leaving its branch unchanged."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [[ -n "$pr_number" ]]; then
              echo "Explicit manual refresh authorized for open schema-update PR #$pr_number."
            fi
          fi
      - name: Use Node.js 24
        if: steps.pending.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        if: steps.pending.outputs.skip != 'true'
        run: npm ci
      - name: Prepare deterministic upstream update
        id: update
        if: steps.pending.outputs.skip != 'true'
        continue-on-error: true
        run: npm run upstream:update
      - name: Detect reviewable changes
        id: changes
        if: steps.pending.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run complete validation gate
        id: gate
        if: steps.pending.outputs.skip != 'true' && steps.update.outcome == 'success' && steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm run check
      - name: Record complete repository gate
        if: steps.pending.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        shell: bash
        run: |
          if [[ "$UPDATE_OUTCOME" != "success" ]]; then
            result="not run (updater failed)"
          elif [[ "$GATE_OUTCOME" == "success" ]]; then
            result="passed"
          else
            result="failed"
          fi
          printf '\n## Complete repository gate\n\n- `npm run check`: %s\n' "$result" >> upstream-change-summary.md
      - name: Commit and push update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/cloudflare-schema-update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH"
          git add schema-lock.json config/upstream-validation-exceptions.json config/query-projection.json dist postman upstream-change-summary.md
          git commit -m "chore: update Cloudflare API schema"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"
      - name: Create or update review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/cloudflare-schema-update
        shell: bash
        run: |
          pr_number=$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update pinned Cloudflare API schema" \
              --body-file upstream-change-summary.md
          else
            gh pr edit "$pr_number" \
              --title "Update pinned Cloudflare API schema" \
              --body-file upstream-change-summary.md
          fi
      - name: Surface generation or validation failure
        if: steps.pending.outputs.skip != 'true' && (steps.update.outcome == 'failure' || steps.gate.outcome == 'failure')
        run: |
          echo "The update PR was prepared, but generation, validation, or the complete repository check requires review."
          exit 1
