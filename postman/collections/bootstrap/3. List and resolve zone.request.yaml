          pm.environment.set('zone_id', resolved.id);
          pm.variables.set('zone_id', resolved.id);
          pm.variables.unset('_cf_bootstrap_zone_state');
          pm.variables.set('_cf_bootstrap_zone_page', 1);
          pm.execution.setNextRequest(null);
        }
