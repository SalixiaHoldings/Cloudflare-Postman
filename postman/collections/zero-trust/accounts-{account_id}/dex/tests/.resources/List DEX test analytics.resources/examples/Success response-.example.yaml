name: Success response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/tests/overview?colo=SJC&testName=string&deviceId=cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7&deviceId=cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7&registration_id=a1b2c3d4-e5f6-7890-abcd-ef1234567890&page=1&per_page=10&kind=traceroute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: colo
      value: SJC
      description: Optionally filter result stats to a Cloudflare colo. Cannot be used in combination with deviceId param.
    - key: testName
      value: string
      description: Optionally filter results by test name.
    - key: deviceId
      value: cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7
      description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
    - key: deviceId
      value: cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7
      description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
    - key: registration_id
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      description: Optionally filter results to a specific device registration. Must be used in combination with a single deviceId.
    - key: page
      value: "1"
      description: Page number of paginated results
    - key: per_page
      value: "10"
      description: Number of items per page
    - key: kind
      value: traceroute
      description: Filter by test type.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
