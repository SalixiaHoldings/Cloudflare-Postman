$kind: http-example
id: ea2dfab7-4abc-5df0-b398-e301e9da045d
name: Success response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/warp-change-events?page=1&per_page=10&from=2023-09-20T17:00:00Z&to=2023-09-20T17:00:00Z&type=config&toggle=off&config_name=MASQUE&account_name=Myorg&sort_order=ASC"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: from
      value: 2023-09-20T17:00:00Z
      description: (Required) Start time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-09-20T17:00:00Z
      description: (Required) End time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: type
      value: config
      description: Filter events by type 'config' or 'toggle'.
    - key: toggle
      value: off
      description: Filter events by type toggle value. Applicable to type='toggle' events only.
    - key: config_name
      value: MASQUE
      description: Filter events by WARP configuration name changed from or to. Applicable to type='config' events only.
    - key: account_name
      value: Myorg
      description: Filter events by account name.
    - key: sort_order
      value: ASC
      description: Sort response by event timestamp.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
