$kind: http-example
id: 36f71921-e3ef-5955-b959-9004606f065f
name: List WARP change events failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/warp-change-events?page=1&per_page=10&from=2023-09-20T17:00:00Z&to=2023-09-20T17:00:00Z"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: from
      value: 2023-09-20T17:00:00Z
      description: (Required) Start time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-09-20T17:00:00Z
      description: (Required) End time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: type
      value: config
      disabled: true
      description: Filter events by type 'config' or 'toggle'.
    - key: toggle
      value: on
      disabled: true
      description: Filter events by type toggle value. Applicable to type='toggle' events only.
    - key: config_name
      value: MASQUE
      disabled: true
      description: Filter events by WARP configuration name changed from or to. Applicable to type='config' events only.
    - key: account_name
      value: Myorg
      disabled: true
      description: Filter events by account name.
    - key: sort_order
      value: ASC
      disabled: true
      description: Sort response by event timestamp.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
