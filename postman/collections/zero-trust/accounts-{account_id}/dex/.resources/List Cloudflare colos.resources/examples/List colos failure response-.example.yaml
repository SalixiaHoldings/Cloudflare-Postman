$kind: http-example
id: 2e40be5f-6ba6-53f8-9cb4-264fe0de40d1
name: List colos failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/colos?from=2023-08-20T20:45:00Z&to=2023-08-24T20:45:00Z"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: from
      value: 2023-08-20T20:45:00Z
      description: (Required) Start time for connection period in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-08-24T20:45:00Z
      description: (Required) End time for connection period in ISO (RFC3339 - ISO 8601) format.
    - key: sortBy
      value: application-tests-usage
      disabled: true
      description: Type of usage that colos should be sorted by. If unspecified, returns all Cloudflare colos sorted alphabetically.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
