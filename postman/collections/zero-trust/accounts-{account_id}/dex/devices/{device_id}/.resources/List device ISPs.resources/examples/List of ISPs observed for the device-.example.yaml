name: List of ISPs observed for the device.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/{{device_id}}/isps?per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page number of paginated results. Mutually exclusive with cursor.
    - key: per_page
      value: "10"
      description: (Required) Number of items per page
    - key: cursor
      value: string
      disabled: true
      description: Cursor for cursor-based pagination. Mutually exclusive with page.
    - key: sort_by
      value: time_start
      disabled: true
      description: The field to sort results by.
    - key: sort_order
      value: DESC
      disabled: true
      description: The order to sort results.
    - key: from
      value: 1934-06-02T03:59:24.018Z
      disabled: true
      description: Start time for the query in ISO 8601 format.
    - key: to
      value: 1934-06-02T03:59:24.018Z
      disabled: true
      description: End time for the query in ISO 8601 format.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
