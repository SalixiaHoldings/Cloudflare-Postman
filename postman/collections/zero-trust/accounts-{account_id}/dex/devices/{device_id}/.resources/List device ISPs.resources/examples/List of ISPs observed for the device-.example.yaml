$kind: http-example
id: 868301ff-977f-59a2-b58c-ae1905823773
name: List of ISPs observed for the device.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/{{device_id}}/isps?page=1&per_page=10&cursor=string&sort_by=time_start&sort_order=DESC&from=1976-02-19T15:56:07.521Z&to=1976-02-19T15:56:07.521Z"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Page number of paginated results. Mutually exclusive with cursor.
    - key: per_page
      value: "10"
      description: (Required) Number of items per page
    - key: cursor
      value: string
      description: Cursor for cursor-based pagination. Mutually exclusive with page.
    - key: sort_by
      value: time_start
      description: The field to sort results by.
    - key: sort_order
      value: DESC
      description: The order to sort results.
    - key: from
      value: 1976-02-19T15:56:07.521Z
      description: Start time for the query in ISO 8601 format.
    - key: to
      value: 1976-02-19T15:56:07.521Z
      description: End time for the query in ISO 8601 format.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
