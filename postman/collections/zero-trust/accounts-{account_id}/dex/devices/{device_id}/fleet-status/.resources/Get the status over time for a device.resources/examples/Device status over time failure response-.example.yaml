$kind: http-example
id: daec5285-8317-5ba6-9623-1170e3e2dc5c
name: Device status over time failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/{{device_id}}/fleet-status/over-time?from=2023-10-11 00:00:00+00&to=2023-10-11 00:00:00+00&interval=minute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: from
      value: 2023-10-11 00:00:00+00
      description: (Required) Start of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
    - key: to
      value: 2023-10-11 00:00:00+00
      description: (Required) End of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
    - key: interval
      value: minute
      description: (Required) Time interval for aggregate time slots.
    - key: colo
      value: SJC
      disabled: true
      description: List of data centers to filter results.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
