$kind: http-example
id: c031c46d-732a-5d91-aefc-81c909d96342
name: Get the latest status of a device failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/{{device_id}}/fleet-status/live?since_minutes=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: since_minutes
      value: "10"
      description: (Required) Number of minutes before current time.
    - key: time_now
      value: 2023-10-11T00:00:00Z
      disabled: true
      description: Current time in ISO format.
    - key: colo
      value: SJC
      disabled: true
      description: List of data centers to filter results.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
