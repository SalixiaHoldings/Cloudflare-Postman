$kind: http-example
id: 88108dca-d917-5793-a629-8a96577e508e
name: Get the latest status of a device.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/{{device_id}}/fleet-status/live?since_minutes=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: since_minutes
      value: "10"
      description: (Required) Number of minutes before current time.
    - key: time_now
      value: 2023-10-11T00:00:00Z
      disabled: true
      description: Current time in ISO format.
    - key: colo
      value: SJC
      disabled: true
      description: List of data centers to filter results.
