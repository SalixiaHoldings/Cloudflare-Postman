$kind: http-example
id: 768a8f08-b0f6-5dbe-b26a-64a1244fc7b8
name: Update Dex test response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/dex_tests/{{dex_test_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "HTTP dash health check",
        "interval": "30m",
        "enabled": true,
        "data": {
          "host": "https://dash.cloudflare.com",
          "kind": "http",
          "method": "GET"
        },
        "description": "Checks the dash endpoint every 30 minutes",
        "targeted": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
