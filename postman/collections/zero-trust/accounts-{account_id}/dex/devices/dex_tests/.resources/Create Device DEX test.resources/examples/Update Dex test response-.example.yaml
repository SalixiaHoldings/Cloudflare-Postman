$kind: http-example
id: f6850cfd-f3f3-5864-bb5f-f73f02b4e557
name: Update Dex test response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/devices/dex_tests"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "HTTP dash health check",
        "interval": "30m",
        "enabled": true,
        "data": {
          "host": "https://dash.cloudflare.com",
          "kind": "http",
          "method": "GET"
        },
        "description": "Checks the dash endpoint every 30 minutes",
        "targeted": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
