id: 6b2ff88f-034c-5929-b068-bc6a7bc12596
name: Create commands response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commands": [
          {
            "device_id": "{{commands__0__device_id}}",
            "user_email": "{{commands__0__user_email}}",
            "type": "pcap"
          },
          {
            "device_id": "{{commands__1__device_id}}",
            "user_email": "{{commands__1__user_email}}",
            "type": "pcap"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
