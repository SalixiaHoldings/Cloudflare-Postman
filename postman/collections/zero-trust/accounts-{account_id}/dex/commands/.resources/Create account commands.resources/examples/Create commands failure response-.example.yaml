$kind: http-example
id: bc4f732c-5864-5b0c-b5dd-fd4d7ff6e890
name: Create commands failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commands": [
          {
            "device_id": "{{commands__0__device_id}}",
            "user_email": "{{commands__0__user_email}}",
            "type": "pcap"
          },
          {
            "device_id": "{{commands__1__device_id}}",
            "user_email": "{{commands__1__user_email}}",
            "type": "pcap"
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
