$kind: http-example
id: 4c1b3f60-26c3-5ab4-8424-b69be350c103
name: Get commands failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands?page=1&per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: from
      value: 2023-08-20T20:45:00Z
      disabled: true
      description: Start time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-08-24T20:45:00Z
      disabled: true
      description: End time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: device_id
      value: string
      disabled: true
      description: Unique identifier for a device.
    - key: user_email
      value: string
      disabled: true
      description: Email tied to the device.
    - key: command_type
      value: pcap
      disabled: true
      description: Optionally filter executed commands by command type.
    - key: status
      value: SUCCESS
      disabled: true
      description: Optionally filter executed commands by status.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
