$kind: http-example
id: 647e7ecd-8c8d-5d2d-b0a6-56ca58af8f67
name: Get commands failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands?page=1&per_page=10&from=2023-08-20T20:45:00Z&to=2023-08-24T20:45:00Z&device_id=string&user_email=string&command_type=speed-test&status=PENDING_UPLOAD"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: from
      value: 2023-08-20T20:45:00Z
      description: Start time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-08-24T20:45:00Z
      description: End time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: device_id
      value: string
      description: Unique identifier for a device.
    - key: user_email
      value: string
      description: Email tied to the device.
    - key: command_type
      value: speed-test
      description: Optionally filter executed commands by command type.
    - key: status
      value: PENDING_UPLOAD
      description: Optionally filter executed commands by status.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
