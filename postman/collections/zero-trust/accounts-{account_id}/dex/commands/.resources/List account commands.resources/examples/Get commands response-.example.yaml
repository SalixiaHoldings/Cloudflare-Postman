$kind: http-example
id: aff0532f-a156-5522-b4c1-5779d1600660
name: Get commands response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands?page=1&per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: from
      value: 2023-08-20T20:45:00Z
      disabled: true
      description: Start time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: to
      value: 2023-08-24T20:45:00Z
      disabled: true
      description: End time for the query in ISO (RFC3339 - ISO 8601) format.
    - key: device_id
      value: string
      disabled: true
      description: Unique identifier for a device.
    - key: user_email
      value: string
      disabled: true
      description: Email tied to the device.
    - key: command_type
      value: warp-diag
      disabled: true
      description: Optionally filter executed commands by command type.
    - key: status
      value: PENDING_UPLOAD
      disabled: true
      description: Optionally filter executed commands by status.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
