name: List of eligible devices.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands/devices?page=1&per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: search
      value: string
      disabled: true
      description: Filter devices by name or email.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
