$kind: http-example
id: a1aa32f0-e5fe-522f-a777-05a5040e87a3
name: List eligible devices failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands/devices?page=1&per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: search
      value: string
      disabled: true
      description: Filter devices by name or email.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
