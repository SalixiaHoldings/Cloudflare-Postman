$kind: http-example
id: eb3e9c79-1ec1-5968-893c-9aad1c176150
name: Get command artifacts response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/commands/{{command_id}}/downloads/{{filename}}"
  method: GET
  headers:
    Accept: application/zip
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Accept-Ranges
      value: bytes
      description: Indicates that the file supports byte-range requests.
    - key: Content-Disposition
      value: attachment; filename*=example.zip
      description: Indicates that the file should be treated as an attachment for downloading
    - key: Content-Encoding
      value: gzip
      description: Specifies the encoding of the file content, if any.
    - key: Content-Length
      value: "7426"
      description: The size of the file in bytes.
    - key: ETag
      value: 34f9b5e9c8a6
      description: The entity tag of the file for cache validation.
    - key: Last-Modified
      value: 1957-10-24T06:14:49.156Z
      description: The last modification date of the file.
    - key: Content-Type
      value: application/zip
  body:
    type: text
    content: string
order: 1000
