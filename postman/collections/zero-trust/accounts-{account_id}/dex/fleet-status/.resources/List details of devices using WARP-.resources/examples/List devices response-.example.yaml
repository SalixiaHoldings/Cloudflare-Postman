$kind: http-example
id: 2673505b-a112-5e44-afa8-ed99679fd9fc
name: List devices response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/fleet-status/devices?to=2023-10-11 00:00:00+00&from=2023-10-11 00:00:00+00&page=1&per_page=10&sort_by=timestamp&colo=SJC&device_id=cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7&mode=proxy&status=connected&platform=windows&version=1.0.0&source=last_seen"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: to
      value: 2023-10-11 00:00:00+00
      description: (Required) End of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
    - key: from
      value: 2023-10-11 00:00:00+00
      description: (Required) Start of the time range to query. Timestamp can be provided in ISO 8601 datetime format or milliseconds since epoch.
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: sort_by
      value: timestamp
      description: Dimension to sort results by.
    - key: colo
      value: SJC
      description: Cloudflare colo airport code.
    - key: device_id
      value: cb49c27f-7f97-49c5-b6f3-f7c01ead0fd7
      description: Device-specific ID, given as UUID.
    - key: mode
      value: proxy
      description: The mode under which the WARP client is run.
    - key: status
      value: connected
      description: Network status.
    - key: platform
      value: windows
      description: Operating system.
    - key: version
      value: 1.0.0
      description: WARP client version.
    - key: source
      value: last_seen
      description: |
        Source:
          * `hourly` - device details aggregated hourly, up to 7 days prior
          * `last_seen` - device details, up to 60 minutes prior. Time windows exceeding 60 minutes will be rejected from June 1st, 2026. Please use 'hourly' or 'raw' instead for longer time ranges.
          * `raw` - device details, up to 7 days prior
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
