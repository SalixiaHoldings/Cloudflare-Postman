name: DEX traceroute test details response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/traceroute-tests/{{test_id}}?from=string&to=string&interval=minute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: deviceId
      value: string
      disabled: true
      description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
    - key: deviceId
      value: string
      disabled: true
      description: Optionally filter result stats to a specific device(s). Cannot be used in combination with colo param.
    - key: from
      value: string
      description: (Required) Start time for aggregate metrics in ISO ms.
    - key: to
      value: string
      description: (Required) End time for aggregate metrics in ISO ms.
    - key: interval
      value: minute
      description: (Required) Time interval for aggregate time slots.
    - key: colo
      value: string
      disabled: true
      description: Optionally filter result stats to a Cloudflare colo. Cannot be used in combination with deviceId param.
