$kind: http-example
id: b9e60a3d-ea72-5d08-8154-4f3330020a92
name: DEX traceroute test network path response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/traceroute-tests/{{test_id}}/network-path?deviceId=string&from=string&to=string&interval=minute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: deviceId
      value: string
      description: (Required) Device to filter traceroute result runs to.
    - key: from
      value: string
      description: (Required) Start time for aggregate metrics in ISO ms.
    - key: to
      value: string
      description: (Required) End time for aggregate metrics in ISO ms.
    - key: interval
      value: minute
      description: (Required) Time interval for aggregate time slots.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
