$kind: http-example
id: 921da164-0ae5-5fa4-82ca-9dd3ed379686
name: DEX traceroute test network path failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/traceroute-tests/{{test_id}}/network-path?deviceId=string&from=string&to=string&interval=minute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: deviceId
      value: string
      description: (Required) Device to filter traceroute result runs to.
    - key: from
      value: string
      description: (Required) Start time for aggregate metrics in ISO ms.
    - key: to
      value: string
      description: (Required) End time for aggregate metrics in ISO ms.
    - key: interval
      value: minute
      description: (Required) Time interval for aggregate time slots.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
