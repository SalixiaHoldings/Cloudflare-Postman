$kind: http-example
id: 5fa022a6-ea27-57ad-9124-c36be10ee755
name: List DEX Rules failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/rules?page=1&per_page=10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: sort_order
      value: ASC
      disabled: true
      description: Sort direction for sort_by property.
    - key: sort_by
      value: name
      disabled: true
      description: Which property to sort results by.
    - key: name
      value: string
      disabled: true
      description: Filter results by rule name.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
