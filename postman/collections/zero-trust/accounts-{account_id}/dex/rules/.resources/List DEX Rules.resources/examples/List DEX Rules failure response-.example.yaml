name: List DEX Rules failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dex/rules?page=1&per_page=10&sort_order=ASC&sort_by=name&name=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: (Required) Page number of paginated results.
    - key: per_page
      value: "10"
      description: (Required) Number of results per page.
    - key: sort_order
      value: ASC
      description: Sort direction for sort_by property.
    - key: sort_by
      value: name
      description: Which property to sort results by.
    - key: name
      value: string
      description: Filter results by rule name.
