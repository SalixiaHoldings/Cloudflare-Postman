name: List device settings profiles response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/policies"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: profile_type
      value: warp
      disabled: true
      description: Filter profiles by client type. When omitted, only WARP profiles are returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
