id: cbe8aa46-7084-58f2-beda-1fcffa578758
name: List device settings profiles response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/policies"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: profile_type
      value: warp
      disabled: true
      description: Filter profiles by client type. When omitted, only WARP profiles are returned.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
