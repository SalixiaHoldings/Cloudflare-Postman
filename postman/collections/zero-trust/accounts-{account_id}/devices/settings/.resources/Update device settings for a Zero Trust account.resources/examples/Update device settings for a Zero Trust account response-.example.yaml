$kind: http-example
id: 6c0b307c-22be-5522-a330-b9465a9d00bd
name: Update device settings for a Zero Trust account response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/settings"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "disable_for_time": 7076.681721955538,
        "external_emergency_signal_enabled": true,
        "external_emergency_signal_fingerprint": "abcd1234567890abcd1234567890abcd1234567890abcd1234567890abcd1234",
        "external_emergency_signal_interval": "5m",
        "external_emergency_signal_url": "https://192.0.2.1/signal",
        "gateway_proxy_enabled": true,
        "gateway_udp_proxy_enabled": true,
        "root_certificate_installation_enabled": true,
        "use_zt_virtual_ip": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
