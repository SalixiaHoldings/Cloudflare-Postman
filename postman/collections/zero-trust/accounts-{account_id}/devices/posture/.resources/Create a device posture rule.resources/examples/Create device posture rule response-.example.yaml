$kind: http-example
id: d5d4592a-796a-52a4-a4fd-5953c6316259
name: Create device posture rule response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/posture"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "Admin Serial Numbers",
        "type": "file",
        "description": "The rule for admin serial numbers",
        "expiration": "1h",
        "input": {
          "path": "/bin/cat",
          "operating_system": "mac"
        },
        "schedule": "1h"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
