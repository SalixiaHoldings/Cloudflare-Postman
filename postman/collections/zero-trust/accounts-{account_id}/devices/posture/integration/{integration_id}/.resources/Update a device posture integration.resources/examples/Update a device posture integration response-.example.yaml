id: c38e5db7-f847-544a-8ee9-92ba97e050d9
name: Update a device posture integration response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/posture/integration/{{integration_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "config": {
          "api_url": "https://as123.awmdm.com/API",
          "auth_url": "https://na.uemauth.workspaceone.com/connect/token",
          "client_id": "example client id",
          "client_secret": "{{client_secret}}"
        },
        "interval": "10m",
        "name": "My Workspace One Integration",
        "type": "workspace_one"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
