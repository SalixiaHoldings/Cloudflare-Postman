$kind: http-example
id: a080abcb-2b95-582e-b4de-25eea4257b89
name: Create a device posture integration response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/posture/integration"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "My Workspace One Integration",
        "type": "workspace_one",
        "interval": "10m",
        "config": {
          "api_url": "https://as123.awmdm.com/API",
          "auth_url": "https://na.uemauth.workspaceone.com/connect/token",
          "client_id": "example client id",
          "client_secret": "{{client_secret}}"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
