$kind: http-example
id: c5f8303c-1df4-5838-845e-1d6ee7726abc
name: Returns a list of Devices.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/physical-devices"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      disabled: true
      description: Opaque token indicating the starting position when requesting the next set of records. A cursor value can be obtained from the result_info.cursor field in the response.
    - key: sort_by
      value: id
      disabled: true
      description: The device field to order results by.
    - key: sort_order
      value: desc
      disabled: true
      description: Sort direction.
    - key: last_seen_user.email
      value: string
      disabled: true
      description: Filter by the last seen user's email.
    - key: seen_after
      value: string
      disabled: true
      description: Filter by the last_seen timestamp - returns only devices last seen after this timestamp.
    - key: seen_before
      value: string
      disabled: true
      description: Filter by the last_seen timestamp - returns only devices last seen before this timestamp.
    - key: per_page
      value: "4486"
      disabled: true
      description: The maximum number of devices to return in a single response.
    - key: search
      value: string
      disabled: true
      description: Search by device details.
    - key: active_registrations
      value: exclude
      disabled: true
      description: Include or exclude devices with active registrations. The default is "only" - return only devices with active registrations.
    - key: has_registration_type
      value: warp
      disabled: true
      description: Filter by the type of active registration associated with the device.
    - key: id
      value: string
      disabled: true
      description: Filter by a one or more device IDs.
    - key: id
      value: string
      disabled: true
      description: Filter by a one or more device IDs.
    - key: last_seen_registration.policy.id
      value: 11ffb86f-3f0c-4306-b4a2-e62f872b166a
      disabled: true
      description: Filter by the ID of the device settings profile assigned to the device registration.
    - key: include
      value: string
      disabled: true
      description: |
        Comma-separated list of additional information that should be included in the device response. Supported values are: "last_seen_registration.policy".
