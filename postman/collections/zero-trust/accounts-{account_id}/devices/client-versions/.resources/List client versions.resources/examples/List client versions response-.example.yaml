name: List client versions response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/client-versions?target_environment=string&release_track=ga"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: target_environment
      value: string
      description: (Required) The target environment for the client version (e.g., windows, macos).
    - key: release_track
      value: ga
      description: (Required) The release track (ga for General Availability, beta for Beta releases).
    - key: page
      value: "1"
      disabled: true
      description: The page number to return.
    - key: per_page
      value: "20"
      disabled: true
      description: The maximum number of versions to return per page.
