$kind: http-example
id: f800a4a4-7062-50aa-b8ae-0b0a12e2d014
name: Client error response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/client-versions?target_environment=string&release_track=ga"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: target_environment
      value: string
      description: (Required) The target environment for the client version (e.g., windows, macos).
    - key: release_track
      value: ga
      description: (Required) The release track (ga for General Availability, beta for Beta releases).
    - key: page
      value: "1"
      disabled: true
      description: The page number to return.
    - key: per_page
      value: "20"
      disabled: true
      description: The maximum number of versions to return per page.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {},
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 2000
