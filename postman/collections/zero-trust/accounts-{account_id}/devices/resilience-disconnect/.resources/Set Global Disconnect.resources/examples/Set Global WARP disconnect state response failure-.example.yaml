$kind: http-example
id: 2f88bc19-0428-5e4e-835c-869e0eddafce
name: Set Global WARP disconnect state response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/resilience/disconnect"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "disconnect": false,
        "justification": "Turning off WARP for testing purposes."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
