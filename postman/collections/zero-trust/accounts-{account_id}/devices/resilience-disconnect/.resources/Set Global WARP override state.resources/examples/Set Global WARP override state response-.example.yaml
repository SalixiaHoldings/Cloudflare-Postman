$kind: http-example
id: ed84ea65-715a-54b3-86a8-4abb38e8a008
name: Set Global WARP override state response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/resilience/disconnect"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "disconnect": false,
        "justification": "Turning off WARP for testing purposes."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
