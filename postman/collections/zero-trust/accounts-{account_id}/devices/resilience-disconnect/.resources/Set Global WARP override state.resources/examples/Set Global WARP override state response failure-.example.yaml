name: Set Global WARP override state response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/devices/resilience/disconnect"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "disconnect": false,
        "justification": "Turning off WARP for testing purposes."
      }
