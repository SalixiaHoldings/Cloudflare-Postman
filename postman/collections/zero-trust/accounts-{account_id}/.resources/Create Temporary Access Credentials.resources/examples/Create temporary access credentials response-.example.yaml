$kind: http-example
id: 3b2b4f72-c68a-5452-b1af-553c95b0b815
name: Create temporary access credentials response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/temp-access-credentials"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "bucket": "example-bucket",
        "objects": [
          "example-object"
        ],
        "parentAccessKeyId": "example-access-key-id",
        "permission": "object-read-write",
        "prefixes": [
          "example-prefix/"
        ],
        "ttlSeconds": 3600
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
