id: 669a2b3b-08ff-59b8-8c76-f802b5ee5961
name: Update applications review status response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/gateway/apps/review_status"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "approved_apps": [
          0,
          0
        ],
        "unapproved_apps": [
          0,
          0
        ],
        "in_review_apps": [
          0,
          0
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
