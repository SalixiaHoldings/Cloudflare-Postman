$kind: http-example
id: d0c3003f-90fd-5130-8ff8-9217e0acdc7c
name: Zero Trust account configuration response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/gateway/configuration"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "settings": {
          "certificate": {
            "id": "d1b364c5-1311-466e-a194-f0e943e0799f"
          },
          "custom_certificate": {
            "enabled": true
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
