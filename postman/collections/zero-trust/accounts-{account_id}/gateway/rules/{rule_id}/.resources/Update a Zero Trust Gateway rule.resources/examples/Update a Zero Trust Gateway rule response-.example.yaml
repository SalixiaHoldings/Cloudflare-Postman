$kind: http-example
id: 8a4ecb90-754c-59d4-9003-c1909f18efe8
name: Update a Zero Trust Gateway rule response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/gateway/rules/{{rule_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "block bad websites",
        "action": "allow",
        "description": "Block bad websites based on their host name.",
        "device_posture": "any(device_posture.checks.passed[*] in {\"1308749e-fcfb-4ebc-b051-fe022b632644\"})",
        "enabled": true,
        "expiration": {
          "expires_at": "2014-01-01T05:20:00.12345Z"
        },
        "filters": [
          "http"
        ],
        "identity": "any(identity.groups.name[*] in {\"finance\"})",
        "precedence": 9129,
        "rule_settings": {
          "block_page": {
            "target_uri": "{{rule_settings__block_page__target_uri}}"
          },
          "redirect": {
            "target_uri": "{{rule_settings__redirect__target_uri}}"
          }
        },
        "traffic": "http.request.uri matches \".*a/partial/uri.*\" and http.request.host in $01302951-49f9-47c9-a400-0297e60b6a10"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
