$kind: http-example
id: 833dc9ea-460a-58f4-9487-99cf32743a29
name: Patch a Zero Trust Gateway rule response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/gateway/rules/{{rule_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "description": "Block bad websites based on their host name.",
        "enabled": true,
        "name": "block bad websites",
        "precedence": 9886
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
