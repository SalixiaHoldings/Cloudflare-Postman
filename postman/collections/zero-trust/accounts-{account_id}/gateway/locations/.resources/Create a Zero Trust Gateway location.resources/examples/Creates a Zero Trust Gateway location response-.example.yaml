$kind: http-example
id: 7e509d2c-5c9f-5b32-a3ef-8ebe26b3f624
name: Creates a Zero Trust Gateway location response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/gateway/locations"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "Austin Office Location",
        "client_default": false,
        "dns_destination_ips_id": "0e4a32c6-6fb8-4858-9296-98f51631e8e6",
        "ecs_support": false,
        "endpoints": {
          "ipv4": {},
          "ipv6": {},
          "doh": {},
          "dot": {}
        },
        "max_ttl": {
          "mode": "inherit"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
