name: Data class created successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/data_classes"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "expression": "string",
        "sensitivity_levels": [
          {
            "group_id": "{{sensitivity_levels__0__group_id}}",
            "level_id": "{{sensitivity_levels__0__level_id}}"
          },
          {
            "group_id": "{{sensitivity_levels__1__group_id}}",
            "level_id": "{{sensitivity_levels__1__level_id}}"
          }
        ],
        "data_tags": [
          "26420f68-3d3a-4f83-702d-10a4f81c9e47",
          "599f90ca-9a0e-e3c1-e332-c8f7fce1d964"
        ],
        "description": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
