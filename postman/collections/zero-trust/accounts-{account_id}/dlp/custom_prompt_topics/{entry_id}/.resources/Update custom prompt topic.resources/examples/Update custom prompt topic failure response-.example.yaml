id: cb6777e6-5df8-5af8-bad8-0d29c44ac3a6
name: Update custom prompt topic failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics/{{entry_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": true,
        "topic": "string",
        "description": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
