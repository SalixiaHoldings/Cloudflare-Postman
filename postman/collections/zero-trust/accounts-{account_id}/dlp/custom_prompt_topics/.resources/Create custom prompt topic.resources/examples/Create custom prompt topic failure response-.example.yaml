$kind: http-example
id: c5f0be50-0f40-5018-8319-72835d014f0d
name: Create custom prompt topic failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": false,
        "topic": "str",
        "description": "string",
        "profile_id": "163db160-bf98-c905-1f81-cfc5ab1fba20"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
