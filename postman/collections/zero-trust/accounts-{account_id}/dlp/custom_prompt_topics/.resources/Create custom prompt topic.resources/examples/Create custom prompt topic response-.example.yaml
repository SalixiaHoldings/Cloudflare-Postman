$kind: http-example
id: 1ec0bfbc-8882-5107-a7b4-8d8b4a23c159
name: Create custom prompt topic response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": false,
        "topic": "string",
        "description": "string",
        "profile_id": "a163db16-8bf9-9c90-b1f8-ecfc5ab1fba2"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
