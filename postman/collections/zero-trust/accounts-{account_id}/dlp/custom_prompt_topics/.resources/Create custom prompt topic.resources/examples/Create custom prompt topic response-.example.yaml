$kind: http-example
id: 9d698ce0-c963-5f1a-9fb0-1bc50222ab6a
name: Create custom prompt topic response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": false,
        "topic": "str",
        "description": "string",
        "profile_id": "163db160-bf98-c905-1f81-cfc5ab1fba20"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
