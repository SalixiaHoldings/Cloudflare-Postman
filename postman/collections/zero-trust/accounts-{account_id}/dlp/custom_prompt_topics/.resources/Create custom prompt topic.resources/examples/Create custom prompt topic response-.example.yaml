$kind: http-example
id: 9b6fed0c-d02c-5df2-8a19-b08e97fd9dc0
name: Create custom prompt topic response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": true,
        "topic": "string",
        "description": "string",
        "profile_id": "5c8f7fce-9649-5e9b-0a4b-75352133e542"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
