$kind: http-example
id: 62fd4531-dffe-54e3-820e-7ab213adb02d
name: Create custom prompt topic response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/custom_prompt_topics"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "enabled": true,
        "topic": "string",
        "description": "string",
        "profile_id": "0811ffa1-db16-e8bf-89c9-5b1f81ecfc5a"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
