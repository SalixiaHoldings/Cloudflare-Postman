$kind: http-example
id: ec49cd09-3c56-55aa-a481-c1eaa4b8b8ff
name: Update entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/custom/{{entry_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "{{name}}",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
