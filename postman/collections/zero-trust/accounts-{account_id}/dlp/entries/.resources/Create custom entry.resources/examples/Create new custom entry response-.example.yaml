$kind: http-example
id: 1e08dc00-0baf-591a-a224-f778dbeec570
name: Create new custom entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "enabled": true,
        "description": "string",
        "profile_id": "f5361d98-2587-f733-8527-ed70a7fe936d"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
