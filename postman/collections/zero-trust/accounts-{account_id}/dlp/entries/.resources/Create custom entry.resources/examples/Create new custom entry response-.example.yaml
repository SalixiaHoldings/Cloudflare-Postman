$kind: http-example
id: dca13fbf-2db0-5ca2-82cf-ddb2ea2ad942
name: Create new custom entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "enabled": false,
        "description": "string",
        "profile_id": "c270611c-f664-9e83-0e08-bcc664345c2c"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
