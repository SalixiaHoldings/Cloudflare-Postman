$kind: http-example
id: 7dd7f40d-5f51-5bc7-b190-97bdb94c63c3
name: Create new custom entry failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "enabled": true,
        "description": "string",
        "profile_id": "f5361d98-2587-f733-8527-ed70a7fe936d"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
