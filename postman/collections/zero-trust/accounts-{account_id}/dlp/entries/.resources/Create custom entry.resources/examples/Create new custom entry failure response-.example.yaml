$kind: http-example
id: 46797592-7182-5d15-84fe-dc27ec0e0732
name: Create new custom entry failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "enabled": false,
        "description": "string",
        "profile_id": "c270611c-f664-9e83-0e08-bcc664345c2c"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
