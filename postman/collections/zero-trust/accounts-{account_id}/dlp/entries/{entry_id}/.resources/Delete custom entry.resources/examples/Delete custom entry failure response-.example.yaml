name: Delete custom entry failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/{{entry_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
