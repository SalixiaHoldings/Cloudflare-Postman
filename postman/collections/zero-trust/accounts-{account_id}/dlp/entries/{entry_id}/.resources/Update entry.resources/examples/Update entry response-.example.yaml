id: af5c439d-29b4-5641-b259-8b67421deba1
name: Update entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/{{entry_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": false,
        "name": "{{name}}",
        "pattern": {
          "regex": "{{pattern__regex}}"
        },
        "type": "custom"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
