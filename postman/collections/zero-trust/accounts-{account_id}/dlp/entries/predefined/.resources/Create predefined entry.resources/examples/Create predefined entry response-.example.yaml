$kind: http-example
id: 2eb919e0-4f63-51d9-b5fb-e4a015914714
name: Create predefined entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/predefined"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "entry_id": "db3cdaff-fbf1-4a21-150d-dd28ba9131ed",
        "profile_id": "761b0da6-1fcd-ce03-716d-659e8f2c2706"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
