id: 97da5374-9fc4-5107-8af3-958f47e3d3c8
name: Create predefined entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/predefined"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "entry_id": "b3cdaff1-bf1e-a219-50dd-d28ba9131ed9",
        "profile_id": "61b0da6b-fcd3-e032-16d9-59e8f2c27061"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
