name: Create predefined entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/predefined"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "entry_id": "3a4444f2-072b-b745-29b3-34227d1618d8",
        "profile_id": "6f7fa2d1-8bd9-8a39-5eab-55c77b6797e3"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
