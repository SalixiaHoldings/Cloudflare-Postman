  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": false,
        "entry_id": "1db3cdaf-6fbf-e4a2-9150-ddd28ba9131e",
        "profile_id": "f761b0da-01fc-3ce0-2716-9659e8f2c270"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
