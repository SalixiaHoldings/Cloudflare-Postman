$kind: http-example
id: ee69cb73-6c98-5b93-9303-2fdf5af82915
name: Update predefined entry response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/entries/predefined/{{entry_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
