$kind: http-example
id: d87b324d-e058-58df-b1b8-4792cef3fb95
name: Update custom profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/custom/{{profile_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "ai_context_enabled": false,
        "allowed_match_count": 4310,
        "confidence_threshold": "low",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        },
        "data_classes": [
          "dc19dc8b-cb9c-97bf-359a-486c6124cfc4",
          "b88b90ff-ebb5-11a9-09a7-e8a857387df7"
        ],
        "data_tags": [
          "f3da2c6d-11ea-260b-362c-50072b4e7c56",
          "c2ff70f6-2193-dab6-ec9c-a0e2f1a34daa"
        ],
        "description": "string",
        "ocr_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
