$kind: http-example
id: c6b4ccf3-8db1-5cdf-a90b-b0f1871ee734
name: Update custom profile failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/custom/{{profile_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "ai_context_enabled": false,
        "allowed_match_count": 59,
        "confidence_threshold": "low",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        },
        "data_classes": [
          "dab6dec9-a0e2-1a34-aa4f-b60e5be63fbd",
          "5f05101d-a6f0-9392-5f66-e8d564f08e2f"
        ],
        "data_tags": [
          "02ebb927-f1db-d1f8-b447-22b5389d72a2",
          "d4de38a4-2299-5a48-e5f5-aa1819df325f"
        ],
        "description": "string",
        "ocr_enabled": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
