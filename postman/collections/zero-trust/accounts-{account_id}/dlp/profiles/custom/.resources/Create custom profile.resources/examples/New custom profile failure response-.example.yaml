$kind: http-example
id: 2c5d335f-aab6-5c3a-a550-73bfca451432
name: New custom profile failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/custom"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        },
        "data_classes": [
          "4f286072-b745-29b3-3422-d1618d8256f7",
          "2d1278bd-8a39-5eab-55c7-b6797e3195ac"
        ],
        "data_tags": [
          "56cc01d1-1253-85a1-5ed7-76312c2db0fb",
          "ad13f568-373b-0927-bcb0-b7bd1fae3deb"
        ],
        "description": "string",
        "ocr_enabled": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
