$kind: http-example
id: 90382903-06f7-5c1d-876f-f50f73d29a88
name: New custom profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/custom"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        },
        "data_classes": [
          "b3a4444f-6072-5b74-b29b-034227d1618d",
          "56f7fa2d-78bd-98a3-75ea-c55c77b6797e"
        ],
        "data_tags": [
          "5ac4db56-01d1-a125-085a-f5ed7a76312c",
          "b0fbe3ad-f568-b373-b092-8bcb0bb7bd1f"
        ],
        "description": "string",
        "ocr_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
