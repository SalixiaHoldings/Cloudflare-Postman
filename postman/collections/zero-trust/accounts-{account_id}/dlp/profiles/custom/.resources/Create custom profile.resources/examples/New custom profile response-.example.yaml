$kind: http-example
id: 5c25d0dd-b158-5ad7-8f45-29c0c49cc088
name: New custom profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/custom"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        },
        "data_classes": [
          "b373bb09-8bcb-bb7b-1fae-deba2cea2920",
          "551d3e9e-4cfa-fea0-327f-c18fa4ff11ab"
        ],
        "data_tags": [
          "dc607975-1d42-365a-62ae-0982c1de4159",
          "ee8e7d6c-32ec-14c6-03b1-04751b86d55d"
        ],
        "description": "string",
        "ocr_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
