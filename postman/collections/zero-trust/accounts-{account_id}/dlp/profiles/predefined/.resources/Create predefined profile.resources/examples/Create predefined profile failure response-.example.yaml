    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "profile_id": "396f396a-c173-5a6e-625c-39c64a89ac9f",
