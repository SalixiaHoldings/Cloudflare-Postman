id: 5c9b8d17-c4ad-5c28-80b5-fca6394c4d68
name: Create predefined profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/predefined"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "profile_id": "03427f9b-c326-0971-e5a7-96c8573507ec",
        "context_awareness": {
          "enabled": false,
          "skip": {
            "files": false
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
