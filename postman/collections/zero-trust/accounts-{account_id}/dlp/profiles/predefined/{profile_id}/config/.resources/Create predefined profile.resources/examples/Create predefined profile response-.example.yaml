$kind: http-example
id: 60274f94-2ebb-57a9-a8cc-46fa94f6c0f3
name: Create predefined profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/predefined/{{profile_id}}/config"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "enabled_entries": [
          "ee0150b1-c771-64e5-2ee5-64565c045558",
          "c6ab50c1-5c45-d50e-89bd-cb892302e000"
        ],
        "ocr_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
