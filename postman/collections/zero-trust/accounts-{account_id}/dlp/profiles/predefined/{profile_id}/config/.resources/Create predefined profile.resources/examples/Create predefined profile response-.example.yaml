$kind: http-example
id: 99550720-b1b6-5b1a-bd16-4a3450825566
name: Create predefined profile response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/predefined/{{profile_id}}/config"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "enabled_entries": [
          "5605aa3d-7e73-ca4f-0c4e-6203427f9bb0",
          "26009714-a7b9-c857-507e-ab553c222019"
        ],
        "ocr_enabled": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
