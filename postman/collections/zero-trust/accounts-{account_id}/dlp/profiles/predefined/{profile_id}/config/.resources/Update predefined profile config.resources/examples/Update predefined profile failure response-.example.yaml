$kind: http-example
id: de216ebf-bd4e-5a2d-ab0c-c45776df28cc
name: Update predefined profile failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles/predefined/{{profile_id}}/config"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "ai_context_enabled": false,
        "allowed_match_count": 5,
        "confidence_threshold": "low",
        "enabled_entries": [
          "90560df0-7c91-0ab5-2f55-032cb25c44ba",
          "83fbec8b-bc4d-d9d7-b964-18b4aef4398f"
        ],
        "ocr_enabled": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
