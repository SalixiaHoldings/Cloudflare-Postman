id: b9e4fe97-57c1-5331-936b-303d0d7f9445
name: List all profiles failure response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/profiles"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: all
      value: "true"
      disabled: true
      description: Return all profiles, including those that current account does not have access to.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
