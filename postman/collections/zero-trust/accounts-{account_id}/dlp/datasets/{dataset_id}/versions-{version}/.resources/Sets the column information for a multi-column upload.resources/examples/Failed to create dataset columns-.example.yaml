id: 69c284a6-6b6b-5541-a008-5a30cddec144
name: Failed to create dataset columns.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/datasets/{{dataset_id}}/versions/{{version}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      [
        {
          "header_name": "{{0__header_name}}",
          "num_cells": 0,
          "entry_id": "{{0__entry_id}}"
        },
        {
          "header_name": "{{1__header_name}}",
          "num_cells": 0,
          "entry_id": "{{1__entry_id}}"
        }
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
