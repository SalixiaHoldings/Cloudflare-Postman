$kind: http-example
id: b689cc1f-435d-5249-a291-8259ac2faa75
name: Dataset columns created successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dlp/datasets/{{dataset_id}}/versions/{{version}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      [
        {
          "header_name": "{{0__header_name}}",
          "num_cells": 0,
          "entry_id": "{{0__entry_id}}"
        },
        {
          "header_name": "{{1__header_name}}",
          "num_cells": 0,
          "entry_id": "{{1__entry_id}}"
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
