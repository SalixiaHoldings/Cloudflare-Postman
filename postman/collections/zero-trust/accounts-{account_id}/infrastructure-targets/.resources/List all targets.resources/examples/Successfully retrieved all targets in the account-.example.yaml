$kind: http-example
id: bed2c308-e76e-55e1-baff-d5ae065ab560
name: Successfully retrieved all targets in the account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/infrastructure/targets"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: hostname
      value: string
      disabled: true
      description: Hostname of a target
    - key: hostname_contains
      value: string
      disabled: true
      description: Partial match to the hostname of a target
    - key: virtual_network_id
      value: a8764ca7-64fb-e3e7-6734-04ee6680948e
      disabled: true
      description: Private virtual network identifier of the target
    - key: ip_v4
      value: string
      disabled: true
      description: IPv4 address of the target
    - key: ip_v6
      value: string
      disabled: true
      description: IPv6 address of the target
    - key: created_before
      value: 1921-02-08T04:32:26.349Z
      disabled: true
      description: Date and time at which the target was created before (inclusive)
    - key: created_after
      value: 1921-02-08T04:32:26.349Z
      disabled: true
      description: Date and time at which the target was created after (inclusive)
    - key: modified_before
      value: 1921-02-08T04:32:26.349Z
      disabled: true
      description: Date and time at which the target was modified before (inclusive)
    - key: modified_after
      value: 1921-02-08T04:32:26.349Z
      disabled: true
      description: Date and time at which the target was modified after (inclusive)
    - key: ips
      value: string
      disabled: true
      description: |-
        Filters for targets that have any of the following IP addresses. Specify
        `ips` multiple times in query parameter to build list of candidates.
    - key: ips
      value: string
      disabled: true
      description: |-
        Filters for targets that have any of the following IP addresses. Specify
        `ips` multiple times in query parameter to build list of candidates.
    - key: target_ids
      value: 96579c68-079d-8a83-1fd4-5b44f5da7098
      disabled: true
      description: |-
        Filters for targets that have any of the following UUIDs. Specify
        `target_ids` multiple times in query parameter to build list of
        candidates.
    - key: target_ids
      value: 93d97983-bc2e-83dc-d255-e7409d79f69c
      disabled: true
      description: |-
        Filters for targets that have any of the following UUIDs. Specify
        `target_ids` multiple times in query parameter to build list of
        candidates.
    - key: ip_like
      value: string
      disabled: true
      description: |-
        Filters for targets whose IP addresses look like the specified string.
        Supports `*` as a wildcard character
    - key: ipv4_start
      value: string
      disabled: true
      description: |-
        Defines an IPv4 filter range's starting value (inclusive). Requires
        `ipv4_end` to be specified as well.
    - key: ipv4_end
      value: string
      disabled: true
      description: |-
        Defines an IPv4 filter range's ending value (inclusive). Requires
        `ipv4_start` to be specified as well.
    - key: ipv6_start
      value: string
      disabled: true
      description: |-
        Defines an IPv6 filter range's starting value (inclusive). Requires
        `ipv6_end` to be specified as well.
    - key: ipv6_end
      value: string
      disabled: true
      description: |-
        Defines an IPv6 filter range's ending value (inclusive). Requires
        `ipv6_start` to be specified as well.
    - key: tag
      value: string
      disabled: true
      description: |-
        Filter by tag key:value pairs. Multiple `tag` params are AND'd.
        Format: `tag=key:value` (e.g., `tag=environment:production`).
        Key and value must both be non-empty; `tag=:value` and `tag=key:` return 400.
    - key: tag
      value: string
      disabled: true
      description: |-
        Filter by tag key:value pairs. Multiple `tag` params are AND'd.
        Format: `tag=key:value` (e.g., `tag=environment:production`).
        Key and value must both be non-empty; `tag=:value` and `tag=key:` return 400.
    - key: page
      value: "1"
      disabled: true
      description: Current page in the response
    - key: per_page
      value: "1000"
      disabled: true
      description: Max amount of entries returned per page
    - key: order
      value: created_at
      disabled: true
      description: The field to sort by.
    - key: direction
      value: desc
      disabled: true
      description: The sorting direction.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
