$kind: http-example
id: b0ea11a8-7651-5d0e-ac34-33adabc6696e
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/service_tokens/{{service_token_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "client_secret_version": "{{client_secret_version}}",
        "duration": "60m",
        "enabled": true,
        "name": "CI/CD token",
        "previous_client_secret_expires_at": "{{previous_client_secret_expires_at}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
