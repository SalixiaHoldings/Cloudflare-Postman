$kind: http-example
id: 0a2c28e9-3be6-5741-956c-e53be3e04daf
name: Update an Access application policy response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/apps/{{app_id}}/policies/{{policy_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "decision": "allow",
        "include": [
          {
            "everyone": {}
          }
        ],
        "mfa_config": {
          "allowed_authenticators": [
            "ssh_fido2_key"
          ]
        },
        "name": "Allow SSH users with a FIDO2 key"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
