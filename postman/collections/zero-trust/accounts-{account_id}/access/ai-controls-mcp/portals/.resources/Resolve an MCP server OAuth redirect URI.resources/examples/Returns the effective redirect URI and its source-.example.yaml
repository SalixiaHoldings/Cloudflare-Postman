id: 4f0e01e0-2fdb-5086-9f68-f73fd71a94a6
name: Returns the effective redirect URI and its source.
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/ai-controls/mcp/portals/{{portal_id}}/servers/{{server_id}}/effective-redirect-uri"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "redirect_uri": "https://UAAmronE.hmgVIrVdnwEbhJw+6-gsEazGmgBVf2Mptwdq-S,gLusxZ4",
          "source": "per_portal"
        }
      }
order: 1000
