$kind: http-example
id: 451a2e64-7d90-5fd2-93c9-5b5a12d00ff3
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/logs/access_requests"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: limit
      value: "25"
      disabled: true
      description: The maximum number of log entries to retrieve.
    - key: direction
      value: desc
      disabled: true
      description: The chronological sorting order for the logs.
    - key: since
      value: 2020-07-01T05:20:00Z
      disabled: true
      description: The earliest event timestamp to query.
    - key: until
      value: 2020-10-01T05:20:00Z
      disabled: true
      description: The latest event timestamp to query.
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "25"
      disabled: true
    - key: email
      value: user@example.com
      disabled: true
      description: |
        Filter by user email. Match mode is controlled by `emailOp` (preferred) or the legacy `email_exact` flag.
        - Default (no `emailOp`, `email_exact=false` or unset): substring match — `email=@example.com` returns all events with that domain.
        - Exact match: set `emailOp=eq` (preferred) or `email_exact=true` — e.g. `email=user@example.com&email_exact=true` returns only that user.
        - Explicit substring match: set `emailOp=contains` (without `email_exact=true`). When both are set, `email_exact=true` takes precedence and the match is exact.
        - Exclusion: set `emailOp=neq`. With `email_exact=true` this is an exact-value exclusion; without it, a fuzzy substring exclusion.
    - key: email_exact
      value: "true"
      disabled: true
      description: When true, `email` is matched exactly instead of substring matching.
    - key: user_id
      value: f757c5c3-c1b2-50f7-9126-150a099b6f7e
      disabled: true
      description: |
        Deprecated. Accepted for backward compatibility but no longer applied
        as a filter. Use `email` instead.
    - key: allowedOp
      value: eq
      disabled: true
      description: Operator for the `allowed` filter.
    - key: country_codeOp
      value: eq
      disabled: true
      description: Operator for the `country_code` filter.
    - key: app_typeOp
      value: eq
      disabled: true
      description: Operator for the `app_type` filter.
    - key: app_uidOp
      value: eq
      disabled: true
      description: Operator for the `app_uid` filter.
    - key: ray_idOp
      value: eq
      disabled: true
      description: Operator for the `ray_id` filter.
    - key: emailOp
      value: eq
      disabled: true
      description: |
        Operator for the `email` filter.
        `contains` performs a substring (case-sensitive) match. When `email_exact=true`
        is also set, `email_exact` takes precedence and `contains` is ignored.
    - key: idpOp
      value: eq
      disabled: true
      description: Operator for the `idp` filter.
    - key: non_identityOp
      value: eq
      disabled: true
      description: Operator for the `non_identity` filter.
    - key: user_idOp
      value: eq
      disabled: true
      description: |
        Deprecated. Accepted for backward compatibility but no longer applied
        as a filter (the `user_id` parameter is itself deprecated).
    - key: fields
      value: action,allowed,app_name,country,created_at,ray_id,user_email
      disabled: true
      description: |
        Comma-separated list of fields to include in the response.
        When omitted, all fields are returned.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
