$kind: http-example
id: b14e724b-87cb-5032-a1be-5b50d9a5c641
name: Get an Access policy tester users page response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/policy-tests/{{policy_test_id}}/users"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "25"
      disabled: true
    - key: status
      value: success
      disabled: true
      description: Filter users by their policy evaluation status.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
