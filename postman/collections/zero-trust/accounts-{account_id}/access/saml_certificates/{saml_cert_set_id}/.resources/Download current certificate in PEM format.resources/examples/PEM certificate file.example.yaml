$kind: http-example
id: 6aeddcbe-f20f-5371-9987-8e0d0d553b8a
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/saml_certificates/{{saml_cert_set_id}}/pem"
  method: GET
  headers:
    Accept: application/x-pem-file
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Disposition: attachment; filename="saml_certificate.pem"
    Content-Type: application/x-pem-file
  body:
    type: text
    content: |
      -----BEGIN CERTIFICATE-----
      MIIGAjCCA+qgAwIBAgIJAI7kymlF7CWT...
      ...certificate content...
      -----END CERTIFICATE-----
order: 1000
