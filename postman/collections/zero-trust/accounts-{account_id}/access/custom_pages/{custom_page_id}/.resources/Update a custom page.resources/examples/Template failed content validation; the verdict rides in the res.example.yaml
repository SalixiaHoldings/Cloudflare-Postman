$kind: http-example
id: b230ce5a-41ce-58cf-a3d7-920f529bdb41
name: Template failed content validation; the verdict rides in the result.
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/custom_pages/{{custom_page_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "custom_html": "<html><body><h1>Access Denied</h1></body></html>",
        "type": "identity_denied",
        "app_count": 2928,
        "contract_version": 3494,
        "uid": "f174e90a-fafe-4643-bbbc-4a0ed4fc8415"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
