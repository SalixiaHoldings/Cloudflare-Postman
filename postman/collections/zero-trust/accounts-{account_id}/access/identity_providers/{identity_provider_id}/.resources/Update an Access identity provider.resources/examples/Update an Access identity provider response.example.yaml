id: ca0880a8-9d13-5275-8012-61b1bad557b7
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/identity_providers/{{identity_provider_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Widget Corps IDP",
        "type": "onetimepin",
        "config": {
          "client_id": "<your client id>",
          "client_secret": "{{client_secret}}",
          "claims": [
            "email_verified",
            "preferred_username",
            "custom_claim_name"
          ],
          "email_claim_name": "custom_claim_name",
          "directory_id": "<your azure directory uuid>",
          "prompt": "login"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
