$kind: http-example
id: 18283c81-f6a2-595f-8f5c-cba82a2799a5
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/identity_providers"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Widget Corps IDP",
        "type": "onetimepin",
        "config": {
          "client_id": "<your client id>",
          "client_secret": "{{client_secret}}",
          "claims": [
            "email_verified",
            "preferred_username",
            "custom_claim_name"
          ],
          "email_claim_name": "custom_claim_name",
          "directory_id": "<your azure directory uuid>",
          "prompt": "login"
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
