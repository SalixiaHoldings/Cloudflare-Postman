$kind: http-example
id: f4310217-863e-5f49-a0f4-35041bf30922
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/identity_providers"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Widget Corps IDP",
        "type": "onetimepin",
        "config": {
          "client_id": "<your client id>",
          "client_secret": "{{client_secret}}",
          "claims": [
            "email_verified",
            "preferred_username",
            "custom_claim_name"
          ],
          "email_claim_name": "custom_claim_name",
          "directory_id": "<your azure directory uuid>",
          "prompt": "login"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
