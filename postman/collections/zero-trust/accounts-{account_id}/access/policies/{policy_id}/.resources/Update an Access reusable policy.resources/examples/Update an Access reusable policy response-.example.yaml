$kind: http-example
id: a9e2e1d2-e09b-5f67-9ab6-8a5e41418bea
name: Update an Access reusable policy response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/access/policies/{{policy_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Allow devs",
        "decision": "allow",
        "include": []
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
