$kind: http-example
id: 14751167-a2f6-5346-819e-ee18b5497ad8
name: Patch a zone to toggle permission for devices to provision certificates failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/devices/policy/certificates"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
