$kind: http-example
id: d3284a63-2edf-53a6-a3a6-05379d16a799
name: Patch a zone to toggle permission for devices to provision certificates failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/devices/policy/certificates"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
