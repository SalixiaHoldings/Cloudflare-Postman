request:
  url: "{{base_url}}/zones/{{zone_id}}/access/service_tokens"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "CI/CD token",
        "client_secret_version": 1,
        "duration": "60m",
        "enabled": false,
        "previous_client_secret_expires_at": "{{previous_client_secret_expires_at}}"
      }
