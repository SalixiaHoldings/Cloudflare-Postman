$kind: http-example
id: f35e3040-cf59-5823-9aa2-243aa807383b
request:
  url: "{{base_url}}/zones/{{zone_id}}/access/service_tokens/{{service_token_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "client_secret_version": 1,
        "duration": "60m",
        "enabled": true,
        "name": "CI/CD token",
        "previous_client_secret_expires_at": "{{previous_client_secret_expires_at}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
