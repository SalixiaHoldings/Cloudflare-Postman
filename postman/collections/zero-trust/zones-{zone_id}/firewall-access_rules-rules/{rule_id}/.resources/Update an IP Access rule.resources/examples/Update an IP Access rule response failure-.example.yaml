id: 8c8951a6-c28b-5851-98a3-f5d6b74ac9ce
name: Update an IP Access rule response failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/firewall/access_rules/rules/{{rule_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "mode": "challenge",
        "notes": "This rule is enabled because of an event that occurred on date X."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
