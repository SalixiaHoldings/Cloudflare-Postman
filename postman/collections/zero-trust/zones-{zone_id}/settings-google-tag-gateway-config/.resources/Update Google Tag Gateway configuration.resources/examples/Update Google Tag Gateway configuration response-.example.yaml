name: Update Google Tag Gateway configuration response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/google-tag-gateway/config"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "endpoint": "/metrics",
        "hideOriginalIp": true,
        "measurementId": "GTM-P2F3N47Q",
        "setUpTag": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
