$kind: http-example
id: e671b995-e6d0-56e6-848c-71ef2e5fbb72
name: Update an IP Access rule response.
request:
  url: "{{base_url}}/user/firewall/access_rules/rules/{{rule_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "mode": "challenge",
        "notes": "This rule is enabled because of an event that occurred on date X."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
