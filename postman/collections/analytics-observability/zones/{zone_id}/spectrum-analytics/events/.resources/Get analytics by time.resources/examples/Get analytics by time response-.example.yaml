$kind: http-example
id: cb96cd3c-a16f-59b2-93ff-6b5e245d07fe
name: Get analytics by time response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/spectrum/analytics/events/bytime?time_delta=minute"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: dimensions
      value: event
      disabled: true
    - key: dimensions
      value: appID
      disabled: true
    - key: sort
      value: +count
      disabled: true
    - key: sort
      value: -bytesIngress
      disabled: true
    - key: until
      value: 2014-01-01T05:20:00.12345Z
      disabled: true
    - key: metrics
      value: count
      disabled: true
    - key: metrics
      value: bytesIngress
      disabled: true
    - key: filters
      value: event==disconnect%20AND%20coloName!=SFO
      disabled: true
    - key: since
      value: 2014-01-01T05:20:00.12345Z
      disabled: true
    - key: time_delta
      value: minute
      description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "rows": {
