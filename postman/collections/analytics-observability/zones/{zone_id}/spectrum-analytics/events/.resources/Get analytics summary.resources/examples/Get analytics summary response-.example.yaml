id: 5573ff55-0106-5400-9e5c-09bfe2d45b35
name: Get analytics summary response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/spectrum/analytics/events/summary"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: dimensions
      value: event
      disabled: true
    - key: dimensions
      value: appID
      disabled: true
    - key: sort
      value: +count
      disabled: true
    - key: sort
      value: -bytesIngress
      disabled: true
    - key: until
      value: 2014-01-01T05:20:00.12345Z
      disabled: true
    - key: metrics
      value: count
      disabled: true
    - key: metrics
      value: bytesIngress
      disabled: true
    - key: filters
      value: event==disconnect%20AND%20coloName!=SFO
      disabled: true
    - key: since
      value: 2014-01-01T05:20:00.12345Z
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "rows": {
