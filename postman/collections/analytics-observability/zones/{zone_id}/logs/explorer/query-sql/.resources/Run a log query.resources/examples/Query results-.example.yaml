id: c14b8766-b7df-5ef0-979b-a065e8a4aec5
name: Query results.
request:
  url: "{{base_url}}/zones/{{zone_id}}/logs/explorer/query/sql?query=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: query
      value: string
      description: (Required) SQL query to execute.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          "string",
          "string"
        ],
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
