$kind: http-example
id: 3ec2f0a5-e171-5758-8789-91bc531bde9b
name: Query exceeded internal memory or resource limits.
request:
  url: "{{base_url}}/zones/{{zone_id}}/logs/explorer/query/sql?query=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: query
      value: string
      description: (Required) SQL query to execute.
response:
  statusCode: 507
  statusText: Insufficient Storage (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "key_0": "string",
          "key_1": 1714.02208507061,
          "key_2": 4576.62018481642,
          "key_3": 675.5453837104142,
          "key_4": true
        },
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          "string",
          "string"
        ]
      }
order: 5000
