$kind: http-example
id: d5bdedf9-5bdd-5608-ae45-9541243ab49d
name: Query exceeded internal memory or resource limits.
request:
  url: "{{base_url}}/zones/{{zone_id}}/logs/explorer/query/sql?query=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: query
      value: string
      description: (Required) SQL query to execute.
response:
  statusCode: 507
  statusText: Insufficient Storage (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "key_0": 7439.641251694411,
          "key_1": true,
          "key_2": true
        },
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          "string",
          "string"
        ]
      }
order: 5000
