name: Page test schedule.
request:
  url: "{{base_url}}/zones/{{zone_id}}/speed_api/schedule/{{url}}"
  method: POST
  headers:
    Accept: application/json
  queryParams:
    - key: region
      value: us-central1
      disabled: true
    - key: frequency
      value: DAILY
      disabled: true
      description: The frequency of the scheduled test. Defaults to WEEKLY for free plans, DAILY for paid plans.
