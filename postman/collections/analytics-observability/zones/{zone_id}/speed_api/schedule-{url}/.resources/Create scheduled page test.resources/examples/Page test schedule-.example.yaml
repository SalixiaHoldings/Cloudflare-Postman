  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "schedule": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          "test": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        }
      }
order: 1000
