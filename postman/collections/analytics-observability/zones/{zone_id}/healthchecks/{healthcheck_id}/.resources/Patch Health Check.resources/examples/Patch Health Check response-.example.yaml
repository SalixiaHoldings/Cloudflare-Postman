$kind: http-example
id: 17a899ea-8334-5533-8de5-aa8dbf418abd
name: Patch Health Check response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/healthchecks/{{healthcheck_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "server-1",
        "address": "www.example.com",
        "check_regions": [
          "WEU",
          "ENAM"
        ],
        "consecutive_fails": 1,
        "consecutive_successes": 1,
        "description": "Health check for www.example.com",
        "interval": 60,
        "retries": 2,
        "suspended": false,
        "timeout": 5,
        "type": "HTTPS"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
