$kind: http-example
id: 0b0a5587-0f07-5bee-97ff-e336a7cbf1e7
name: Update Health Check response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/healthchecks/{{healthcheck_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "server-1",
        "address": "www.example.com",
        "check_regions": [
          "WEU",
          "ENAM"
        ],
        "consecutive_fails": 1,
        "consecutive_successes": 1,
        "description": "Health check for www.example.com",
        "interval": 60,
        "retries": 2,
        "suspended": false,
        "timeout": 5,
        "type": "HTTPS"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
