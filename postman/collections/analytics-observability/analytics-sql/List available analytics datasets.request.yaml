description: |-
  GENERATED FILE — DO NOT EDIT.

  Upstream operation: sql-api-introspection
  GET /analytics/sql/introspection

  Returns the analytics dataset catalogue. By default, the response contains dataset names and descriptions. Set `include_columns` to include each dataset's column names, descriptions, and data types. The caller must have Account Analytics Read permission on the account identified by `account_tag`. Dataset names, descriptions, and columns are the same for every authorized account. When `include_custom_attributes` is set, the response also includes custom attribute names and types discovered from that account's own data, which legitimately differs per caller.


  Authentication support: bearer-only
  Auth declaration SHA-256: cbba9b337efd4dcbaf1248fcfab868d3a542bf11170ae3bcc3755c08bfaa1c27
  Upstream security (operation; OR alternatives, AND within each object): [{"api_token":[]}]
  Selected requirement: {"api_token":[]}
  Use the narrowly scoped api_token; legacy alternatives are not enabled.
url: "{{base_url}}/analytics/sql/introspection?account_tag=0123456789abcdef0123456789abcdef"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: account_tag
    value: 0123456789abcdef0123456789abcdef
    description: (Required) Account whose available analytics datasets are returned.
  - key: include_columns
    value: "false"
    disabled: true
    description: Include column metadata for each returned dataset.
  - key: include_custom_attributes
    value: "false"
    disabled: true
    description: Include custom attribute names and types for each dataset that supports them.
  - key: dataset_name
    value: events.httpRequests
    disabled: true
    description: |
      Return only the dataset with this exact name. An empty value does not filter the catalogue. An unknown name returns a successful response with an empty `datasets` array.
