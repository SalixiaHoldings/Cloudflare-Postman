$kind: http-example
id: 21243e98-30be-52e8-866a-edb19505b445
name: The query exceeded a resource or request-rate limit.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "query": "string",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "3592"
      description: |
        Seconds to wait before retrying. Present when the account request rate limit is exceeded; omitted for query resource limits.
    - key: Content-Type
      value: text/plain
  body:
    type: text
    content: string
order: 5000
