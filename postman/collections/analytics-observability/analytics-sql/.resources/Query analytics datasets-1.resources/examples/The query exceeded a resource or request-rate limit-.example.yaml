$kind: http-example
id: de0bc6e5-064b-57ef-85ff-903e97e340a8
name: The query exceeded a resource or request-rate limit.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "params": {
          "status": 404
        },
        "query": "SELECT edgeResponseStatus FROM events.httpRequests WHERE edgeResponseStatus = $status LIMIT 10",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "end": "2026-01-02T00:00:00Z",
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "3592"
      description: |
        Seconds to wait before retrying. Present when the account request rate limit is exceeded; omitted for query resource limits.
    - key: Content-Type
      value: text/plain
  body:
    type: text
    content: string
order: 5000
