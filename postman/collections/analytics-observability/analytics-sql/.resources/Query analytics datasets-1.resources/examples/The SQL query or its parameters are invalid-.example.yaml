$kind: http-example
id: 8992404d-549c-5f86-9244-6d1803742c64
name: The SQL query or its parameters are invalid.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "params": {
          "status": 404
        },
        "query": "SELECT edgeResponseStatus FROM events.httpRequests WHERE edgeResponseStatus = $status LIMIT 10",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "end": "2026-01-02T00:00:00Z",
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 4000
