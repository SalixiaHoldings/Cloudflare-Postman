$kind: http-example
id: a4bc4d6e-6459-5878-b2c8-3981bd2ebe35
name: A required service is temporarily unavailable.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "params": {
          "status": 404
        },
        "query": "SELECT edgeResponseStatus FROM events.httpRequests WHERE edgeResponseStatus = $status LIMIT 10",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "end": "2026-01-02T00:00:00Z",
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 8000
