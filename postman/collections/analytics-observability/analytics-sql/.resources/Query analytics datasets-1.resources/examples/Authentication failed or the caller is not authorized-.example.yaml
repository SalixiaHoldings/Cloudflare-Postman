$kind: http-example
id: d13cc1f7-744d-5847-b718-1384dc479214
name: Authentication failed or the caller is not authorized.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "params": {
          "status": 404
        },
        "query": "SELECT edgeResponseStatus FROM events.httpRequests WHERE edgeResponseStatus = $status LIMIT 10",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "end": "2026-01-02T00:00:00Z",
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: Authorization error
order: 3000
