$kind: http-example
id: 8c427a59-f74f-57de-b645-e61bb7c73321
name: The query exhausted available resources.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "params": {
          "status": 404
        },
        "query": "SELECT edgeResponseStatus FROM events.httpRequests WHERE edgeResponseStatus = $status LIMIT 10",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "end": "2026-01-02T00:00:00Z",
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 507
  statusText: Insufficient Storage (WebDAV) (RFC 4918)
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 9000
