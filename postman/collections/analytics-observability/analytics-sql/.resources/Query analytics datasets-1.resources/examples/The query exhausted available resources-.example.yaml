$kind: http-example
id: 9c0b8868-c533-5b38-ae77-1d83b0a91c49
name: The query exhausted available resources.
request:
  url: "{{base_url}}/analytics/sql"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "query": "string",
        "scope": {
          "accountTag": "0123456789abcdef0123456789abcdef"
        },
        "time_range": {
          "start": "2026-01-01T00:00:00Z"
        }
      }
response:
  statusCode: 507
  statusText: Insufficient Storage (WebDAV) (RFC 4918)
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 9000
