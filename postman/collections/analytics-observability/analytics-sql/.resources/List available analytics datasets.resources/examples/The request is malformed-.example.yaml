name: The request is malformed.
request:
  url: "{{base_url}}/analytics/sql/introspection?account_tag=0123456789abcdef0123456789abcdef"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: account_tag
      value: 0123456789abcdef0123456789abcdef
      description: (Required) Account whose available analytics datasets are returned.
    - key: include_columns
      value: "false"
      disabled: true
      description: Include column metadata for each returned dataset.
    - key: include_custom_attributes
      value: "false"
      disabled: true
      description: Include custom attribute names and types for each dataset that supports them.
    - key: dataset_name
      value: events.httpRequests
      disabled: true
      description: |
        Return only the dataset with this exact name. An empty value does not filter the catalogue. An unknown name returns a successful response with an empty `datasets` array.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 2457,
        "message": "string",
        "error_chain": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
