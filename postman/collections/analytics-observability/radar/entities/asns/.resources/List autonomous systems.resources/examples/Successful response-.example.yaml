$kind: http-example
id: 49b09a98-0c6b-5650-a6c7-7e662087d8b7
name: Successful response.
request:
  url: "{{base_url}}/radar/entities/asns"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      disabled: true
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "0"
      disabled: true
      description: Skips the specified number of objects before fetching the results.
    - key: asn
      value: 174,7922
      disabled: true
      description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list.
    - key: location
      value: US
      disabled: true
      description: Filters results by location. Specify an alpha-2 location code.
    - key: orderBy
      value: ASN
      disabled: true
      description: Specifies the metric to order the ASNs by.
    - key: format
      value: JSON
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "asns": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        },
        "success": true
      }
order: 1000
