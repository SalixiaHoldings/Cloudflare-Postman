$kind: http-example
id: 4eb07303-3b06-51c4-a157-3c3d73902072
name: Not found.
request:
  url: "{{base_url}}/radar/entities/asns/ip?ip=8.8.8.8&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: ip
      value: 8.8.8.8
      description: (Required) IP address.
    - key: format
      value: JSON
      description: Format in which results will be returned.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not Found."
      }
order: 2000
