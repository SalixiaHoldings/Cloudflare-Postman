$kind: http-example
id: f185110e-0010-5feb-badd-ce42af0060c4
name: Successful response.
request:
  url: "{{base_url}}/radar/entities/locations"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      disabled: true
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "0"
      disabled: true
      description: Skips the specified number of objects before fetching the results.
    - key: location
      value: US,CA
      disabled: true
      description: Filters results by location. Specify a comma-separated list of alpha-2 location codes.
    - key: region
      value: Middle East
      disabled: true
      description: Filters results by region.
    - key: subregion
      value: Southern Europe
      disabled: true
      description: Filters results by subregion.
    - key: continent
      value: EU
      disabled: true
      description: Filters results by continent code.
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "locations": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        },
        "success": true
      }
order: 1000
