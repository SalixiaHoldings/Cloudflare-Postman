$kind: http-example
id: 4e179fa7-0bec-5f78-8c34-bf775363ddbb
name: Successful response.
request:
  url: "{{base_url}}/radar/bots?limit=5&offset=3789&botCategory=FEED_FETCHER&botOperator=string&kind=BOT&botVerificationStatus=VERIFIED&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "3789"
      description: Skips the specified number of objects before fetching the results.
    - key: botCategory
      value: FEED_FETCHER
      description: Filters results by bot category.
    - key: botOperator
      value: string
      description: Filters results by bot operator.
    - key: kind
      value: BOT
      description: "Filters results by bot kind. Deprecated: the Verified Bot / Signed Agent distinction is being removed."
    - key: botVerificationStatus
      value: VERIFIED
      description: Filters results by bot verification status.
    - key: format
      value: JSON
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "bots": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        },
        "success": true
      }
order: 1000
