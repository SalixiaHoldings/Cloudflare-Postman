name: Successful response.
request:
  url: "{{base_url}}/radar/bots/timeseries?aggInterval=1h&name=main_series&name=main_series&dateRange=7d&dateRange=7d&dateStart=1990-07-31T02:59:38.133Z&dateStart=1929-06-14T03:10:47.996Z&dateEnd=1927-12-19T06:37:38.317Z&dateEnd=1959-05-01T07:56:39.610Z&asn=string&asn=string&location=string&location=string&continent=string&continent=string&bot=string&bot=string&botOperator=string&botOperator=string&botCategory=AGGREGATOR&botCategory=SEARCH_ENGINE_OPTIMIZATION&botKind=AGENT&botKind=BOT&botVerificationStatus=VERIFIED&botVerificationStatus=VERIFIED&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: aggInterval
      value: 1h
      description: Aggregation interval of the results (e.g., in 15 minutes or 1 hour intervals). Refer to [Aggregation intervals](https://developers.cloudflare.com/radar/concepts/aggregation-intervals/). When omitted, the interval is auto-selected from the requested date range; finer intervals are only available for shorter ranges. If the requested interval is too granular for the date range, the request is rejected.
    - key: name
      value: main_series
      description: Array of names used to label the series in the response.
    - key: name
      value: main_series
      description: Array of names used to label the series in the response.
    - key: dateRange
      value: 7d
      description: "Filters results by relative date range ending at the current time, with each value producing a separate series. Use `<n>d` for days (up to `364d`) or `<n>w` for weeks (up to `52w`). Append `control` to request the equivalent previous period for comparison: the comparison window is shifted back by the current window's length rounded up to a whole number of weeks, so it keeps the same weekday alignment and does not overlap the current window (e.g. `7dcontrol` covers days -14 to -7, `10dcontrol` covers days -24 to -14). For example, pass `7d` and `7dcontrol` to compare this week with the previous week. All series must resolve to the same duration as the main series; relative ranges (including `control`) satisfy this automatically. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters)."
    - key: dateRange
      value: 7d
      description: "Filters results by relative date range ending at the current time, with each value producing a separate series. Use `<n>d` for days (up to `364d`) or `<n>w` for weeks (up to `52w`). Append `control` to request the equivalent previous period for comparison: the comparison window is shifted back by the current window's length rounded up to a whole number of weeks, so it keeps the same weekday alignment and does not overlap the current window (e.g. `7dcontrol` covers days -14 to -7, `10dcontrol` covers days -24 to -14). For example, pass `7d` and `7dcontrol` to compare this week with the previous week. All series must resolve to the same duration as the main series; relative ranges (including `control`) satisfy this automatically. Use this parameter or set specific start and end dates (`dateStart` and `dateEnd` parameters)."
    - key: dateStart
      value: 1990-07-31T02:59:38.133Z
      description: Start of the date range. Alternative to `dateRange`; provide together with `dateEnd`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
    - key: dateStart
      value: 1929-06-14T03:10:47.996Z
      description: Start of the date range. Alternative to `dateRange`; provide together with `dateEnd`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
    - key: dateEnd
      value: 1927-12-19T06:37:38.317Z
      description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
    - key: dateEnd
      value: 1959-05-01T07:56:39.610Z
      description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`. When requesting comparison series, every series must resolve to the same duration as the main series. Each `dateStart`/`dateEnd` is floored to the nearest 15 minutes before evaluation, so windows whose durations match only before alignment may be rejected.
    - key: asn
      value: string
      description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
    - key: asn
      value: string
      description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
    - key: location
      value: string
      description: Filters results by location. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude locations from results. For example, `-US,PT` excludes results from the US, but includes results from PT.
    - key: location
      value: string
      description: Filters results by location. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude locations from results. For example, `-US,PT` excludes results from the US, but includes results from PT.
    - key: continent
      value: string
      description: Filters results by continent. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude continents from results. For example, `-EU,NA` excludes results from EU, but includes results from NA.
    - key: continent
      value: string
      description: Filters results by continent. Specify a comma-separated list of alpha-2 codes. Prefix with `-` to exclude continents from results. For example, `-EU,NA` excludes results from EU, but includes results from NA.
    - key: bot
      value: string
      description: Filters results by bot name.
    - key: bot
      value: string
      description: Filters results by bot name.
    - key: botOperator
      value: string
      description: Filters results by bot operator.
    - key: botOperator
      value: string
      description: Filters results by bot operator.
    - key: botCategory
      value: AGGREGATOR
      description: Filters results by bot category.
    - key: botCategory
      value: SEARCH_ENGINE_OPTIMIZATION
      description: Filters results by bot category.
    - key: botKind
      value: AGENT
      description: "Filters results by bot kind. Deprecated: the Verified Bot / Signed Agent distinction is being removed."
    - key: botKind
      value: BOT
      description: "Filters results by bot kind. Deprecated: the Verified Bot / Signed Agent distinction is being removed."
    - key: botVerificationStatus
      value: VERIFIED
      description: Filters results by bot verification status (Verified vs. Unverified).
    - key: botVerificationStatus
      value: VERIFIED
      description: Filters results by bot verification status (Verified vs. Unverified).
    - key: format
      value: JSON
      description: Format in which results will be returned.
