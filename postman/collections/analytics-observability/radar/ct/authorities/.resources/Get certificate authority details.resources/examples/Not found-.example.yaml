id: e3557a8e-f2dc-5603-8257-990a9bf1bc66
name: Not found.
request:
  url: "{{base_url}}/radar/ct/authorities/{{ca_slug}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not Found."
      }
order: 2000
