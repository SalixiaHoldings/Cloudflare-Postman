name: Not found.
request:
  url: "{{base_url}}/radar/ct/authorities/{{ca_slug}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
