request:
  url: "{{base_url}}/radar/ct/authorities?limit=5&offset=3789&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
