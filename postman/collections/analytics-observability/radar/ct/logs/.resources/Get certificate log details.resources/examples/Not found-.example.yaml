$kind: http-example
id: f5eed2af-f1a3-5595-923f-26c3464dc5ee
name: Not found.
request:
  url: "{{base_url}}/radar/ct/logs/{{log_slug}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: format
      value: JSON
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not Found."
      }
order: 2000
