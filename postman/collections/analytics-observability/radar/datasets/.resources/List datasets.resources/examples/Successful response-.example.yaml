$kind: http-example
id: b4ded17e-f5b6-5b68-b8b5-2c2efdf00579
name: Successful response.
request:
  url: "{{base_url}}/radar/datasets"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      disabled: true
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "0"
      disabled: true
      description: Skips the specified number of objects before fetching the results.
    - key: datasetType
      value: RANKING_BUCKET
      disabled: true
      description: Filters results by dataset type.
    - key: date
      value: 2024-09-19
      disabled: true
      description: Filters results by the specified date.
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "datasets": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        },
        "success": true
      }
order: 1000
