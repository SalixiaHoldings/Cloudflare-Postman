$kind: http-example
id: 49125c08-917f-5f66-9c8c-2208a4a9f8dd
name: Not found.
request:
  url: "{{base_url}}/radar/tlds/{{tld}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not Found."
      }
order: 2000
