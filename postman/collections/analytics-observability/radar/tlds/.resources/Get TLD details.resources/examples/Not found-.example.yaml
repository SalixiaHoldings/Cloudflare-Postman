$kind: http-example
id: e3f70f1f-4e47-5d4a-ae09-4bdd5964cb8c
name: Not found.
request:
  url: "{{base_url}}/radar/tlds/{{tld}}?format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: format
      value: JSON
      description: Format in which results will be returned.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not Found."
      }
order: 2000
