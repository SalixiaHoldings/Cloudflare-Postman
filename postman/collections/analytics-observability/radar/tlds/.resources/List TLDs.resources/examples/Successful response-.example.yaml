name: Successful response.
request:
  url: "{{base_url}}/radar/tlds"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      disabled: true
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "0"
      disabled: true
      description: Skips the specified number of objects before fetching the results.
    - key: tldManager
      value: string
      disabled: true
      description: Filters results by TLD manager.
    - key: tldType
      value: SPONSORED
      disabled: true
      description: Filters results by TLD type.
    - key: tld
      value: com,pt
      disabled: true
      description: Filters results by top-level domain. Specify a comma-separated list of TLDs.
    - key: format
      value: JSON
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "tlds": [
