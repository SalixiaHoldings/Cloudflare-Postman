request:
  url: "{{base_url}}/radar/tlds?limit=5&offset=3789&tldManager=string&tldType=COUNTRY_CODE&tld=com,pt&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "3789"
      description: Skips the specified number of objects before fetching the results.
    - key: tldManager
      value: string
      description: Filters results by TLD manager.
    - key: tldType
      value: COUNTRY_CODE
      description: Filters results by TLD type.
    - key: tld
      value: com,pt
      description: Filters results by top-level domain. Specify a comma-separated list of TLDs.
    - key: format
      value: JSON
      description: Format in which results will be returned.
