name: Bad request.
request:
  url: "{{base_url}}/radar/bgp/rpki/aspa/snapshot"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
