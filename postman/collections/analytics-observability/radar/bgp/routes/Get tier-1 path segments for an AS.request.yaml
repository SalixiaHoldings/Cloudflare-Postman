description: |-
  GENERATED FILE — DO NOT EDIT.

  Upstream operation: radar-get-bgp-routes-paths
  GET /radar/bgp/routes/paths/{asn}

  Retrieves the paths an AS uses to reach the tier-1 clique, derived from RouteViews RIB snapshots. Each entry is an ordered AS-path segment (from the queried AS toward a tier-1) with the number of observed paths and peers, and the collectors that observed it. By default segments are merged across all active collectors; pass "collector" to scope to one. The response also includes an "asnInfo" map (keyed by ASN) with the name and country for every ASN in the returned segments plus the queried ASN (best-effort; null when unavailable).

  Authentication support: multi-scheme-or-other
  Auth declaration SHA-256: cb039fe92c74f6483aaad6a3be8d90dfc474320bb13b733f4b11d38e19a5507f
  Upstream security (operation; OR alternatives, AND within each object): [{"api_email":[],"api_key":[],"api_token":[]}]
  Selected requirement: {"api_email":[],"api_key":[],"api_token":[]}
  Upstream does not declare a standalone API-token alternative. Configure only the empty credential variables required by this request. Multi-scheme requirements are preserved literally, not treated as alternatives. This is schema metadata, not proof of live API behavior.
url: "{{base_url}}/radar/bgp/routes/paths/{{asn}}"
method: GET
headers:
  Accept: application/json
  X-Auth-Email: "{{api_email}}"
  X-Auth-Key: "{{api_key}}"
queryParams:
  - key: ipVersion
    value: IPv4
    disabled: true
    description: Address family of the observed paths. Defaults to IPv4.
  - key: collector
    value: route-views3
    disabled: true
    description: Scope to a single RouteViews collector (e.g. "route-views3"). Omit to merge across all active collectors (identical path segments are deduplicated, observation counts summed, and every contributing collector listed).
  - key: format
    value: CSV
    disabled: true
    description: Format in which results will be returned.
auth:
  type: bearer
  credentials:
    token: "{{api_token}}"
examples: ./.resources/Get tier-1 path segments for an AS.resources/examples
