name: Bad request.
request:
  url: "{{base_url}}/radar/bgp/routes/upstreams/{{asn}}/timeseries?ipVersion=IPv4&dateStart=2023-09-01T11:41:33.782Z&dateEnd=2023-09-01T11:41:33.782Z&limit=5&format=JSON"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: ipVersion
      value: IPv4
      description: Address family of the observed paths. Defaults to IPv4.
    - key: dateStart
      value: 2023-09-01T11:41:33.782Z
      description: Start of the date range (inclusive). Alternative to `dateRange`; provide together with `dateEnd`.
    - key: dateEnd
      value: 2023-09-01T11:41:33.782Z
      description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`.
    - key: limit
      value: "5"
      description: Number of upstream ASNs to return as separate series, ranked by the first bucket. Remaining upstreams are grouped into an "OTHER" series. Defaults to 5.
    - key: format
      value: JSON
      description: Format in which results will be returned.
