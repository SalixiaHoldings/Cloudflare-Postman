$kind: http-example
id: bc500ab6-7e55-5f1d-aa37-73af1ce0190d
name: Successful response.
request:
  url: "{{base_url}}/radar/bgp/routes/upstreams/{{asn}}/timeseries"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: ipVersion
      value: IPv4
      disabled: true
      description: Address family of the observed paths. Defaults to IPv4.
    - key: dateStart
      value: 2023-09-01T11:41:33.782Z
      disabled: true
      description: Start of the date range (inclusive). Alternative to `dateRange`; provide together with `dateEnd`.
    - key: dateEnd
      value: 2023-09-01T11:41:33.782Z
      disabled: true
      description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`.
    - key: limit
      value: "5"
      disabled: true
      description: Number of upstream ASNs to return as separate series, ranked by the first bucket. Remaining upstreams are grouped into an "OTHER" series. Defaults to 5.
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "serie_0": {
            "174": [
              "0.7",
              "0.6"
            ],
            "OTHER": [
              "0.1",
              "0.4"
            ],
            "timestamps": [
              "2026-06-01T00:00:00Z",
              "2026-06-01T00:15:00Z"
            ]
          },
          "meta": {
            "dataTime": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "queryTime": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "effectiveCollector": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "stale": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        },
        "success": true
      }
order: 1000
