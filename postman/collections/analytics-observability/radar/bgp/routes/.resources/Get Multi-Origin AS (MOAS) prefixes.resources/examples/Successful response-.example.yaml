name: Successful response.
request:
  url: "{{base_url}}/radar/bgp/routes/moas"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: origin
      value: "4749"
      disabled: true
      description: Lookup MOASes originated by the given ASN.
    - key: prefix
      value: string
      disabled: true
    - key: invalid_only
      value: "false"
      disabled: true
      description: Lookup only RPKI invalid MOASes.
    - key: format
      value: JSON
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
