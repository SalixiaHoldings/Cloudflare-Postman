$kind: http-example
id: fe51f7b6-7843-55e6-b3bd-e3f65177dd22
name: Successful response.
request:
  url: "{{base_url}}/radar/bgp/hijacks/events"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page number, starting from 1.
    - key: per_page
      value: "50"
      disabled: true
      description: Number of entries per page.
    - key: eventId
      value: "8770"
      disabled: true
      description: The unique identifier of a event.
    - key: hijackerAsn
      value: "2070"
      disabled: true
      description: The potential hijacker AS of a BGP hijack event.
    - key: victimAsn
      value: "7506"
      disabled: true
      description: The potential victim AS of a BGP hijack event.
    - key: involvedAsn
      value: "6306"
      disabled: true
      description: The potential hijacker or victim AS of a BGP hijack event.
    - key: involvedCountry
      value: PT
      disabled: true
      description: The country code of the potential hijacker or victim AS of a BGP hijack event.
    - key: prefix
      value: string
      disabled: true
    - key: minConfidence
      value: "1046"
      disabled: true
      description: Filters events by minimum confidence score (1-4 low, 5-7 mid, 8+ high).
    - key: maxConfidence
      value: "2504"
      disabled: true
      description: Filters events by maximum confidence score (1-4 low, 5-7 mid, 8+ high).
    - key: dateRange
      value: 7d
      disabled: true
      description: "Filters results by a relative date range ending at the current time. Use `<n>d` for days (up to `364d`) or `<n>w` for weeks (up to `52w`), e.g. `7d`. Append `control` to request the equivalent previous period for comparison: the comparison window is shifted back by the current window's length rounded up to a whole number of weeks, so it keeps the same weekday alignment and does not overlap the current window (e.g. `3dcontrol` covers days -10 to -7, `7dcontrol` covers days -14 to -7, `28dcontrol` covers days -56 to -28, and `10dcontrol` covers days -24 to -14). Mutually exclusive with `dateStart`/`dateEnd`."
    - key: dateStart
      value: 2023-09-01T11:41:33.782Z
      disabled: true
      description: Start of the date range (inclusive). Alternative to `dateRange`; provide together with `dateEnd`.
    - key: dateEnd
      value: 2023-09-01T11:41:33.782Z
      disabled: true
      description: End of the date range (inclusive). Alternative to `dateRange`; provide together with `dateStart`.
    - key: sortBy
      value: TIME
      disabled: true
      description: Sorts results by the specified field.
    - key: sortOrder
      value: DESC
      disabled: true
      description: Sort order.
    - key: format
      value: CSV
      disabled: true
      description: Format in which results will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
