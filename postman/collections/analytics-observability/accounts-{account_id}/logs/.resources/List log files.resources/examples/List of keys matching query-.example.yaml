      value: application/json
  queryParams:
    - key: start
      value: 2022-06-06T16:00:00Z
      description: (Required) Start time in RFC3339 format.
    - key: end
      value: 2022-06-06T16:00:00Z
      description: (Required) End time in RFC3339 format.
    - key: bucket
      value: cloudflare-logs
      description: (Required) R2 bucket name.
    - key: prefix
      value: http_requests/example.com/{DATE}
      description: R2 bucket prefix logs are stored under.
    - key: limit
