name: List of keys matching query.
request:
  url: "{{base_url}}/accounts/{{account_id}}/logs/list?start=2022-06-06T16:00:00Z&end=2022-06-06T16:00:00Z&bucket=cloudflare-logs&prefix=http_requests/example.com/{DATE}&limit=1000"
  method: GET
  headers:
