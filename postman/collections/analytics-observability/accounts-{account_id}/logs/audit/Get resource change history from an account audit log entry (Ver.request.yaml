method: GET
headers:
  Accept: application/json
queryParams:
  - key: action_time
    value: 2024-10-30T15:00:00Z
    description: (Required) RFC3339 timestamp of the source audit log entry's action time. Used to narrow the source-entry lookup window. Provide the `action.time` value from the audit log identified by `id`.
  - key: since
    value: 2024-10-30
    description: (Required) Limits the returned results to logs newer than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
  - key: before
    value: 2024-10-31
    description: (Required) Limits the returned results to logs older than the specified date. This can be a date string 2019-04-30 (interpreted in UTC) or an absolute timestamp that conforms to RFC3339.
  - key: direction
