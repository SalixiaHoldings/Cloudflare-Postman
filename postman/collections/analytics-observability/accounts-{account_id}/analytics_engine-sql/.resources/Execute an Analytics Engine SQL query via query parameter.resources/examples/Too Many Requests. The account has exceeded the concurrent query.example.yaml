$kind: http-example
id: 96e29a63-1275-579e-b3a9-bcb1214a7de0
name: |
  Too Many Requests. The account has exceeded the concurrent query limit, the global query pool is full, or a resource limit was hit (query too slow, too much memory, result too large).
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics_engine/sql?query=SELECT blob1, count() FROM my_dataset WHERE timestamp > NOW() - INTERVAL '1' DAY GROUP BY blob1 ORDER BY count() DESC LIMIT 10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: query
      value: SELECT blob1, count() FROM my_dataset WHERE timestamp > NOW() - INTERVAL '1' DAY GROUP BY blob1 ORDER BY count() DESC LIMIT 10
      description: (Required) Supply a SQL query to run against your Analytics Engine datasets. Use only SELECT statements. The service validates the query against a restricted SQL grammar before execution.
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: "Resource limit: Your query requires too much memory. Try simplifying the query or narrowing the time range."
order: 5000
