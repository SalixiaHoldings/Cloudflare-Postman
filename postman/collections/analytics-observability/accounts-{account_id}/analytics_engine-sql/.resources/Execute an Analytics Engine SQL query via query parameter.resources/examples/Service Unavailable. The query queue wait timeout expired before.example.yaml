$kind: http-example
id: 702be3fe-f90a-56b6-99ff-c4c4f76bde3e
name: |
  Service Unavailable. The query queue wait timeout expired before a processing slot became available. This occurs under heavy load when per-account or global concurrency limits are saturated. Retry the request after a brief delay.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics_engine/sql?query=SELECT blob1, count() FROM my_dataset WHERE timestamp > NOW() - INTERVAL '1' DAY GROUP BY blob1 ORDER BY count() DESC LIMIT 10"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: query
      value: SELECT blob1, count() FROM my_dataset WHERE timestamp > NOW() - INTERVAL '1' DAY GROUP BY blob1 ORDER BY count() DESC LIMIT 10
      description: (Required) Supply a SQL query to run against your Analytics Engine datasets. Use only SELECT statements. The service validates the query against a restricted SQL grammar before execution.
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: Query timed out waiting in queue. The system is under heavy load. Please try again later.
order: 7000
