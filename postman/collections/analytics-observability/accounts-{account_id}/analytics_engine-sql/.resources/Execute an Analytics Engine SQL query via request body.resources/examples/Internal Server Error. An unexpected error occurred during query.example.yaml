$kind: http-example
id: 6d0710ef-eefb-5b1c-8788-d511b0866cf7
name: |
  Internal Server Error. An unexpected error occurred during query execution. This may indicate a transient backend issue. Retrying the request after a brief delay is recommended.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics_engine/sql"
  method: POST
  headers:
    Content-Type: text/plain
    Accept: application/json
  body:
    type: text
    content: |
      SELECT blob1, sum(double1) as total
      FROM my_dataset
      WHERE timestamp > NOW() - INTERVAL '7' DAY
      GROUP BY blob1
      ORDER BY total DESC
      LIMIT 100
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: Sorry, we were unable to evaluate your query. Please try again later.
order: 6000
