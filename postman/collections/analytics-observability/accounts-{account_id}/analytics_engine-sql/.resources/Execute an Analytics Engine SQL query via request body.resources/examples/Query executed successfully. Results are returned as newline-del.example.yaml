$kind: http-example
id: 2c4bc05e-9c78-5d6a-88a8-614fb331a2d2
name: |
  Query executed successfully. Results are returned as newline-delimited JSON (NDJSON) by default. Each line is a JSON object representing one row of results. If the FORMAT JSON clause is used in the query, the response is a single JSON object with data, meta, and rows fields.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics_engine/sql"
  method: POST
  headers:
    Content-Type: text/plain
    Accept: application/json
  body:
    type: text
    content: |
      SELECT blob1, sum(double1) as total
      FROM my_dataset
      WHERE timestamp > NOW() - INTERVAL '7' DAY
      GROUP BY blob1
      ORDER BY total DESC
      LIMIT 100
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Query-Id
      value: 01HXYZ1234ABCDEF5678
      description: Unique identifier for this query execution.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "blob1": "US",
            "count()": 1523
          },
          {
            "blob1": "DE",
            "count()": 847
          }
        ],
        "meta": [
          {
            "name": "blob1",
            "type": "String"
          },
          {
            "name": "count()",
            "type": "UInt64"
          }
        ],
        "rows": 2
      }
order: 1000
