name: Check destination exists response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/logpush/validate/destination/exists"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "destination_conf": "s3://mybucket/logs?region=us-west-2"
      }
