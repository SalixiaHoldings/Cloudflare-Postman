name: List transformer versions response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/logpush/transformers/{{transformer_id}}/versions"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "10"
      disabled: true
      description: Maximum number of versions to return.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
