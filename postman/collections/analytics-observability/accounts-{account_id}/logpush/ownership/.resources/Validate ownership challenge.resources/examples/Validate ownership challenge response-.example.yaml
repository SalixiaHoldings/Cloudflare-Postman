name: Validate ownership challenge response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/logpush/ownership/validate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "destination_conf": "s3://mybucket/logs?region=us-west-2",
        "ownership_challenge": "00000000000000000000"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
