$kind: http-example
id: 2b08016e-61f5-5e55-b268-d937f6e291dd
name: Update Logpush job response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/logpush/jobs/{{job_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "destination_conf": "s3://mybucket/logs?region=us-west-2",
        "enabled": false,
        "filter": "{\"where\":{\"and\":[{\"key\":\"ClientRequestPath\",\"operator\":\"contains\",\"value\":\"/static\"},{\"key\":\"ClientRequestHost\",\"operator\":\"eq\",\"value\":\"example.com\"}]}}",
        "kind": "",
        "max_upload_bytes": 5000000,
        "max_upload_interval_seconds": 30,
        "max_upload_records": 1000,
        "output_options": {
          "CVE-2021-44228": false,
          "batch_prefix": "",
          "batch_suffix": "",
          "field_delimiter": ",",
          "field_names": [
            "Datetime",
            "DstIP",
            "SrcIP"
          ],
          "output_type": "ndjson",
          "record_delimiter": "",
          "record_prefix": "{",
          "record_suffix": "}\n",
          "sample_rate": 1,
          "timestamp_format": "unixnano"
        },
        "ownership_challenge": "00000000000000000000"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "dataset": "gateway_dns",
          "destination_conf": "s3://mybucket/logs?region=us-west-2",
          "enabled": false,
          "error_message": null,
          "filter": "{\"where\":{\"and\":[{\"key\":\"ClientRequestPath\",\"operator\":\"contains\",\"value\":\"/static\"},{\"key\":\"ClientRequestHost\",\"operator\":\"eq\",\"value\":\"example.com\"}]}}",
          "id": 1,
          "kind": "",
          "last_complete": null,
          "last_error": null,
          "max_upload_bytes": 5000000,
          "max_upload_interval_seconds": 30,
          "max_upload_records": 1000,
          "name": "example.com",
          "output_options": {
            "CVE-2021-44228": false,
            "batch_prefix": "",
            "batch_suffix": "",
            "field_delimiter": ",",
            "field_names": [
              "Datetime",
              "DstIP",
              "SrcIP"
            ],
            "output_type": "ndjson",
            "record_delimiter": "",
            "record_prefix": "{",
            "record_suffix": "}\n",
            "sample_rate": 1,
            "timestamp_format": "unixnano"
          }
        },
        "success": true
      }
order: 1000
