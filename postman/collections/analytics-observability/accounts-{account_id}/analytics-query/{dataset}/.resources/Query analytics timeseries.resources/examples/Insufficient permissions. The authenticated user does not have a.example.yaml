$kind: http-example
id: d8e771f8-963a-523d-8e75-1ccd41bdeb74
name: |
  Insufficient permissions. The authenticated user does not have access to the requested dataset or account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics/query/{{dataset}}/timeseries"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "filters": [
          {
            "name": "allowed",
            "op": "eq",
            "values": [
              true
            ]
          }
        ],
        "from": "2024-11-01T00:00:00Z",
        "groupBy": [
          "country",
          "allowed"
        ],
        "resolution": "day",
        "stats": [
          "attemptsTotal"
        ],
        "to": "2024-11-08T00:00:00Z"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11003,
            "message": "art.api.resource.insufficient_permissions"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 4000
