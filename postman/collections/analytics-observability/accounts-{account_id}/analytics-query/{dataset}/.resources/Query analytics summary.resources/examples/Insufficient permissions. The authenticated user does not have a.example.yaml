$kind: http-example
id: 611e72f3-b179-5d59-aa11-bb8f5397e1d6
name: |
  Insufficient permissions. The authenticated user does not have access to the requested dataset or account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics/query/{{dataset}}/summary"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "filters": [],
        "from": "2024-11-01T00:00:00Z",
        "groupBy": [],
        "stats": [
          "attemptsTotal"
        ],
        "to": "2024-11-08T00:00:00Z"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11003,
            "message": "art.api.resource.insufficient_permissions"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 4000
