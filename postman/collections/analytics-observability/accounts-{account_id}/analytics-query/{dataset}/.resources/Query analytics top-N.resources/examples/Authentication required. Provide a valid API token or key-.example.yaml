  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11003,
            "message": "art.api.resource.insufficient_permissions"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
