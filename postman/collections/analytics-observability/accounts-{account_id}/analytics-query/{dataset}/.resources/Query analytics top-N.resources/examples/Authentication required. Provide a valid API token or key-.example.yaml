id: 375ea1e8-eb30-5ef1-919b-58d227e87240
name: Authentication required. Provide a valid API token or key.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics/query/{{dataset}}/top-n"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "filters": [],
        "from": "2024-11-05T00:00:00Z",
        "groupBy": [
          "appName",
          "appCategory"
        ],
        "n": 10,
        "orderBy": "bytesTotal",
        "stats": [
          "bytesTotal",
          "requestsTotal"
        ],
        "to": "2024-11-06T00:00:00Z"
      }
