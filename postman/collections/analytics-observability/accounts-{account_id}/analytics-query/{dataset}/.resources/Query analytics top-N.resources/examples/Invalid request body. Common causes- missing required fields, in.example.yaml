$kind: http-example
id: b0a01a2d-1995-58d9-851f-b4d01882f34b
name: |
  Invalid request body. Common causes: missing required fields, invalid timestamp format (must be RFC3339), or unknown dataset/column/stat names.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics/query/{{dataset}}/top-n"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "filters": [],
        "from": "2024-11-05T00:00:00Z",
        "groupBy": [
          "appName",
          "appCategory"
        ],
        "n": 10,
        "orderBy": "bytesTotal",
        "stats": [
          "bytesTotal",
          "requestsTotal"
        ],
        "to": "2024-11-06T00:00:00Z"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11005,
            "message": "art.api.parameter.invalid"
          }
        ],
        "messages": [
          {
            "code": 1002,
            "message": "Parameter 'from' has invalid value '2024-11-05 00:00:00'. Should be of type: 'RFC3339'"
          }
        ],
        "result": null,
        "success": false
      }
order: 2000
