$kind: http-example
id: 4a6e1676-20e8-5fa0-91f6-378012d181d4
name: |
  Insufficient permissions. The authenticated user does not have access to the requested dataset or account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/analytics/query/{{dataset}}/top-n"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "filters": [],
        "from": "2024-11-05T00:00:00Z",
        "groupBy": [
          "appName",
          "appCategory"
        ],
        "n": 10,
        "orderBy": "bytesTotal",
        "stats": [
          "bytesTotal",
          "requestsTotal"
        ],
        "to": "2024-11-06T00:00:00Z"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11003,
            "message": "art.api.resource.insufficient_permissions"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 4000
