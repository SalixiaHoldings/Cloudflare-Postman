$kind: http-example
id: 97f0a3d2-d0d8-5af3-9ee4-358a9508ba64
name: "Bad Gateway: Policy logs backend (ClickHouse) is unavailable"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/policies/logs"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: since
      value: 2026-04-01T00:00:00Z
      disabled: true
      description: Lower bound on the log entry timestamp. Accepts ISO 8601 / RFC3339 or epoch seconds. Defaults to 7 days before `until`. The window between `since` and `until` cannot exceed 180 days.
    - key: until
      value: 2026-04-08T00:00:00Z
      disabled: true
      description: Upper bound on the log entry timestamp. Accepts ISO 8601 / RFC3339 or epoch seconds. Defaults to the current time. Must be greater than or equal to `since`.
    - key: integration_id
      value: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      disabled: true
      description: Comma-separated list of CASB integration IDs to filter by. At most 100 values, each at most 128 characters. Values outside the account's tenancy allowlist are silently ignored. When omitted, results are scoped to the full allowlist.
    - key: policy_name
      value: Auto-remediate publicly shared files
      disabled: true
      description: Comma-separated list of policy display names to filter by. At most 100 values, each at most 255 characters.
    - key: page
      value: "8359"
      disabled: true
      description: A page number within the paginated result set.
    - key: per_page
      value: "8359"
      disabled: true
      description: Number of results to return per page.
response:
  statusCode: 502
  statusText: Bad Gateway
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 5000
