  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: limit
      value: "5"
      description: Limits the number of objects returned in the response.
    - key: offset
      value: "1874"
      description: Skips the specified number of objects before fetching the results.
    - key: metric
      value: NUMBER_OF_OFFENDING_IPS
      description: Metric to rank ASNs by.
    - key: date
      value: 2026-02-04
      description: "The date to retrieve (YYYY-MM-DD format). If not specified, returns the most recent available data. Note: This is the date the report was generated. The report is generated from information collected from the previous day (e.g., the 2026-02-23 entry contains data from 2026-02-22)."
    - key: compareDateRange
      value: 7d
      description: Relative date range for rank change comparison (e.g., "1d", "7d", "30d").
    - key: location
      value: US
      description: Filters results by location. Specify an alpha-2 location code.
    - key: asn
      value: string
      description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
    - key: asn
      value: string
      description: Filters results by Autonomous System. Specify one or more Autonomous System Numbers (ASNs) as a comma-separated list. Prefix with `-` to exclude ASNs from results. For example, `-174, 3356` excludes results from AS174, but includes results from AS3356.
    - key: sortOrder
      value: DESC
      description: Sort order.
    - key: format
      value: JSON
      description: Format in which results will be returned.
