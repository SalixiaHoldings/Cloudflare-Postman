$kind: http-example
id: d15bcb8a-9c58-5e0c-bec0-1f30011a1b5d
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_id}}/appeals/eligibility"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
