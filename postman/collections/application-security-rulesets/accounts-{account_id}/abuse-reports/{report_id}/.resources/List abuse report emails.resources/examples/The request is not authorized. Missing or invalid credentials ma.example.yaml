$kind: http-example
id: 6e3f5f2d-e778-5c60-9f25-e4eb4e7e89bb
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_id}}/emails"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      disabled: true
      description: Page number to retrieve (default 1)
    - key: per_page
      value: "6305"
      disabled: true
      description: Number of emails per page (default 20, max 100)
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
