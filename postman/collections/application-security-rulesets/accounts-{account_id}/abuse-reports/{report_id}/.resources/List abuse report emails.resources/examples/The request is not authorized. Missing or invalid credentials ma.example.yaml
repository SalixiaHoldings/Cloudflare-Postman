$kind: http-example
id: b35f773a-7c8e-51c3-9c45-651893e47336
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_id}}/emails?page=6305&per_page=6305"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      description: Page number to retrieve (default 1)
    - key: per_page
      value: "6305"
      description: Number of emails per page (default 20, max 100)
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
