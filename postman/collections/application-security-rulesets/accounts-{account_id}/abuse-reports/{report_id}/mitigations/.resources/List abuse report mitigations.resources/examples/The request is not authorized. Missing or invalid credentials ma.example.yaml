$kind: http-example
id: d81438dd-6e58-5b78-b666-c25e6b2d3ebd
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_id}}/mitigations"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      disabled: true
      description: Where in pagination to start listing abuse reports
    - key: per_page
      value: "6305"
      disabled: true
      description: How many abuse reports per page to list
    - key: sort
      value: type,desc
      disabled: true
      description: A property to sort by, followed by the order
    - key: type
      value: string
      disabled: true
      description: Filter by the type of mitigation. This filter parameter can be specified multiple times to include multiple types of mitigations in the result set.
    - key: effective_before
      value: 2009-11-10T23:00:00Z
      disabled: true
      description: Returns mitigations that were dispatched before the given date
    - key: effective_after
      value: 2009-11-10T23:00:00Z
      disabled: true
      description: Returns mitigation that were dispatched after the given date
    - key: status
      value: active
      disabled: true
      description: Filter by the status of the mitigation.
    - key: entity_type
      value: account
      disabled: true
      description: Filter by the type of entity the mitigation impacts.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
