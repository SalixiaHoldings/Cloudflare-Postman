$kind: http-example
id: 9d6a1dcb-d6dc-5acb-baf4-a04d3c5ed445
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      disabled: true
      description: Where in pagination to start listing abuse reports
    - key: per_page
      value: "6305"
      disabled: true
      description: How many abuse reports per page to list
    - key: sort
      value: cdate,desc
      disabled: true
      description: A property to sort by, followed by the order (id, cdate, domain, type, status)
    - key: domain
      value: example.com
      disabled: true
      description: Filter by domain name related to the abuse report
    - key: created_before
      value: 2009-11-10T23:00:00Z
      disabled: true
      description: Returns reports created before the specified date
    - key: created_after
      value: 2009-11-10T23:00:00Z
      disabled: true
      description: Returns reports created after the specified date
    - key: status
      value: in_review
      disabled: true
      description: Filter by the status of the report.
    - key: type
      value: REG_WHO
      disabled: true
      description: Filter by the type of the report.
    - key: mitigation_status
      value: active
      disabled: true
      description: Filter reports that have any mitigations in the given status.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
