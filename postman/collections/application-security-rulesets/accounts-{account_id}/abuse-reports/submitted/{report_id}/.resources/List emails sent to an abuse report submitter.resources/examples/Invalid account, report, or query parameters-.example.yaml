$kind: http-example
id: a86c1ff5-ee9f-5527-a754-582a38bf818c
name: Invalid account, report, or query parameters.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted/{{report_id}}/emails?page=6305&per_page=6305"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      description: Page number to retrieve (default 1).
    - key: per_page
      value: "6305"
      description: Number of emails per page (default 20, max 100).
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
