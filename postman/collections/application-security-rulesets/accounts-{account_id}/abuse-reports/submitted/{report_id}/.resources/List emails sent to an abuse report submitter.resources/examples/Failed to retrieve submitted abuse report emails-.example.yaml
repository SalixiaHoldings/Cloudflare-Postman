$kind: http-example
id: 96651148-47e9-5360-9a12-1bb14526716b
name: Failed to retrieve submitted abuse report emails.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted/{{report_id}}/emails"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      disabled: true
      description: Page number to retrieve (default 1).
    - key: per_page
      value: "6305"
      disabled: true
      description: Number of emails per page (default 20, max 100).
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 5000
