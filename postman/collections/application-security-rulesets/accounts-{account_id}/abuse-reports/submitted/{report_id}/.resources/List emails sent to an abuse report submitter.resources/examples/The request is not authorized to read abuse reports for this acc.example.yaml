$kind: http-example
id: 8809fb08-3cef-5943-85d8-6a6be74f39d3
name: The request is not authorized to read abuse reports for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted/{{report_id}}/emails"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "6305"
      disabled: true
      description: Page number to retrieve (default 1).
    - key: per_page
      value: "6305"
      disabled: true
      description: Number of emails per page (default 20, max 100).
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
