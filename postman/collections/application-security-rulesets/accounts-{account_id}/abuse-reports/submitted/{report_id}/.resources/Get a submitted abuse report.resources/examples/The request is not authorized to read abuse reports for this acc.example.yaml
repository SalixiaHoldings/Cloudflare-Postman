$kind: http-example
id: 1549e830-3a98-5e33-91b5-0440c804a40e
name: The request is not authorized to read abuse reports for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted/{{report_id}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
