$kind: http-example
id: 40de7204-24bc-5ce3-a5e1-33da5a8f144b
name: The request is not authorized to read abuse reports for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page of submitted reports to return.
    - key: per_page
      value: "100"
      disabled: true
      description: Number of submitted reports per page.
    - key: sort
      value: cdate,desc
      disabled: true
      description: A property and direction to sort by (id, cdate, domain, type, status).
    - key: id
      value: string
      disabled: true
      description: Filter by report code.
    - key: domain
      value: string
      disabled: true
      description: Filter by reported domain. This parameter can be specified multiple times.
    - key: domain
      value: string
      disabled: true
      description: Filter by reported domain. This parameter can be specified multiple times.
    - key: created_before
      value: 1995-01-25T04:50:11.938Z
      disabled: true
      description: Return reports submitted before this time.
    - key: created_after
      value: 1995-01-25T04:50:11.938Z
      disabled: true
      description: Return reports submitted after this time.
    - key: status
      value: submitted
      disabled: true
      description: Filter by submitter-facing status. This parameter can be specified multiple times.
    - key: status
      value: accepted
      disabled: true
      description: Filter by submitter-facing status. This parameter can be specified multiple times.
    - key: type
      value: <string>
      disabled: true
      description: Filter by report type. This parameter can be specified multiple times.
    - key: type
      value: <string>
      disabled: true
      description: Filter by report type. This parameter can be specified multiple times.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
