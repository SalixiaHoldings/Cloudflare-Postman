$kind: http-example
id: 603024d7-be10-5710-afd1-edea8be562da
name: The request is not authorized to read abuse reports for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/submitted?page=1&per_page=100&sort=cdate,desc&id=string&domain=string&domain=string&created_before=1975-02-17T04:30:50.988Z&created_after=1975-02-17T04:30:50.988Z&status=denied&status=denied&type=<string>&type=<string>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Page of submitted reports to return.
    - key: per_page
      value: "100"
      description: Number of submitted reports per page.
    - key: sort
      value: cdate,desc
      description: A property and direction to sort by (id, cdate, domain, type, status).
    - key: id
      value: string
      description: Filter by report code.
    - key: domain
      value: string
      description: Filter by reported domain. This parameter can be specified multiple times.
    - key: domain
      value: string
      description: Filter by reported domain. This parameter can be specified multiple times.
    - key: created_before
      value: 1975-02-17T04:30:50.988Z
      description: Return reports submitted before this time.
    - key: created_after
      value: 1975-02-17T04:30:50.988Z
      description: Return reports submitted after this time.
    - key: status
      value: denied
      description: Filter by submitter-facing status. This parameter can be specified multiple times.
    - key: status
      value: denied
      description: Filter by submitter-facing status. This parameter can be specified multiple times.
    - key: type
      value: <string>
      description: Filter by report type. This parameter can be specified multiple times.
    - key: type
      value: <string>
      description: Filter by report type. This parameter can be specified multiple times.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
