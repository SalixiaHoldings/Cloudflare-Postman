$kind: http-example
id: 3b332135-7b91-5986-b566-411c96d94dce
name: |-
  The request is not authorized to submit abuse reports. Missing or
  invalid credentials may be rejected with the standard Cloudflare API
  authentication error. If credentials are valid, this is most commonly
  because the account does not have the abuse-reports entitlement
  (Enterprise accounts have it by default; other accounts must request
  access), or because the API token is missing the
  `Account > Abuse Reports > Edit` permission. Entitlement failures
  return the message `Not entitled to use feature: Abuse Report API`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_param}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "act": "abuse_dmca",
        "email": "{{email}}",
        "email2": "{{email2}}",
        "name": "{{name}}",
        "urls": "{{urls}}",
        "address1": "{{address1}}",
        "agent_name": "{{agent_name}}",
        "agree": 1,
        "city": "{{city}}",
        "country": "{{country}}",
        "host_notification": "send",
        "original_work": "{{original_work}}",
        "owner_notification": "send",
        "signature": "{{signature}}",
        "state": "{{state}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
