name: Report submitted with an error
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_param}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "act": "abuse_dmca",
        "email": "{{email}}",
        "email2": "{{email2}}",
        "name": "{{name}}",
        "urls": "{{urls}}",
        "address1": "{{address1}}",
        "agent_name": "{{agent_name}}",
        "agree": 1,
        "city": "{{city}}",
        "country": "{{country}}",
        "host_notification": "send",
        "original_work": "{{original_work}}",
        "owner_notification": "send",
        "signature": "{{signature}}",
        "state": "{{state}}"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "request": {
          "act": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "result": "string",
        "msg": "string",
        "err_code": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "error_code": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
