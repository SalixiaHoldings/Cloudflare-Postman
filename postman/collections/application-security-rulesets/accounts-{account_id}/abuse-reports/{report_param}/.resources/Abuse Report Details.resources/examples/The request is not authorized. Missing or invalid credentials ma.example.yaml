$kind: http-example
id: 6cb3eadf-a34b-5699-996c-d7d4c5f4f736
name: |-
  The request is not authorized. Missing or invalid credentials may be
  rejected with the standard Cloudflare API authentication error. If
  credentials are valid, the API token does not have the Abuse Reports
  read permission required for this account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/abuse-reports/{{report_param}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
