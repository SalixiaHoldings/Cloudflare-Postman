$kind: http-example
id: c870307f-a70d-5ac1-b700-875cb6e47989
name: |
  Successful response. Check the `messages` array for non-fatal
  warnings that arose during scan creation.
request:
  url: "{{base_url}}/accounts/{{account_id}}/vuln_scanner/scans"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "target_environment_id": "{{target_environment_id}}",
        "scan_type": "bola",
        "open_api": "{{open_api}}",
        "credential_sets": {
          "owner": "{{credential_sets__owner}}",
          "attacker": "{{credential_sets__attacker}}"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result_info": {}
      }
order: 1000
