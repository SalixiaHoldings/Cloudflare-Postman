$kind: http-example
id: 2d60bb0e-1832-5626-8dfb-1607d700b0eb
name: A ruleset response, or a successful dry-run validation response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/rulesets/{{ruleset_id}}/rules/{{rule_id}}"
  method: DELETE
  headers:
    Accept: application/json
  queryParams:
    - key: dry_run
      value: "false"
      disabled: true
      description: "Validates the request without persisting changes when set to `true`. Responses that normally return 200 return `result: null`; endpoints that normally return 204 continue to return 204."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": true,
        "errors": [],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
