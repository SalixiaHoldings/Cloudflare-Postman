$kind: http-example
id: 6a477ce2-cc74-55e3-a26a-ed7f7c1b143f
name: A ruleset response, or a successful dry-run validation response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/rulesets/{{ruleset_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: dry_run
      value: "false"
      disabled: true
      description: "Validates the request without persisting changes when set to `true`. Responses that normally return 200 return `result: null`; endpoints that normally return 204 continue to return 204."
  body:
    type: json
    content: "{}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": true,
        "errors": [],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
