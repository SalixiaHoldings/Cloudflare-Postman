request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/brand-protection/logo/search"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: showHistoric
      value: "false"
      disabled: true
      description: "Include scanned images without domain metadata (historic data). Default: false (only show images with domain)"
    - key: download
      value: string
      disabled: true
      description: If true, include base64-encoded image data in the response
  body:
    type: json
    content: |-
      {
        "image_data": "string",
        "score_threshold": 0,
        "top_k": 10
      }
