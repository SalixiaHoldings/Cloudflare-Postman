$kind: http-example
id: 0bfec56b-e063-5cd0-8e36-91aea1d9990a
name: Threat Signals response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/threat-signals/curated-feeds/bulk"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "feeds": [
          {
            "url": "{{feeds__0__url}}",
            "name": "{{feeds__0__name}}",
            "category": "{{feeds__0__category}}"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
