$kind: http-example
id: 5aef7e48-48d7-5255-8bf7-7ff847a1e180
request:
  url: "{{base_url}}/accounts/{{account_id}}/challenges/widgets?page=1&per_page=25&order=id&direction=asc&filter=name:my-widget"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
    - key: per_page
      value: "25"
    - key: order
      value: id
    - key: direction
      value: asc
    - key: filter
      value: name:my-widget
      description: |
        Filter widgets by field using case-insensitive substring matching.
        Format: `field:value`

        Supported fields:
        - `name` - Filter by widget name (e.g., `filter=name:login-form`)
        - `sitekey` - Filter by sitekey (e.g., `filter=sitekey:0x4AAA`)

        Returns 400 Bad Request if the field is unsupported or format is invalid.
        An empty filter value returns all results.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": {}
      }
