$kind: http-example
id: d9b579aa-de5b-5698-9b1e-99be3980559f
name: Delete Leaked Credential Checks custom detection location response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/leaked-credential-checks/detections/{{detection_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [],
        "messages": [],
        "result": {}
      }
order: 1000
