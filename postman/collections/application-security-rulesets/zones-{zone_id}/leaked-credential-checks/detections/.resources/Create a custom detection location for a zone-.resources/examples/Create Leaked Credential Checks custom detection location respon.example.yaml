$kind: http-example
id: d1f919c3-7766-5bf4-927a-30f9e37d3d54
name: Create Leaked Credential Checks custom detection location response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/leaked-credential-checks/detections"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "password": "{{password}}",
        "username": "lookup_json_string(http.request.body.raw, \"user\")"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
