$kind: http-example
id: cdf60e64-de41-5d9e-897c-41d075a0cfb9
name: Retrieve operations and features as OpenAPI schemas response failure
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/schemas"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: host
      value: www.example.com
      disabled: true
    - key: feature
      value: thresholds
      disabled: true
      description: Add feature(s) to the results. The feature name that is given here corresponds to the resulting feature object. Have a look at the top-level object description for more details on the specific meaning.
    - key: include_schema_kind
      value: learned
      disabled: true
      description: Schema kinds to include in exported OpenAPI schemas.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
