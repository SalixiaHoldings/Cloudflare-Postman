id: 25208b13-9a30-5fd0-adb5-71a20203aff0
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/labels?page=1&per_page=20&order=description&direction=desc&source=user&filter=login&with_mapped_resource_counts=true"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: page
      value: "1"
      description: Page number of paginated results.
    - key: per_page
      value: "20"
      description: Maximum number of results per page.
    - key: order
      value: description
    - key: direction
      value: desc
    - key: source
      value: user
      description: Filter for labels with source
    - key: filter
      value: login
      description: Filter for labels where the name or description matches using substring match
    - key: with_mapped_resource_counts
      value: "true"
      description: Include `mapped_resources` for each label
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
