$kind: http-example
id: d1f43aae-50ad-5018-97b6-681354f230b2
name: Retrieve information about a specific schema zone response failure
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/user_schemas/{{schema_id}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: omit_source
      value: "false"
      disabled: true
      description: Omit the source-files of schemas and only retrieve their meta-data.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
