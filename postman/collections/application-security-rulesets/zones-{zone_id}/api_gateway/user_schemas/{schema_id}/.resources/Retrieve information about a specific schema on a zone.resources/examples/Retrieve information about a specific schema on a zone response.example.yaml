  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: omit_source
      value: "false"
      disabled: true
      description: Omit the source-files of schemas and only retrieve their meta-data.
