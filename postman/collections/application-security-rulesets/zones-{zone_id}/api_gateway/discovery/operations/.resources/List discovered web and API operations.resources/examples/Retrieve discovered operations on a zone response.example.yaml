$kind: http-example
id: a8ce942f-8228-5a6e-8d30-1fb94fdbba5a
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/discovery/operations"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page number of paginated results.
    - key: per_page
      value: "20"
      disabled: true
      description: Maximum number of results per page.
    - key: host
      value: api.cloudflare.com
      disabled: true
    - key: method
      value: GET
      disabled: true
    - key: endpoint
      value: /api/v1
      disabled: true
    - key: direction
      value: desc
      disabled: true
    - key: order
      value: method
      disabled: true
    - key: diff
      value: "true"
      disabled: true
    - key: origin
      value: ML
      disabled: true
      description: |
        Filter results to only include discovery results sourced from a particular discovery engine
          * `ML` - Discovered operations that were sourced using ML API Discovery
          * `SessionIdentifier` - Discovered operations that were sourced using Session Identifier API Discovery
    - key: state
      value: saved
      disabled: true
      description: |
        Filter results to only include discovery results in a particular state. States are as follows
          * `review` - Discovered operations that are not saved into API Shield Endpoint Management
          * `saved` - Discovered operations that are already saved into API Shield Endpoint Management
          * `ignored` - Discovered operations that have been marked as ignored
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
