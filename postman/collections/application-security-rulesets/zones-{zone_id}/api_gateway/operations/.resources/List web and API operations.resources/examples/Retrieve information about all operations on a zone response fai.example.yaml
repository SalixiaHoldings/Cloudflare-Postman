$kind: http-example
id: 99f3c487-ca2b-5ab3-8770-2c264b8a39ae
name: Retrieve information about all operations on a zone response failure
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/operations"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page number of paginated results.
    - key: per_page
      value: "20"
      disabled: true
      description: Maximum number of results per page.
    - key: order
      value: method
      disabled: true
    - key: direction
      value: desc
      disabled: true
    - key: host
      value: api.cloudflare.com
      disabled: true
    - key: method
      value: GET
      disabled: true
    - key: endpoint
      value: /api/v1
      disabled: true
    - key: feature
      value: thresholds
      disabled: true
      description: Add feature(s) to the results. The feature name that is given here corresponds to the resulting feature object. Have a look at the top-level object description for more details on the specific meaning.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
