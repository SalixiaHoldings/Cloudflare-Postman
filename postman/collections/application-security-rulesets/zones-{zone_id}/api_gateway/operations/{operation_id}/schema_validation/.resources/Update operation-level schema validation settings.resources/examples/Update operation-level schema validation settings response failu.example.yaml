id: e40591d9-5493-5551-9a01-a540759f629e
name: Update operation-level schema validation settings response failure
request:
  url: "{{base_url}}/zones/{{zone_id}}/api_gateway/operations/{{operation_id}}/schema_validation"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "mitigation_action": "block"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
