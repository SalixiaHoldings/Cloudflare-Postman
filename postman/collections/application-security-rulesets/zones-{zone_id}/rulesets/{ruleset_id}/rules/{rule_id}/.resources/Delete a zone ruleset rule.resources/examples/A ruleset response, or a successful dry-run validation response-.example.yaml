$kind: http-example
id: fcf665e0-f8ee-5830-8aaa-c28793218281
name: A ruleset response, or a successful dry-run validation response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/rulesets/{{ruleset_id}}/rules/{{rule_id}}?dry_run=false"
  method: DELETE
  headers:
    Accept: application/json
  queryParams:
    - key: dry_run
      value: "false"
      description: "Validates the request without persisting changes when set to `true`. Responses that normally return 200 return `result: null`; endpoints that normally return 204 continue to return 204."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": true,
        "errors": [],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
