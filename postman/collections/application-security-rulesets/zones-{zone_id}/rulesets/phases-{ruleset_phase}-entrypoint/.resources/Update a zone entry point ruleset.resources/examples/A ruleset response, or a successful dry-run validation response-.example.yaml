$kind: http-example
id: 20484cb8-a5f1-5a8b-8431-8bc4c614e98d
name: A ruleset response, or a successful dry-run validation response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/rulesets/phases/{{ruleset_phase}}/entrypoint"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: dry_run
      value: "false"
      disabled: true
      description: "Validates the request without persisting changes when set to `true`. Responses that normally return 200 return `result: null`; endpoints that normally return 204 continue to return 204."
  body:
    type: json
    content: "{}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": true,
        "errors": [],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
