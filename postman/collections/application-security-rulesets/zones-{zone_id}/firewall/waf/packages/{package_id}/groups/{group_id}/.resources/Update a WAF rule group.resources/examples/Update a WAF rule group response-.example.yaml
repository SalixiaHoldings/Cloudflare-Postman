id: 4bc10178-fd39-5571-a883-e7a6bde4acda
name: Update a WAF rule group response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/firewall/waf/packages/{{package_id}}/groups/{{group_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "mode": "on"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {}
      }
order: 1000
