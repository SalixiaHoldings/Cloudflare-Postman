id: bc5ee347-6fe1-5e3e-bb86-cf1f417bd9e1
name: Enable Content Scanning response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/content-upload-scan/enable"
  method: POST
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [],
        "messages": [],
        "result": {}
      }
order: 1000
