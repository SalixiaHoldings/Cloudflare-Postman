$kind: http-example
id: 0881247f-ffc9-5b33-8f57-b0725f6bbefe
name: Update Content Scanning settings failure response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/content-upload-scan/settings"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "value": "enabled"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 10000,
            "message": "Authentication error"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
