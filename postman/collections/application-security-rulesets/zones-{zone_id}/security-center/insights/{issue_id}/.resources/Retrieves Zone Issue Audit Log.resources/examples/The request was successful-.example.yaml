      value: "25"
      description: Number of results per page.
    - key: cursor
      value: string
      description: Opaque cursor for pagination. Use the cursor value from result_info of the previous response.
    - key: field_changed
      value: user_classification
      description: Filter by the field that was changed.
    - key: changed_by
      value: string
      description: Filter by the actor that made the change.
    - key: since
      value: 1975-02-17T04:30:50.988Z
      description: Filter entries changed at or after this timestamp (RFC 3339).
    - key: before
      value: 1975-02-17T04:30:50.988Z
      description: Filter entries changed before this timestamp (RFC 3339).
    - key: order
      value: desc
      description: Sort order for results. Use 'asc' for oldest first or 'desc' for newest first.
