$kind: http-example
id: ec443ce3-3981-5592-a145-5ce3dd71a80a
name: Edit DNSSEC Status response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/dnssec"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "dnssec_multi_signer": false,
        "dnssec_presigned": true,
        "dnssec_use_nsec3": false,
        "status": "active"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
