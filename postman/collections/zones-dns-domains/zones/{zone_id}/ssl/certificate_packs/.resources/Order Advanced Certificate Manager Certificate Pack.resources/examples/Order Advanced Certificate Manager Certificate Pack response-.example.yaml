$kind: http-example
id: 4932a84d-ce81-5e17-9109-fff7becbba16
name: Order Advanced Certificate Manager Certificate Pack response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/ssl/certificate_packs/order"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "type": "advanced",
        "hosts": [
          "example.com",
          "*.example.com",
          "www.example.com"
        ],
        "validation_method": "txt",
        "validity_days": 30,
        "certificate_authority": "lets_encrypt",
        "cloudflare_branding": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
