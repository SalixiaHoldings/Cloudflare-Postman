$kind: http-example
id: 16e1b2bf-9f4f-5aa6-9373-51a320230944
name: Batch create or replace origin cloud region mappings failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/origin/cloud_regions/batch"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      [
        {
          "origin_ip": "192.0.2.1",
          "region": "us-east-1",
          "vendor": "aws"
        },
        {
          "origin_ip": "2001:db8::1",
          "region": "us-central1",
          "vendor": "gcp"
        }
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 1164,
            "message": "Maximum number of IP mappings configured for zone."
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
