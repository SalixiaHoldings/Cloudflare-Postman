$kind: http-example
id: c9823114-b0d8-579c-be30-477ad77eb7d3
name: Create or replace origin cloud region mapping response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/origin/cloud_regions/{{origin_ip}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "origin_ip": "192.0.2.1",
        "region": "us-east-1",
        "vendor": "aws"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "modified_on": "2026-03-01T12:00:00Z",
          "origin_ip": "192.0.2.1",
          "region": "us-east-1",
          "vendor": "aws"
        },
        "success": true
      }
order: 1000
