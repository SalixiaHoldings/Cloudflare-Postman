$kind: http-example
id: 290b57c8-251c-5356-a388-c44815287fc2
name: List origin cloud region mappings failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/origin/cloud_regions"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page number of paginated results.
    - key: per_page
      value: "20"
      disabled: true
      description: Number of items per page.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 1146,
            "message": "invalid per_page parameter, must be between 1 and 100"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
