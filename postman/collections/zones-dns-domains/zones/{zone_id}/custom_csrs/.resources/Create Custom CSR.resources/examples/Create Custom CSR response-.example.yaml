$kind: http-example
id: ac631406-8a19-5f04-85a3-7d064f401c76
name: Create Custom CSR response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/custom_csrs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "country": "US",
        "state": "California",
        "locality": "San Francisco",
        "organization": "Cloudflare, Inc.",
        "common_name": "example.com",
        "sans": [
          "example.com",
          "www.example.com"
        ],
        "key_type": "rsa2048",
        "organizational_unit": "Engineering"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
