id: c77a2056-ef4d-5b2d-b2f6-2116df362cd0
name: Patch Smart Tiered Cache setting response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/cache/tiered_cache_smart_topology_enable"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "value": "on"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
