$kind: http-example
id: 7c493d07-df53-5148-9bb3-c27ec438dba3
name: Batch create or update origin cloud region mappings successful.
request:
  url: "{{base_url}}/zones/{{zone_id}}/cache/origin_cloud_regions/batch"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      [
        {
          "ip": "192.0.2.1",
          "region": "us-east-1",
          "vendor": "aws"
        },
        {
          "ip": "2001:db8::1",
          "region": "us-central1",
          "vendor": "gcp"
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "editable": true,
          "id": "origin_public_cloud_region",
          "modified_on": "2026-03-01T12:00:00Z",
          "value": {
            "failed": [],
            "succeeded": [
              {
                "origin-ip": "192.0.2.1",
                "region": "us-east-1",
                "vendor": "aws"
              },
              {
                "origin-ip": "2001:db8::1",
                "region": "us-central1",
                "vendor": "gcp"
              }
            ]
          }
        },
        "success": true
      }
order: 1000
