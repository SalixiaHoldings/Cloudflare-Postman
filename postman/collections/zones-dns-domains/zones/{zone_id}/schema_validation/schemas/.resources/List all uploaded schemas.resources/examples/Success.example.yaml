request:
  url: "{{base_url}}/zones/{{zone_id}}/schema_validation/schemas"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Page number of paginated results.
    - key: per_page
      value: "20"
      disabled: true
      description: Maximum number of results per page.
    - key: omit_source
      value: "false"
      disabled: true
      description: Omit the source-files of schemas and only retrieve their meta-data.
    - key: validation_enabled
      value: "false"
      disabled: true
      description: Filter for enabled schemas
