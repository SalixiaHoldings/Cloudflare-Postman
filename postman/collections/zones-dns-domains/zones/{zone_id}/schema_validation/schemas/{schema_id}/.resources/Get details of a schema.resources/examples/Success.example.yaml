request:
  url: "{{base_url}}/zones/{{zone_id}}/schema_validation/schemas/{{schema_id}}"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: omit_source
      value: "false"
      disabled: true
      description: Omit the source-files of schemas and only retrieve their meta-data.
