$kind: http-example
id: 5ab6c3be-9175-5861-8d24-ee0dbd9ecbd6
name: Upstream entitlements service unavailable or timed out.
request:
  url: "{{base_url}}/zones/{{zone_id}}/entitlements"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 2003,
            "message": "failed to fetch entitlements: timeout occurred"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 9000
