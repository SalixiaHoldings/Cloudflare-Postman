$kind: http-example
id: 4639f1a3-005d-5d88-a5b1-8a5cb07669f3
name: Upstream entitlements service unavailable or timed out.
request:
  url: "{{base_url}}/zones/{{zone_id}}/entitlements"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 2003,
            "message": "failed to fetch entitlements: timeout occurred"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 9000
