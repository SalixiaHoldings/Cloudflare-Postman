$kind: http-example
id: d3ec131f-8c8f-5eb1-b1be-0d4dc42e45d7
name: Create Spectrum application using a name for the origin response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/spectrum/apps"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "protocol": "tcp/22",
        "dns": {
          "name": "ssh.example.com",
          "type": "CNAME"
        },
        "traffic_type": "direct"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
