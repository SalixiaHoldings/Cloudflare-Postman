$kind: http-example
id: ead38073-8837-5878-863c-fe3caff672c0
name: Create Web3 Hostname error response (4XX).
request:
  url: "{{base_url}}/zones/{{zone_id}}/web3/hostnames"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "gateway.example.com",
        "target": "ipfs",
        "description": "This is my IPFS gateway.",
        "dnslink": "/ipns/onboarding.ipfs.cloudflare.com"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
