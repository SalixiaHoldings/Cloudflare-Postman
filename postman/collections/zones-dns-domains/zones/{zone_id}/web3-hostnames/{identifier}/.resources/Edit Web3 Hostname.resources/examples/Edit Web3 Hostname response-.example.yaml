$kind: http-example
id: 312db3b7-aa4a-509b-ae43-e2820d0cfea4
name: Edit Web3 Hostname response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/web3/hostnames/{{identifier}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "description": "This is my IPFS gateway.",
        "dnslink": "/ipns/onboarding.ipfs.cloudflare.com"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
