$kind: http-example
id: 4c58cf77-6512-5243-92a4-5216ab646a76
name: Precondition failed. The resource has been modified since the provided ETag was obtained.
request:
  url: "{{base_url}}/zones/{{zone_id}}/tags"
  method: PUT
  headers:
    - key: If-Match
      value: '"v1:RBNvo1WzZ4oRRq0W9-hkng"'
      description: |
        ETag value for optimistic concurrency control. When provided, the server will
        verify the current resource ETag matches before applying the write. Returns
        412 Precondition Failed if the resource has been modified since the ETag was
        obtained. Omit this header for unconditional writes.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-Auth-Email
      value: "{{api_email}}"
    - key: X-Auth-Key
      value: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "resource_type": "zone",
        "resource_id": "023e105f4ecef8ad9ca31a8372d0c353"
      }
response:
  statusCode: 412
  statusText: Precondition Failed
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
