$kind: http-example
id: 9b26b7bd-b30f-5f89-863d-5412ef3bb81c
name: Change Origin H2 Max Streams setting response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/origin_h2_max_streams"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "value": 50
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "editable": true,
          "id": "origin_h2_max_streams",
          "value": 50
        },
        "success": true
      }
order: 1000
