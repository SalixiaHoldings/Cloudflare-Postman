$kind: http-example
id: 4912f018-71da-51d6-bca9-1e33e8da8574
name: Patch Automatic SSL/TLS Enrollment status failure.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/ssl_automatic_mode"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "value": "auto"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 1008,
            "message": "Invalid SSL/TLS encryption configuration value, only auto or custom accepted"
          }
        ],
        "messages": [],
        "result": {
          "editable": true,
          "id": "ssl_automatic_mode",
          "modified_on": "2014-01-01T05:20:00.12345Z",
          "value": "custom"
        },
        "success": false
      }
order: 2000
