description: |-
  GENERATED FILE — DO NOT EDIT.

  Upstream operation: zone-cache-settings-replace-origin-tls-compliance-modes-setting
  PUT /zones/{zone_id}/settings/origin_tls_compliance_modes

  Replace the entire set of TLS compliance modes for the zone with the list provided in the request body. PUT performs a full replace, not a merge — any modes not present in the request body are removed. The request body must be of the form `{"value": ["fips", "pqh"]}`. Currently supported modes are `fips` and `pqh`; an empty list clears the constraint. Future modes (e.g. `cnsa2`) may be added; clients should treat unknown values as opaque strings. Invalid mode values are rejected with a 4xx response.

  Authentication support: bearer-alternative
  Auth declaration SHA-256: 4844622a422ead8f8ff95dad7881ac91bb3b64cd78aae19a345e1aaa5456fdd3
  Upstream security (operation; OR alternatives, AND within each object): [{"api_token":[]},{"api_email":[],"api_key":[]}]
  Selected requirement: {"api_token":[]}
  Use the narrowly scoped api_token; legacy alternatives are not enabled.
url: "{{base_url}}/zones/{{zone_id}}/settings/origin_tls_compliance_modes"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "value": [
        "fips",
