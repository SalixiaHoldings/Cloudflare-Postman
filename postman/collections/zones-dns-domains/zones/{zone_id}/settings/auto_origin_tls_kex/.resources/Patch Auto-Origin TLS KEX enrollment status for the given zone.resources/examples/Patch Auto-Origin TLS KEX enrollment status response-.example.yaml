$kind: http-example
id: 06ff35be-0ca0-542f-920f-a4b81fb1f462
name: Patch Auto-Origin TLS KEX enrollment status response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/auto_origin_tls_kex"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "enabled": false,
          "id": "auto_origin_tls_kex",
          "modified_on": "2014-01-01T05:20:00.12345Z"
        },
        "success": true
      }
order: 1000
