$kind: http-example
id: bfdd34df-982d-5f1f-b628-f1aef922ce8b
name: Get Auto-Origin TLS KEX enrollment status response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/auto_origin_tls_kex"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "enabled": false,
          "id": "auto_origin_tls_kex",
          "modified_on": "2014-01-01T05:20:00.12345Z"
        },
        "success": true
      }
order: 1000
