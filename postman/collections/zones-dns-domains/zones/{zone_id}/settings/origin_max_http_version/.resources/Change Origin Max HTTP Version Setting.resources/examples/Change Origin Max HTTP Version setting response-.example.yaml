$kind: http-example
id: e1db5ea1-13d0-56ae-a958-9e646c62c876
name: Change Origin Max HTTP Version setting response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/settings/origin_max_http_version"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "value": "2"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "editable": true,
          "id": "origin_max_http_version",
          "value": "2"
        },
        "success": true
      }
order: 1000
