$kind: http-example
id: c6f343d0-8154-5607-8c7d-588b970744cb
name: "Error 2067: Wildcard Email Sending is not enabled for this account."
request:
  url: "{{base_url}}/zones/{{zone_id}}/email/sending/subdomains"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "sub.example.com"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
