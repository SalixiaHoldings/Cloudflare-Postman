$kind: http-example
id: 28607b41-991e-59c1-8ef9-0d998c80f8f5
name: Authentication error or missing zone email routing settings update permission.
request:
  url: "{{base_url}}/zones/{{zone_id}}/email/routing"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "skip_wizard": true,
        "support_subaddress": true
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
