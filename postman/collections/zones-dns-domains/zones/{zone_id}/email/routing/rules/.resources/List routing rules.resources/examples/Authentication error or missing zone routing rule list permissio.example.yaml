$kind: http-example
id: f26248be-3c56-540f-8c1b-e7135d0ac88d
name: Authentication error or missing zone routing rule list permission.
request:
  url: "{{base_url}}/zones/{{zone_id}}/email/routing/rules"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "20"
      disabled: true
    - key: enabled
      value: "true"
      disabled: true
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
