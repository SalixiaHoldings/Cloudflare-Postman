$kind: http-example
id: 4ddd35fb-e354-5e84-a8ae-b0a275cf1efc
request:
  url: "{{base_url}}/zones/{{zone_id}}/token_validation/config"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "title": "Example Token Validation Configuration",
        "description": "Long description for Token Validation Configuration",
        "token_sources": [
          "http.request.headers[\"x-auth\"][0]",
          "http.request.cookies[\"Authorization\"][0]"
        ],
        "token_type": "JWT",
        "credentials": {
          "keys": [
            {
              "kid": "{{credentials__keys__0__kid}}",
              "kty": "RSA",
              "alg": "RS256",
              "n": "{{credentials__keys__0__n}}",
              "e": "{{credentials__keys__0__e}}"
            }
          ]
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
