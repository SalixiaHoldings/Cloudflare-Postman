name: Edit TLS setting for hostname response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/hostnames/settings/{{setting_id}}/{{hostname}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "value": [
          "ECDHE-RSA-AES128-GCM-SHA256",
          "AES128-GCM-SHA256"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
