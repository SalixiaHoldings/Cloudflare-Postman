$kind: http-example
id: 8fd3e4c7-6e82-5905-87d8-48957d124be7
name: Domain not found or robots.txt not found.
request:
  url: "{{base_url}}/zones/{{zone_id}}/ai-audit/robots?subdomain=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: subdomain
      value: string
      description: Optional subdomain to fetch robots.txt for. If omitted, fetches robots.txt for the zone apex domain.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "result": {}
      }
order: 5000
