$kind: http-example
id: d6c48f4e-b915-59e8-af8f-2d273bfaeacd
name: Create TSIG response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secondary_dns/tsigs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "tsig.customer.cf.",
        "secret": "{{secret}}",
        "algo": "hmac-sha512."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
