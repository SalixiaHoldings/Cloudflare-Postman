id: b966c9f9-b5ae-5ff5-ace1-1622c2891d45
name: Update TSIG response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secondary_dns/tsigs/{{tsig_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "tsig.customer.cf.",
        "secret": "{{secret}}",
        "algo": "hmac-sha512."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
