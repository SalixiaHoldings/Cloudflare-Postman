$kind: http-example
id: 2cf99ed3-3f69-5864-94b6-c070cbbcbe0f
name: Successfully returned availability results. Each requested domain appears in the `domains` array with its current availability status and pricing (if available).
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/domain-check"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "domains": [
          "myawesomebrand.com",
          "myawesomebrand.net",
          "myawesomebrand.org",
          "myawesomebrand.app",
          "myawesomebrand.dev"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "domains": [
            {
              "name": "xq7mz9brand.com",
              "pricing": {
                "currency": "USD",
                "registration_cost": "8.57",
                "renewal_cost": "8.57"
              },
              "registrable": true,
              "tier": "standard"
            },
            {
              "name": "xq7mz9brand.net",
              "pricing": {
                "currency": "USD",
                "registration_cost": "9.95",
                "renewal_cost": "9.95"
              },
              "registrable": true,
              "tier": "standard"
            }
          ]
        },
        "success": true
      }
order: 1000
