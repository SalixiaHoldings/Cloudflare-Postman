$kind: http-example
id: be091e2e-e053-5253-80d7-151ed129c751
name: |
  Registration is still processing. This occurs when the operation did
  not complete within the synchronous wait window, or when `Prefer: respond-async`
  was sent. Poll the URL in `links.self` to track progress.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/registrations"
  method: POST
  headers:
    - key: Prefer
      value: string
      description: |
        Set to `respond-async` to receive an immediate `202 Accepted` without
        waiting for the operation to complete (RFC 7240).

        The header may be combined with other preferences using standard
        comma-separated syntax.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "auto_renew": false,
        "contacts": {
          "administrator": {
            "email": "katherine@example.io",
            "phone": "+1.5555550102",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94103",
                "state": "CA",
                "street": "789 Mission St"
              },
              "name": "Katherine Johnson",
              "organization": "Example Admin Inc"
            }
          },
          "billing": {
            "email": "dorothy@example.io",
            "phone": "+1.5555550103",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94105",
                "state": "CA",
                "street": "101 Howard St"
              },
              "name": "Dorothy Vaughan",
              "organization": "Example Billing Inc"
            }
          },
          "registrant": {
            "email": "ada@example.io",
            "phone": "+1.5555555555",
            "postal_info": {
              "address": {
                "city": "Austin",
                "country_code": "US",
                "postal_code": "78701",
                "state": "TX",
                "street": "123 Main St"
              },
              "name": "Ada Lovelace",
              "organization": "Example Inc"
            }
          },
          "technical": {
            "email": "grace@example.io",
            "phone": "+1.5555550101",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94105",
                "state": "CA",
                "street": "456 Market St"
              },
              "name": "Grace Hopper",
              "organization": "Example Technical Inc"
            }
          }
        },
        "domain_name": "my-brand-example.io",
        "years": 1
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    - key: Location
      value: string
      description: URL of the workflow status resource (same as `links.self`).
    - key: Preference-Applied
      value: string
      description: Set to `respond-async` when the server honored the preference.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "completed": false,
          "context": {
            "domain_name": "example.com"
          },
          "created_at": "2025-10-27T10:00:00Z",
          "links": {
            "resource": "/accounts/abc/registrar/registrations/example.com",
            "self": "/accounts/abc/registrar/registrations/example.com/registration-status"
          },
          "state": "in_progress",
          "updated_at": "2025-10-27T10:00:10Z"
        },
        "success": true
      }
order: 2000
