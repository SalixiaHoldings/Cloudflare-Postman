$kind: http-example
id: 76cbed80-cc74-55ea-b38d-ac64109e714a
name: |
  Registration completed successfully within the synchronous wait window.
  The workflow status will have `state: succeeded` and `completed: true`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/registrations"
  method: POST
  headers:
    - key: Prefer
      value: string
      description: |
        Set to `respond-async` to receive an immediate `202 Accepted` without
        waiting for the operation to complete (RFC 7240).

        The header may be combined with other preferences using standard
        comma-separated syntax.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "auto_renew": false,
        "contacts": {
          "administrator": {
            "email": "katherine@example.io",
            "phone": "+1.5555550102",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94103",
                "state": "CA",
                "street": "789 Mission St"
              },
              "name": "Katherine Johnson",
              "organization": "Example Admin Inc"
            }
          },
          "billing": {
            "email": "dorothy@example.io",
            "phone": "+1.5555550103",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94105",
                "state": "CA",
                "street": "101 Howard St"
              },
              "name": "Dorothy Vaughan",
              "organization": "Example Billing Inc"
            }
          },
          "registrant": {
            "email": "ada@example.io",
            "phone": "+1.5555555555",
            "postal_info": {
              "address": {
                "city": "Austin",
                "country_code": "US",
                "postal_code": "78701",
                "state": "TX",
                "street": "123 Main St"
              },
              "name": "Ada Lovelace",
              "organization": "Example Inc"
            }
          },
          "technical": {
            "email": "grace@example.io",
            "phone": "+1.5555550101",
            "postal_info": {
              "address": {
                "city": "San Francisco",
                "country_code": "US",
                "postal_code": "94105",
                "state": "CA",
                "street": "456 Market St"
              },
              "name": "Grace Hopper",
