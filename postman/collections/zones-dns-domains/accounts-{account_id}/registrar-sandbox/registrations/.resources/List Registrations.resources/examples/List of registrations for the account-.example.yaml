$kind: http-example
id: f93dcedf-f59f-5d22-a9ab-efefa5d2cea0
name: List of registrations for the account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/registrations"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      disabled: true
      description: |
        Opaque token from a previous response's `result_info.cursor`.
        Pass this value to fetch the next page of results. Omit (or
        pass an empty string) for the first page.
    - key: per_page
      value: "20"
      disabled: true
      description: Number of items to return per page.
    - key: direction
      value: asc
      disabled: true
      description: |
        Sort direction for results. Defaults to ascending order.
    - key: sort_by
      value: registry_created_at
      disabled: true
      description: Column to sort results by. Defaults to registration date (`registry_created_at`) when omitted.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": [],
        "result_info": {
          "count": 0,
          "cursor": "",
          "per_page": 20
        },
        "success": true
      }
order: 1000
