$kind: http-example
id: 9063d203-07b5-5e82-934c-a1a7ef711853
name: Update registration failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/registrations/{{domain_name}}"
  method: PATCH
  headers:
    - key: Prefer
      value: respond-async
      description: |
        Set to `respond-async` to receive an immediate `202 Accepted` without
        waiting for the operation to complete (RFC 7240).
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "auto_renew": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10000,
            "message": "Domain not found"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
