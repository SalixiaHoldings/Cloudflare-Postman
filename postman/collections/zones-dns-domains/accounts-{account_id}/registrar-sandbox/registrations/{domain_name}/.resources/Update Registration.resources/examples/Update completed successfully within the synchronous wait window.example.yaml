$kind: http-example
id: 3faaeb3c-f624-541f-91a3-287ca35fbd3b
name: |
  Update completed successfully within the synchronous wait window.
  The workflow status will have `state: succeeded` and `completed: true`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar-sandbox/registrations/{{domain_name}}"
  method: PATCH
  headers:
    - key: Prefer
      value: respond-async
      description: |
        Set to `respond-async` to receive an immediate `202 Accepted` without
        waiting for the operation to complete (RFC 7240).
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "auto_renew": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Preference-Applied
      value: string
      description: Echoed when the server honored a `Prefer` header.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "completed": true,
          "context": {
            "domain_name": "example.com",
            "registration": {
              "auto_renew": true,
              "created_at": "2025-01-15T10:00:00Z",
              "domain_name": "example.com",
              "expires_at": "2026-01-15T10:00:00Z",
              "locked": true,
              "privacy_mode": "redaction",
              "status": "active"
            }
          },
          "created_at": "2025-10-27T10:00:00Z",
          "links": {
            "resource": "/accounts/abc/registrar/registrations/example.com",
            "self": "/accounts/abc/registrar/registrations/example.com/update-status"
          },
          "state": "succeeded",
          "updated_at": "2025-10-27T10:00:02Z"
        },
        "success": true
      }
order: 1000
