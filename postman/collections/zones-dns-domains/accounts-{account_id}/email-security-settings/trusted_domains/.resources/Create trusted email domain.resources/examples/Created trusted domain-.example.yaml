name: Created trusted domain.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/trusted_domains"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "comments": "Trusted partner domain",
        "is_recent": true,
        "is_regex": false,
        "is_similarity": false,
        "pattern": "example.com"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
