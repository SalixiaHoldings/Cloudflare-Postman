id: fa5c48b7-db82-5b27-9b90-3b32ae1439d4
name: Created trusted domain.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/trusted_domains"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "pattern": "example.com",
        "is_regex": false,
        "is_recent": true,
        "is_similarity": false
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
