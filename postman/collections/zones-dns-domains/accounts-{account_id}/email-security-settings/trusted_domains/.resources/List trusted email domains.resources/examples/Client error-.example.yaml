$kind: http-example
id: 3dce2310-9882-5c56-a8af-f96d1fcd0e66
name: Client error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/trusted_domains"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      disabled: true
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      disabled: true
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: created_at
      disabled: true
      description: Field to sort by.
    - key: direction
      value: asc
      disabled: true
      description: The sorting direction.
    - key: is_recent
      value: "false"
      disabled: true
      description: Filter to show only recently registered domains that are trusted to prevent triggering Suspicious or Malicious dispositions.
    - key: is_similarity
      value: "true"
      disabled: true
      description: Filter to show only proximity domains (partner or approved domains with similar spelling to connected domains) that prevent Spoof dispositions.
    - key: pattern
      value: string
      disabled: true
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
