$kind: http-example
id: 3c36a263-4795-5e37-8b05-4cf87aadf06a
name: List of trusted domains.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/trusted_domains"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      disabled: true
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      disabled: true
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: created_at
      disabled: true
      description: Field to sort by.
    - key: direction
      value: asc
      disabled: true
      description: The sorting direction.
    - key: is_recent
      value: "false"
      disabled: true
      description: Filter to show only recently registered domains that are trusted to prevent triggering Suspicious or Malicious dispositions.
    - key: is_similarity
      value: "true"
      disabled: true
      description: Filter to show only proximity domains (partner or approved domains with similar spelling to connected domains) that prevent Spoof dispositions.
    - key: pattern
      value: string
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
