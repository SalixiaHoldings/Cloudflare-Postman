id: ca3bc26f-e08e-58f2-bd13-5df5647150bc
name: Created domain.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/domains"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "domain": "string",
        "allowed_delivery_modes": [
          "DIRECT"
        ],
        "ip_restrictions": [
          "192.0.2.0/24",
          "2001:db8::/32"
        ],
        "drop_dispositions": [
          "MALICIOUS",
          "MALICIOUS"
        ],
        "regions": [
          "GLOBAL"
        ],
        "integration_id": "a357b99c-647d-1af7-ac76-e2761a01da29",
        "lookback_hops": 10,
        "require_tls_inbound": false,
        "require_tls_outbound": true,
        "transport": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
