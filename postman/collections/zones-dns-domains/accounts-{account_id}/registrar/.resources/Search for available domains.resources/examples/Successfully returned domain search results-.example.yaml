$kind: http-example
id: 17c0f894-a8b0-53a1-a26d-af0694ddd2b6
name: Successfully returned domain search results.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar/domain-search?q=coffee shop&extensions=com,net,org&limit=20"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: q
      value: coffee shop
      description: |
        (Required) The search term to find domain suggestions. Accepts keywords, phrases, or full domain names.
        - Phrases: "coffee shop" returns coffeeshop.com, mycoffeeshop.net, etc.
        - Domain names: "example.com" returns example.com and variations across extensions
    - key: extensions
      value: com,net,org
      description: |
        Limits results to specific domain extensions from the supported set. If not specified,
        returns results across all supported extensions. Extensions not in the supported
        set are silently ignored.
    - key: limit
      value: "20"
      description: |
        Maximum number of domain suggestions to return. Defaults to 20 if not specified.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "domains": [
            {
              "name": "acmecorp.com",
              "pricing": {
                "currency": "USD",
                "registration_cost": "8.57",
                "renewal_cost": "8.57"
              },
              "registrable": true,
              "tier": "standard"
            },
            {
              "name": "acmecorp.dev",
              "pricing": {
                "currency": "USD",
                "registration_cost": "10.11",
                "renewal_cost": "10.11"
              },
              "registrable": true,
              "tier": "standard"
            },
            {
              "name": "acmecorp.app",
              "pricing": {
                "currency": "USD",
                "registration_cost": "11.00",
                "renewal_cost": "11.00"
              },
              "registrable": true,
              "tier": "standard"
            }
          ]
        },
        "success": true
      }
order: 1000
