$kind: http-example
id: 247d6101-db05-5cf6-8c2f-adce6051fb4f
name: List extensions failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/registrar/extensions?name=com&cursor=string&per_page=20&direction=asc&sort_by=name"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: name
      value: com
      description: |
        Filter extensions by exact name match.
        For example, `name=com` returns only the `com` extension.
    - key: cursor
      value: string
      description: |
        Opaque token from a previous response's `result_info.cursor`.
        Pass this value to fetch the next page of results. Omit (or
        pass an empty string) for the first page.
    - key: per_page
      value: "20"
      description: Number of items to return per page.
    - key: direction
      value: asc
      description: |
        Sort direction for results. Defaults to ascending order.
    - key: sort_by
      value: name
      description: |
        Column to sort results by. Defaults to `name` when omitted.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 3000
