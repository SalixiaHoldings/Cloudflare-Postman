$kind: http-example
id: f187260b-6fea-5c8d-861c-19b1a2b26122
name: The request lacks valid authentication credentials.
request:
  url: "{{base_url}}/user/communication_preferences"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "language-locale": "es-ES",
        "preferences": {
          "marketing": {
            "subscribed": true
          },
          "product_news": {
            "subscribed": true
          }
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 4010,
            "message": "Request unauthorized"
          }
        ],
        "messages": [],
        "result": [],
        "success": false
      }
order: 3000
