name: The requested user identity does not exist.
request:
  url: "{{base_url}}/user/communication_preferences"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "language-locale": "es-ES",
        "preferences": {
          "marketing": {
            "subscribed": true
          },
          "product_news": {
            "subscribed": true
          }
        }
      }
