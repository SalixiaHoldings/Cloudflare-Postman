$kind: http-example
id: c68ebd99-718d-513e-b49f-8d02f6fdf8e3
name: The authenticated user does not own the requested resource.
request:
  url: "{{base_url}}/user/communication_preferences"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "language-locale": "es-ES",
        "preferences": {
          "marketing": {
            "subscribed": true
          },
          "product_news": {
            "subscribed": true
          }
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 4030,
            "message": "Request unauthorized"
          }
        ],
        "messages": [],
        "result": [],
        "success": false
      }
order: 4000
