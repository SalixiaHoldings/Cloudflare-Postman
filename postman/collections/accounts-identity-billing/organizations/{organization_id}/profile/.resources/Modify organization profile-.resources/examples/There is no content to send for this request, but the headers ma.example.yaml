$kind: http-example
id: ec3f1ade-430f-5cad-8c1f-343731d5feb3
name: There is no content to send for this request, but the headers may be useful.
request:
  url: "{{base_url}}/organizations/{{organization_id}}/profile"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "business_name": "string",
        "business_email": "string",
        "business_phone": "string",
        "business_address": "string",
        "external_metadata": "string"
      }
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
