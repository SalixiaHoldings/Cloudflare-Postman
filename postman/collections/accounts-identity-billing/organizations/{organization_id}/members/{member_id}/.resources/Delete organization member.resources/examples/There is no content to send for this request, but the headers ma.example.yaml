name: There is no content to send for this request, but the headers may be useful.
request:
  url: "{{base_url}}/organizations/{{organization_id}}/members/{{member_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
