$kind: http-example
id: 70804df7-2b31-50fb-b572-aa7d793f79fe
name: An unexpected error response.
request:
  url: "{{base_url}}/organizations/{{organization_id}}/members?status=pending&status=active&user.email=string&user.email.contains=string&user.email.startsWith=string&user.email.endsWith=string&page_token=string&page_size=473"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: status
      value: pending
      description: Filter the list of memberships by membership status.
    - key: status
      value: active
      description: Filter the list of memberships by membership status.
    - key: user.email
      value: string
      description: Filter the list of memberships for a specific email.
    - key: user.email.contains
      value: string
      description: Filter the list of memberships for a specific email that contains a substring.
    - key: user.email.startsWith
      value: string
      description: Filter the list of memberships for a specific email that starts with a substring.
    - key: user.email.endsWith
      value: string
      description: Filter the list of memberships for a specific email that ends with a substring.
    - key: page_token
      value: string
      description: |-
        An opaque token returned from the last list response that when
        provided will retrieve the next page.

        Parameters used to filter the retrieved list must remain in subsequent
        requests with a page token.
    - key: page_size
      value: "473"
      description: The amount of items to return. Defaults to 10.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "result": {}
      }
