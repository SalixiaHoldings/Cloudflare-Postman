$kind: http-example
id: 5b8a96fc-b5a7-5620-bbdc-fc03334f6256
name: Organization usage data was successfully retrieved.
request:
  url: "{{base_url}}/organizations/{{organization_id}}/billable/usage?from=2025-05-01&to=2025-05-31"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: from
      value: 2025-05-01
      description: Start date for the usage query (ISO 8601). Required if `to` is set. When omitted along with `to`, defaults to the start of the current month. Filters by charge period (when consumption happened), not billing period. The maximum date range is 31 days.
    - key: to
      value: 2025-05-31
      description: End date for the usage query (ISO 8601). Required if `from` is set. When omitted along with `from`, defaults to today. Filters by charge period (when consumption happened), not billing period. The maximum date range is 31 days.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
