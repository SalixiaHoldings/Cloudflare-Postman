$kind: http-example
id: d98fe3a3-a17b-546d-a155-10fb55d8d24e
request:
  url: "{{base_url}}/accounts/{{account_id}}/cni/slots"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: address_contains
      value: string
      disabled: true
      description: If specified, only show slots with the given text in their address field
    - key: site
      value: string
      disabled: true
      description: If specified, only show slots located at the given site
    - key: speed
      value: string
      disabled: true
      description: If specified, only show slots that support the given speed
    - key: occupied
      value: "false"
      disabled: true
      description: If specified, only show slots with a specific occupied/unoccupied state
    - key: cursor
      value: "535"
      disabled: true
    - key: limit
      value: "629"
      disabled: true
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
