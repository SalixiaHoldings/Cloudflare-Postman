$kind: http-example
id: 59f391ec-3234-5d89-9bf2-914a3a41bffc
request:
  url: "{{base_url}}/accounts/{{account_id}}/cni/slots"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: address_contains
      value: string
      disabled: true
      description: If specified, only show slots with the given text in their address field
    - key: site
      value: string
      disabled: true
      description: If specified, only show slots located at the given site
    - key: speed
      value: string
      disabled: true
      description: If specified, only show slots that support the given speed
    - key: occupied
      value: "true"
      disabled: true
      description: If specified, only show slots with a specific occupied/unoccupied state
    - key: cursor
      value: "4690"
      disabled: true
    - key: limit
      value: "5193"
      disabled: true
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
