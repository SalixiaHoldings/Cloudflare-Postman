    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "interconnect": "string",
        "account": "<string>",
        "magic": {
          "conduit_name": "{{magic__conduit_name}}",
          "description": "{{magic__description}}",
          "mtu": 0
        },
        "bgp": {
          "customer_asn": 0,
          "extra_prefixes": []
        }
      }
