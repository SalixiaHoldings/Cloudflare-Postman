$kind: http-example
id: 1582138d-a4f5-506e-901a-39be6e82c396
request:
  url: "{{base_url}}/accounts/{{account_id}}/cni/interconnects/{{icon}}/loa?name=string"
  method: GET
  headers:
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: name
      value: string
      description: Custom name to use in the LOA instead of the account name (200 Character limit)
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
