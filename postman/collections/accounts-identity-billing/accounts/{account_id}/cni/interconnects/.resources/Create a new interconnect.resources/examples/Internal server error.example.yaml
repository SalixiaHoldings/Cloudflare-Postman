request:
  url: "{{base_url}}/accounts/{{account_id}}/cni/interconnects"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "type": "{{type}}",
        "account": "{{account}}",
        "slot_id": "{{slot_id}}"
      }
