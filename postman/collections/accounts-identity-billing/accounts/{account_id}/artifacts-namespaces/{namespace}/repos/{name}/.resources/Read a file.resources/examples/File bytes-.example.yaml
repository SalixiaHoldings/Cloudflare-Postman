$kind: http-example
id: c2a8771c-4b95-5ee4-98f6-5050fc6a118a
name: File bytes.
request:
  url: "{{base_url}}/accounts/{{account_id}}/artifacts/namespaces/{{namespace}}/repos/{{name}}/file?ref=string&path=string"
  method: GET
  headers:
    Accept: application/octet-stream
  queryParams:
    - key: ref
      value: string
      description: (Required) Git ref, branch, tag, or commit hash.
    - key: path
      value: string
      description: (Required) File path.
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-length
      value: "8161"
      description: Size of the response body in bytes.
    - key: Content-Type
      value: application/octet-stream
  body:
    type: text
    content: string
order: 1000
