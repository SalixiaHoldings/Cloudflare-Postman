$kind: http-example
id: f8ff8578-9c45-5212-990f-6e28c44ed28a
name: File bytes with sniffed Content-Type and browser-safe response headers.
request:
  url: "{{base_url}}/accounts/{{account_id}}/artifacts/namespaces/{{namespace}}/repos/{{name}}/raw/{{ref}}/{{path}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-length
      value: "8161"
      description: Size of the response body in bytes.
    - key: content-security-policy
      value: string
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: '"string"'
order: 1000
