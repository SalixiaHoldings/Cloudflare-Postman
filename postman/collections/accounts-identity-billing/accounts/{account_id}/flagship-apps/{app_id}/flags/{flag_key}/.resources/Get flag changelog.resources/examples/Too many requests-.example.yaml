$kind: http-example
id: ad8c679b-0ae3-5e4b-8d52-68a975ce545e
name: Too many requests.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/flags/{{flag_key}}/changelog"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: limit
      value: string
      disabled: true
      description: Max items to return (1–200).
    - key: cursor
      value: string
      disabled: true
      description: Pagination cursor from a previous response.
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": null,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 6000
