id: db36e6b1-3c34-58e5-8af2-7008f1b89567
name: Flag store temporarily unavailable.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/definitions"
  method: GET
  headers:
    - key: If-None-Match
      value: string
      description: Previously returned ETag, or `*`.
    - key: Accept
      value: application/json
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "string"
      }
order: 7000
