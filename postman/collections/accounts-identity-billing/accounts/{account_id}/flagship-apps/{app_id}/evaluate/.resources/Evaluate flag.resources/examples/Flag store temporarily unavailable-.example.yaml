$kind: http-example
id: 020fa684-db5d-5fd8-b89e-3f31dd45d7d6
name: Flag store temporarily unavailable.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/evaluate?flagKey=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: flagKey
      value: string
      description: (Required) The flag key to evaluate.
    - key: targetingKey
      value: string
      disabled: true
      description: Context targeting key (per OpenFeature spec); used for percentage rollout bucketing.
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "result": null,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 7000
