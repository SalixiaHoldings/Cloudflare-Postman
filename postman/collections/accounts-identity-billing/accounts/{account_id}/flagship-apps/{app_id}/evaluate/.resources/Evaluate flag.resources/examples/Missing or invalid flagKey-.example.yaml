id: 0471199c-0884-54bf-95a6-37cf667c6475
name: Missing or invalid flagKey.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/evaluate?flagKey=string&targetingKey=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: flagKey
      value: string
      description: (Required) The flag key to evaluate.
    - key: targetingKey
      value: string
      description: Context targeting key (per OpenFeature spec); used for percentage rollout bucketing.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": null,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
