$kind: http-example
id: 1a975639-e86a-5ee6-821d-688aa5b6518c
name: Flag evaluation result.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/evaluate?flagKey=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: flagKey
      value: string
      description: (Required) The flag key to evaluate.
    - key: targetingKey
      value: string
      disabled: true
      description: Context targeting key (per OpenFeature spec); used for percentage rollout bucketing.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "flagKey": "string",
        "variant": "string",
        "reason": "DEFAULT",
        "value": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
