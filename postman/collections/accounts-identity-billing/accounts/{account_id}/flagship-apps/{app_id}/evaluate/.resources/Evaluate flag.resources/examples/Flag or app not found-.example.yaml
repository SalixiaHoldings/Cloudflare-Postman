$kind: http-example
id: 4ebdc866-a111-54a5-8b8d-7bb5e4e2467b
name: Flag or app not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/flagship/apps/{{app_id}}/evaluate?flagKey=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: flagKey
      value: string
      description: (Required) The flag key to evaluate.
    - key: targetingKey
      value: string
      disabled: true
      description: Context targeting key (per OpenFeature spec); used for percentage rollout bucketing.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": null,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 5000
