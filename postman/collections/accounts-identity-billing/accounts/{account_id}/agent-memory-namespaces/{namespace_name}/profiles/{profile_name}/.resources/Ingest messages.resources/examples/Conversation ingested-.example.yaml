$kind: http-example
id: 6a4a7177-c9fb-5006-8458-8c0b3d87114e
name: Conversation ingested.
request:
  url: "{{base_url}}/accounts/{{account_id}}/agent-memory/namespaces/{{namespace_name}}/profiles/{{profile_name}}/ingest"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "messages": [
          {
            "role": "user",
            "content": "I really prefer dark mode in the dashboard."
          }
        ],
        "sessionId": "chat-session-42"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {},
        "success": true,
        "errors": [],
        "messages": []
      }
order: 1000
