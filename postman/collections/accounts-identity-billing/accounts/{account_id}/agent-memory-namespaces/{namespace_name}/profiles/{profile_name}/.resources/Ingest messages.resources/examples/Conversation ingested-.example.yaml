$kind: http-example
id: c66c4d0b-8cc7-5a2f-a44c-b87b55dbccff
name: Conversation ingested.
request:
  url: "{{base_url}}/accounts/{{account_id}}/agent-memory/namespaces/{{namespace_name}}/profiles/{{profile_name}}/ingest"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "messages": [
          {
            "role": "user",
            "content": "I really prefer dark mode in the dashboard."
          }
        ],
        "sessionId": "chat-session-42"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {},
        "success": true,
        "errors": [],
        "messages": []
      }
order: 1000
