$kind: http-example
id: 33f461a8-eb55-5653-a96f-1505a4345100
name: "Error 21001: Request body too large."
request:
  url: "{{base_url}}/accounts/{{account_id}}/moq/relays"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Production Live Stream"
      }
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 21007,
            "message": "A MoQ relay with this ID was not found."
          }
        ],
        "messages": [],
        "result": {}
      }
order: 4000
