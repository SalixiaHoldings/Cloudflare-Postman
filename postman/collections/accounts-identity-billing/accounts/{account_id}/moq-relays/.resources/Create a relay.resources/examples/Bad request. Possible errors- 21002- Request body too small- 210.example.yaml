$kind: http-example
id: b508dec4-3f80-57da-b570-cf5dce6b03f9
name: |
  Bad request. Possible errors:
  - 21002: Request body too small
  - 21004: Failed to decode body (invalid JSON)
  - 21011: Invalid relay name (must not be empty)
  - 21014: Config cannot be set on create (set it via PUT after the relay exists)
request:
  url: "{{base_url}}/accounts/{{account_id}}/moq/relays"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Production Live Stream"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 21007,
            "message": "A MoQ relay with this ID was not found."
          }
        ],
        "messages": [],
        "result": {}
      }
order: 2000
