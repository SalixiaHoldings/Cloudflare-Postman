$kind: http-example
id: 2ce33fc1-78ae-516f-9bc8-5f2142864820
name: "Bad request. Possible errors: 21003 (relay ID should be 32 hex characters), invalid token id."
request:
  url: "{{base_url}}/accounts/{{account_id}}/moq/relays/{{relay_id}}/tokens/{{jti}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 21007,
            "message": "A MoQ relay with this ID was not found."
          }
        ],
        "messages": [],
        "result": {}
      }
order: 2000
