id: 5b9c6fbe-27be-5014-b0e4-2f226d276738
name: "Bad request. Possible errors: 21003 (relay ID should be 32 hex characters), invalid token id."
request:
  url: "{{base_url}}/accounts/{{account_id}}/moq/relays/{{relay_id}}/tokens/{{jti}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 21007,
            "message": "A MoQ relay with this ID was not found."
          }
        ],
        "messages": [],
        "result": {}
      }
order: 2000
