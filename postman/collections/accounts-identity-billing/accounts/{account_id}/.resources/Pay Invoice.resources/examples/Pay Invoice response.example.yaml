$kind: http-example
id: 3061db5c-ec18-5df7-b9b4-6aa50ff03190
request:
  url: "{{base_url}}/accounts/{{account_id}}/pay-invoice"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "invoice_id": "string",
        "payment_method_id": "string",
        "validate_payment_method": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "client_secret": "{{client_secret}}"
        }
      }
order: 1000
