$kind: http-example
id: 709dde07-59cf-5cec-b5d2-f3d040cad80b
request:
  url: "{{base_url}}/accounts/{{account_id}}/client-secret"
  method: POST
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "client_secret": "{{client_secret}}"
        }
      }
order: 1000
