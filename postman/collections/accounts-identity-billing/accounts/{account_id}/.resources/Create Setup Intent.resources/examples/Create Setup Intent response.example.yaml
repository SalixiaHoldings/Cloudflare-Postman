$kind: http-example
id: 527fd062-2ddd-5eb8-99b6-aa47e2559d1f
request:
  url: "{{base_url}}/accounts/{{account_id}}/client-secret"
  method: POST
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "client_secret": "{{client_secret}}"
        }
      }
order: 1000
