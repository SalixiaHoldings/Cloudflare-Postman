$kind: http-example
id: 2f98a381-bea7-5b22-99a1-678ed8122330
name: Returns the scan's requested screenshot.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/scan/{{scan_id}}/screenshot"
  method: GET
  headers:
    Accept: image/png
  queryParams:
    - key: resolution
      value: desktop
      disabled: true
      description: Target device type.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/png
  body:
    type: text
    content: string
order: 1000
