$kind: http-example
id: 372b2802-174d-57c5-a90c-e63d812d3659
name: Returns the scan's requested screenshot.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/scan/{{scan_id}}/screenshot"
  method: GET
  headers:
    Accept: image/png
  queryParams:
    - key: resolution
      value: desktop
      disabled: true
      description: Target device type.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/png
  body:
    type: text
    content: string
order: 1000
