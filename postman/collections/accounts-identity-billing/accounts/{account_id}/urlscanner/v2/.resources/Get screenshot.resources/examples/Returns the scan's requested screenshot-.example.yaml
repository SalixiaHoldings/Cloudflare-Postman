$kind: http-example
id: 39cc7689-ef64-551a-b115-2966626dd067
name: Returns the scan's requested screenshot.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/screenshots/{{scan_id}}.png"
  method: GET
  headers:
    Accept: image/png
  queryParams:
    - key: resolution
      value: desktop
      disabled: true
      description: Target device type.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/png
  body:
    type: text
    content: string
order: 1000
