$kind: http-example
id: 5726e565-904f-595e-8bb0-79e63e82aa32
name: Returns the scan's requested screenshot.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/screenshots/{{scan_id}}.png"
  method: GET
  headers:
    Accept: image/png
  queryParams:
    - key: resolution
      value: desktop
      disabled: true
      description: Target device type.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/png
  body:
    type: text
    content: string
order: 1000
