$kind: http-example
id: 43aaec1b-5fa8-5f91-b47d-e7e1202fe090
name: Scan request accepted successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/scan"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "url": "https://www.example.com",
        "agentReadiness": true,
        "country": "TH",
        "customHeaders": {
          "key_0": "string"
        },
        "customagent": "string",
        "referer": "string",
        "screenshotsResolutions": [
          "desktop"
        ],
        "visibility": "Public"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Submission successful",
        "uuid": "eaadf546-45e0-12bd-17c1-dc02a4f55a3f",
        "result": "string",
        "api": "string",
        "visibility": "public",
        "url": "string",
        "options": {
          "useragent": "string"
        }
      }
order: 1000
