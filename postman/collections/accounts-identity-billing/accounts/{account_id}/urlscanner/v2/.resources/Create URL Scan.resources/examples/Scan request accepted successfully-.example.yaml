$kind: http-example
id: 6eb2f693-0ae8-5138-9f69-f7669ba0aeee
name: Scan request accepted successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/scan"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "url": "https://www.example.com",
        "agentReadiness": true,
        "country": "MW",
        "customHeaders": {
          "key_0": "string",
          "key_1": "string",
          "key_2": "string"
        },
        "customagent": "string",
        "referer": "string",
        "screenshotsResolutions": [
          "desktop"
        ],
        "visibility": "Public"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Submission successful",
        "uuid": "2845eaad-4604-5e0c-2bdf-7c13dc02a4f5",
        "result": "string",
        "api": "string",
        "visibility": "public",
        "url": "string",
        "options": {
          "useragent": "string"
        }
      }
order: 1000
