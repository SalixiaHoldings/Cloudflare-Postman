$kind: http-example
id: a116ec6d-759b-51b1-aaca-6b752f1058f4
name: Scan request accepted successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/scan"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "url": "https://www.example.com",
        "agentReadiness": true,
        "country": "NR",
        "customHeaders": {
          "key_0": "string"
        },
        "customagent": "string",
        "referer": "string",
        "screenshotsResolutions": [
          "desktop"
        ],
        "visibility": "Public"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Submission successful",
        "uuid": "f5460445-c12b-f17c-3dc0-a4f55a3f2c64",
        "result": "string",
        "api": "string",
        "visibility": "public",
        "url": "string",
        "options": {
          "useragent": "string"
        }
      }
order: 1000
