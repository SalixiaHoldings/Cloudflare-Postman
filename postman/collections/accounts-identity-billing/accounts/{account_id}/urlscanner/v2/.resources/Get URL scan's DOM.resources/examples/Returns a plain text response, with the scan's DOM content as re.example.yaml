$kind: http-example
id: ac884431-7aed-58a5-bc3d-e6b145c40522
name: Returns a plain text response, with the scan's DOM content as rendered by Chrome.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/dom/{{scan_id}}"
  method: GET
  headers:
    Accept: text/plain
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 1000
