$kind: http-example
id: 74c43b0c-3113-57a4-a17f-99b0b304a7d5
name: Returns a plain text response, with the scan's DOM content as rendered by Chrome.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/dom/{{scan_id}}"
  method: GET
  headers:
    Accept: text/plain
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 1000
