$kind: http-example
id: b2375f85-4c88-51aa-b657-f9bfed4f5865
name: Returns a plain text response, with the scan's DOM content as rendered by Chrome.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/dom/{{scan_id}}"
  method: GET
  headers:
    Accept: text/plain
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 1000
