$kind: http-example
id: d41c6fe8-0550-5593-8ef1-a1bb4cabbd4a
name: Get the raw response by its hash.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/responses/{{response_id}}"
  method: GET
  headers:
    Accept: text/plain
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 1000
