$kind: http-example
id: d0f7ef00-05ef-5290-ab4f-cf9ac57b8b42
name: Get the raw response by its hash.
request:
  url: "{{base_url}}/accounts/{{account_id}}/urlscanner/v2/responses/{{response_id}}"
  method: GET
  headers:
    Accept: text/plain
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
order: 1000
