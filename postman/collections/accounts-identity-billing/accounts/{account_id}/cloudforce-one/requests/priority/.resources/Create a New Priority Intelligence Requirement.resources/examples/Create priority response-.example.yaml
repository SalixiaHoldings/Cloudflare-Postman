name: Create priority response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/requests/priority/new"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "labels": [
          "DoS",
          "CVE"
        ],
        "priority": 1,
        "requirement": "DoS attacks carried out by CVEs",
        "tlp": "amber"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
