$kind: http-example
id: cd6ca7ec-dec8-5d3e-bcad-f3d6e0d7cea9
name: Delete request message response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/requests/{{request_id}}/message/{{message_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [],
        "messages": []
      }
order: 1000
