$kind: http-example
id: 39079b1e-06d4-57cb-b889-66ca4e00e6af
name: Returns success if operation succeeded.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/event_tag/{{event_id}}"
  method: DELETE
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "tags": [
          "malware",
          "malware"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "success": true
        }
      }
order: 1000
