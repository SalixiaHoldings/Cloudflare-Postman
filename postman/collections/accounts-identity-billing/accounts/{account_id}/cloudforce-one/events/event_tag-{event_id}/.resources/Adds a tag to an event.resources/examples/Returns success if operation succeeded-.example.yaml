$kind: http-example
id: 9f16d6f7-c296-507a-8639-4b6a5603575e
name: Returns success if operation succeeded.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/event_tag/{{event_id}}/create"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "tags": [
          "botnet",
          "botnet"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "success": true
        }
      }
order: 1000
