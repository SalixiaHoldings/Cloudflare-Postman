$kind: http-example
id: 08cdf476-9223-521b-8db0-b441ee20bfaf
name: Returns aggregated event data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/aggregate?aggregateBy=string&datasetId=string&datasetId=string&startDate=string&endDate=string&groupByDate=false&limit=100"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: aggregateBy
      value: string
      description: (Required) Column(s) to aggregate by - single column or comma-separated list (e.g., 'attacker', 'targetIndustry', 'attacker,targetIndustry')
    - key: datasetId
      value: string
      description: "Dataset UUIDs to filter by, or one standalone scope value: 'all'/'*' for all accessible non-analytics event datasets (analytics datasets are silently excluded), 'analytics' for isAnalytics=true datasets, or 'operational' for isAnalytics=false datasets. If not provided, uses the default dataset."
    - key: datasetId
      value: string
      description: "Dataset UUIDs to filter by, or one standalone scope value: 'all'/'*' for all accessible non-analytics event datasets (analytics datasets are silently excluded), 'analytics' for isAnalytics=true datasets, or 'operational' for isAnalytics=false datasets. If not provided, uses the default dataset."
    - key: startDate
      value: string
      description: Start date for filtering (ISO 8601 format, e.g., '2024-01-01')
    - key: endDate
      value: string
      description: End date for filtering (ISO 8601 format, e.g., '2024-12-31')
    - key: groupByDate
      value: "false"
      description: Whether to group results by date (daily aggregation)
    - key: limit
      value: "100"
      description: Maximum number of results to return
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "aggregations": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "total": 9949.421216733754,
        "aggregateBy": "string",
        "dateRange": {
          "endDate": "string",
          "startDate": "string"
        }
      }
order: 1000
