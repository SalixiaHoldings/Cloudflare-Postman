$kind: http-example
id: d69ee5a2-9bf7-5cca-bf2a-9d785a99064e
name: Returns the raw event data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/raw/{{dataset_id}}/{{event_id}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "accountId": 1234,
        "created": "1970-01-01T00:00:00Z",
        "data": "{\"foo\": \"bar\"}",
        "source": "https://example.com",
        "tlp": "amber"
      }
order: 1000
