$kind: http-example
id: 9986847c-f33b-5fed-9653-7392256953a2
name: Returns whether the relationship was deleted.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/tags/{{tag_uuid}}/relationships/{{rel_uuid}}?datasetId=string"
  method: DELETE
  headers:
    Accept: application/json
  queryParams:
    - key: datasetId
      value: string
      description: (Required) Dataset UUID containing the relationship.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "deleted": true
        },
        "success": true
      }
order: 1000
