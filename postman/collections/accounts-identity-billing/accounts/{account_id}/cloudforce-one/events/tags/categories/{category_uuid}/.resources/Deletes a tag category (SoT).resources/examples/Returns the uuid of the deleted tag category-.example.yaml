$kind: http-example
id: af3b6262-5e29-5522-b6ad-e09183a636e9
name: Returns the uuid of the deleted tag category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/tags/categories/{{category_uuid}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
