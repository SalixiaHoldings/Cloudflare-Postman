$kind: http-example
id: 37f91e05-79b5-5b5a-b9e3-1d187bc1e01e
name: Returns the uuid of the deleted tag category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/tag-categories/{{category_uuid}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
