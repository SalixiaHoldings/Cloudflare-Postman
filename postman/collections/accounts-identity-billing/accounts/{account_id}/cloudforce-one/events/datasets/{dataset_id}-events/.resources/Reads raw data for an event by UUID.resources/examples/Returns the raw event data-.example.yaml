$kind: http-example
id: 1307cc87-3f11-52c4-b05e-ede8b45d7762
name: Returns the raw event data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/datasets/{{dataset_id}}/events/{{event_id}}/raw"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "accountId": 1234,
        "created": "1970-01-01T00:00:00Z",
        "data": "{\"foo\": \"bar\"}",
        "source": "https://example.com",
        "tlp": "amber"
      }
order: 1000
