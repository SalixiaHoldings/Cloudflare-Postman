$kind: http-example
id: 2abe2772-c45a-56d7-97c4-c03954c23a4b
name: Returns the updated event query.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/queries/{{query_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "alert_enabled": false,
        "alert_rollup_enabled": true,
        "name": "string",
        "query_json": "string",
        "rule_enabled": false,
        "rule_scope": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 8609,
        "account_id": "{{account_id}}",
        "name": "string",
        "user_email": "string",
        "query_json": "string",
        "alert_enabled": true,
        "alert_rollup_enabled": false,
        "rule_enabled": false,
        "created_at": "string",
        "updated_at": "string",
        "custom_threat_feed_id": 2212,
        "rule_list_id": "string",
        "rule_scope": "string"
      }
order: 1000
