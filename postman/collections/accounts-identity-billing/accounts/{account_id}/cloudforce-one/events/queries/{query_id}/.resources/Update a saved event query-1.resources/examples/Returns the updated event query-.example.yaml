$kind: http-example
id: 29468c4b-7a84-5146-bd0f-8106b89a285b
name: Returns the updated event query.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/queries/{{query_id}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "alert_enabled": false,
        "alert_rollup_enabled": false,
        "name": "string",
        "query_json": "string",
        "rule_enabled": false,
        "rule_scope": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 299,
        "account_id": "{{account_id}}",
        "name": "string",
        "user_email": "string",
        "query_json": "string",
        "alert_enabled": false,
        "alert_rollup_enabled": false,
        "rule_enabled": true,
        "created_at": "string",
        "updated_at": "string",
        "custom_threat_feed_id": 1494,
        "rule_list_id": "string",
        "rule_scope": "string"
      }
order: 1000
