$kind: http-example
id: e2c364f1-14c0-5c6b-950b-78b47a0f52ce
name: Returns the updated event query.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/queries/{{query_id}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "alert_enabled": true,
        "alert_rollup_enabled": true,
        "name": "string",
        "query_json": "string",
        "rule_enabled": false,
        "rule_scope": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1564,
        "account_id": "{{account_id}}",
        "name": "string",
        "user_email": "string",
        "query_json": "string",
        "alert_enabled": true,
        "alert_rollup_enabled": false,
        "rule_enabled": true,
        "created_at": "string",
        "updated_at": "string",
        "custom_threat_feed_id": 9004,
        "rule_list_id": "string",
        "rule_scope": "string"
      }
order: 1000
