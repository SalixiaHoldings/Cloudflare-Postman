$kind: http-example
id: f2088f43-f68d-50a8-8d28-59cf17696631
name: Returns a list of dataset in an account.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: includeDeleted
      value: "true"
      disabled: true
      description: "When true, include soft-deleted datasets in the response. Each item includes a `deletedAt` field (ISO 8601 or null). Default: false."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "uuid": "12345678-1234-1234-1234-1234567890ab",
          "name": "friendly dataset name",
          "isPublic": true,
          "isAnalytics": true,
          "indicatorWriteMode": "full",
          "deletedAt": "string"
        },
        {
          "uuid": "12345678-1234-1234-1234-1234567890ab",
          "name": "friendly dataset name",
          "isPublic": true,
          "isAnalytics": true,
          "indicatorWriteMode": "full",
          "deletedAt": "string"
        }
      ]
order: 1000
