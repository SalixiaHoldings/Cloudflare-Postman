$kind: http-example
id: c17d1a01-18ce-52e5-81ed-d6fd5b650511
name: Returns dataset information.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset/create"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "isPublic": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab",
        "name": "friendly dataset name",
        "isPublic": true,
        "isAnalytics": true
      }
order: 1000
