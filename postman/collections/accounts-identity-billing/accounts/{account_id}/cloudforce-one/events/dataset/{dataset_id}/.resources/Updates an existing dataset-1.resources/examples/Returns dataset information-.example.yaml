$kind: http-example
id: d11cf5ad-c6ad-52bf-b216-1bf821b9d7d1
name: Returns dataset information.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset/{{dataset_id}}"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "isPublic": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab",
        "name": "friendly dataset name",
        "isPublic": true,
        "isAnalytics": true
      }
order: 1000
