  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "targetType": "event",
        "targetId": "string",
        "type": "related-to",
        "confidence": 2,
        "metadata": {
          "key_0": true,
          "key_1": false
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {}
      }
