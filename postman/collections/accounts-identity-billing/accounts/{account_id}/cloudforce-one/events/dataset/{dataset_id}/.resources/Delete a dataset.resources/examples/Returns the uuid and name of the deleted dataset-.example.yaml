$kind: http-example
id: 22eb02da-18f1-5aa9-b2a8-919052bf61ba
name: Returns the uuid and name of the deleted dataset.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset/{{dataset_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab",
        "name": "friendly dataset name"
      }
order: 1000
