$kind: http-example
id: e20c844e-4a72-5c35-9e13-8b376a89ae44
name: Returns a dataset.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset/{{dataset_id}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab",
        "name": "friendly dataset name",
        "isPublic": true,
        "isAnalytics": true
      }
order: 1000
