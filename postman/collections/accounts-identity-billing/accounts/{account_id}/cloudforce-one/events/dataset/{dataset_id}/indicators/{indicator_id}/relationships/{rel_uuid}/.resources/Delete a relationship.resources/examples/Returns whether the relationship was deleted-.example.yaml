$kind: http-example
id: f0e0dccd-190e-54f4-b65f-1cd5a1f3d1d7
name: Returns whether the relationship was deleted.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/dataset/{{dataset_id}}/indicators/{{indicator_id}}/relationships/{{rel_uuid}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "deleted": true
        },
        "success": true
      }
order: 1000
