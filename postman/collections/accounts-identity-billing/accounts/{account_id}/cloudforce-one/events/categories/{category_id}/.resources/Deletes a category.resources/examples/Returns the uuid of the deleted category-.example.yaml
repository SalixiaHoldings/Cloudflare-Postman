$kind: http-example
id: afe1fc4a-de5a-5abe-80e2-b4a92823ca3a
name: Returns the uuid of the deleted category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/categories/{{category_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
