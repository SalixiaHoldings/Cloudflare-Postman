$kind: http-example
id: eddab7cf-4f8b-5dd2-a915-f6e0157580b1
name: Returns the uuid of the deleted category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/categories/{{category_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
