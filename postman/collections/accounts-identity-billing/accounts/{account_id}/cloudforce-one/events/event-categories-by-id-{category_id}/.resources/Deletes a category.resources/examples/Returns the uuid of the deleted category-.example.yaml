$kind: http-example
id: 6def4189-0915-5b51-936c-3a468c5f5d28
name: Returns the uuid of the deleted category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/event-categories/by-id/{{category_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
