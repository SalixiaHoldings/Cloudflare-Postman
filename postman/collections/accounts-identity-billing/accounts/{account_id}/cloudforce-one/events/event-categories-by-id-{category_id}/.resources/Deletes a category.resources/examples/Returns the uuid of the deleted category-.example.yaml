$kind: http-example
id: 81e1a7f8-7472-5e2d-8510-faeaea89f55c
name: Returns the uuid of the deleted category.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/event-categories/by-id/{{category_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "12345678-1234-1234-1234-1234567890ab"
      }
order: 1000
