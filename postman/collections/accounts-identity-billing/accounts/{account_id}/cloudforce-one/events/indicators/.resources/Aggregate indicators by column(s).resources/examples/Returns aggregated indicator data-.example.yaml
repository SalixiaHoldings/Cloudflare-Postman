$kind: http-example
id: 0a88721c-b3b8-5a14-8266-be7be523e7cf
name: Returns aggregated indicator data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/indicators/aggregate?aggregateBy=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: aggregateBy
      value: string
      description: (Required) Column(s) to aggregate by - single column or comma-separated list (e.g., 'indicatorType', 'value', 'indicatorType,value')
    - key: measure
      value: indicators
      disabled: true
      description: "What to count per group: 'indicators' (catalog rows, default) or 'relationships' (linked events per indicator). Use 'relationships' for 'top indicator by event activity'."
    - key: tagUuid
      value: string
      disabled: true
      description: Scope to indicators associated with this tag/actor UUID. Combine with measure=relationships for 'top indicator for an actor'.
    - key: datasetIds
      value: string
      disabled: true
      description: "Dataset UUIDs to filter by, or one standalone scope value: 'all'/'*' for all accessible datasets, 'analytics' for isAnalytics=true datasets, or 'operational' for isAnalytics=false datasets. If not provided, aggregates across all accessible datasets."
    - key: datasetIds
      value: string
      disabled: true
      description: "Dataset UUIDs to filter by, or one standalone scope value: 'all'/'*' for all accessible datasets, 'analytics' for isAnalytics=true datasets, or 'operational' for isAnalytics=false datasets. If not provided, aggregates across all accessible datasets."
    - key: createdAfter
      value: 1998-03-23T07:52:11.434Z
      disabled: true
      description: Filter indicators created after this date/datetime (ISO 8601, e.g., '2024-01-01' or '2024-01-01T00:00:00Z')
    - key: createdBefore
      value: 1998-03-23T07:52:11.434Z
      disabled: true
      description: Filter indicators created before this date/datetime (ISO 8601, e.g., '2024-12-31' or '2024-12-31T23:59:59Z')
    - key: eventDateAfter
      value: string
      disabled: true
      description: "For measure=relationships: only count indicator→event links whose relationship was created/observed on or after this date (ISO 8601). Bounds the activity view to recently-observed links. Note: this filters by the relationship's createdAt (link-observation time), not the underlying event's business date."
    - key: eventDateBefore
      value: string
      disabled: true
      description: "For measure=relationships: only count indicator→event links whose relationship was created/observed on or before this date (ISO 8601). Bounds the activity view by the relationship's createdAt (link-observation time), not the underlying event's business date."
    - key: limit
      value: "10"
      disabled: true
      description: Maximum number of aggregation results to return (1-100)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "aggregations": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "total": 9812.370245344937,
        "aggregateBy": "string",
        "failedDatasets": 1900.456768926233
      }
order: 1000
