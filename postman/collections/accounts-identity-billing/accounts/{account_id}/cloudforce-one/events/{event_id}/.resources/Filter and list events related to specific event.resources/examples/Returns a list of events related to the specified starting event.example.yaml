$kind: http-example
id: 7cd47e09-56cf-5a59-a538-4f6929edca73
name: Returns a list of events related to the specified starting event.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/{{event_id}}/relationships?datasetId=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: direction
      value: both
      disabled: true
      description: The direction to traverse the graph. Defaults to 'both' to search all.
    - key: maxDepth
      value: "3774.005202576518"
      disabled: true
      description: The maximum depth to traverse. Defaults to 5.
    - key: relationshipTypes
      value: string
      disabled: true
      description: An optional array of relationship types to filter by.
    - key: indicatorTypeIds
      value: string
      disabled: true
      description: An optional array of indicator type IDs to filter the results by.
    - key: indicatorTypeIds
      value: string
      disabled: true
      description: An optional array of indicator type IDs to filter the results by.
    - key: datasetId
      value: string
      description: (Required) The dataset ID to search within.
    - key: includeParent
      value: "true"
      disabled: true
      description: Whether to include the starting event in the results. Defaults to true.
    - key: page
      value: "3075.6446719169617"
      disabled: true
    - key: pageSize
      value: "3075.6446719169617"
      disabled: true
