id: cdaed24e-b090-5ccf-b002-decd86333770
name: Returns the raw event.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/{{event_id}}/raw/{{raw_id}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accountId": 1234,
        "created": "1970-01-01T00:00:00Z",
        "data": {},
        "id": "1234",
        "source": "https://example.com",
        "tlp": "amber"
      }
order: 1000
