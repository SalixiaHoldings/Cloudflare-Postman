$kind: http-example
id: 155323be-879b-52d3-8ea0-aed960f9fbed
name: Returns the uuid of the updated raw event and its data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/events/{{event_id}}/raw/{{raw_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "data": {},
        "source": "example.com",
        "tlp": "amber"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "1234",
        "data": {}
      }
order: 1000
