$kind: http-example
id: d8d1a9c0-1fb6-593c-89c8-ef49644e6a58
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/collections"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: string
        description: (Required) Collection name (alphanumeric with underscores)
      - type: file
        key: file
        src: ""
        description: (Required) File to upload (CSV, JSON, or JSONL)
      - type: text
        key: description
        value: string
        description: Optional description
      - type: text
        key: metadata
        value: string
        description: Optional custom metadata as JSON object (e.g., '{"key":"value"}')
      - type: text
        key: project_id
        value: string
        description: Optional project ID
      - type: text
        key: tags
        value: string
        description: Optional tags as JSON array (e.g., '["tag1","tag2"]')
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
