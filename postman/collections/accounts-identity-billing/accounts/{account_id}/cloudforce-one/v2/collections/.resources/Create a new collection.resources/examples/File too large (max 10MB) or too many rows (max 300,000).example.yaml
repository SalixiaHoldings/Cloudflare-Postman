$kind: http-example
id: 47619a7c-e708-54b1-ad55-9e2608bcba07
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/collections"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: name
        value: string
        description: (Required) Collection name (alphanumeric with underscores)
      - type: file
        key: file
        src: ""
        description: (Required) File to upload (CSV, JSON, or JSONL)
      - type: text
        key: description
        value: string
        description: Optional description
      - type: text
        key: metadata
        value: string
        description: Optional custom metadata as JSON object (e.g., '{"key":"value"}')
      - type: text
        key: project_id
        value: string
        description: Optional project ID
      - type: text
        key: tags
        value: string
        description: Optional tags as JSON array (e.g., '["tag1","tag2"]')
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 4000
