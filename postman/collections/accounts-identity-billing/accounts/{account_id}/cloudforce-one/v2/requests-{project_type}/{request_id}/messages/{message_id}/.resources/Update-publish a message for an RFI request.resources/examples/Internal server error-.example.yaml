$kind: http-example
id: dce8a6aa-8548-5702-827c-220c3349fa66
name: Internal server error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/requests/{{project_type}}/{{request_id}}/messages/{{message_id}}"
  method: PUT
  headers:
    - key: Idempotency-Key
      value: string
      description: Client command key. Required when publishing a message for a workflow-enabled project; trimmed and limited to 255 characters.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "content": "string",
        "publish": false,
        "tlp": "red",
        "attachment_asset_ids": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 5000
