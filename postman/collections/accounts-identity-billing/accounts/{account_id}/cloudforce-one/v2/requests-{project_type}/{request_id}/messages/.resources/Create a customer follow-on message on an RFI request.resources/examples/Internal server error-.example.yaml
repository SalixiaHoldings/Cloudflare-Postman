$kind: http-example
id: 00b8aee7-72e4-5c8f-aa50-b130128f0b2d
name: Internal server error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/v2/requests/{{project_type}}/{{request_id}}/messages/new"
  method: POST
  headers:
    - key: Idempotency-Key
      value: string
      description: Client command key. Required when publishing a message for a workflow-enabled project; trimmed and limited to 255 characters.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "content": "string",
        "attachment_asset_ids": [
          "string",
          "string"
        ],
        "author_id": "string",
        "author_name": "string",
        "publish": false,
        "tlp": "red"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 5000
