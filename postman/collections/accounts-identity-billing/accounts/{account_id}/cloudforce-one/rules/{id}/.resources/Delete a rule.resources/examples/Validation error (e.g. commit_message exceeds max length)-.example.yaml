$kind: http-example
id: 1a84f3ef-ecc8-50cc-9a56-e6392a856576
name: Validation error (e.g. commit_message exceeds max length).
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/{{id}}"
  method: DELETE
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "Rule superseded by yara/workers/tighter-panel.yar."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 3000
