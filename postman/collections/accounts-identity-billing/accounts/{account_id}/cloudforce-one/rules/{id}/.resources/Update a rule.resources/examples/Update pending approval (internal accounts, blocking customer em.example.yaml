$kind: http-example
id: 3a0c2079-f9a2-5254-b500-8f608d988f57
name: Update pending approval (internal accounts, blocking customer email rules, and customer email rules with compiler warnings).
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "Reduce false positives on legit CI workers.",
        "content": "rule example { condition: true }",
        "description": "Detects malicious proxy workers",
        "enabled": true,
        "is_public": false,
        "name": "block-malicious-workers",
        "namespaces": [
          "yara/workers"
        ],
        "path": "yara/workers"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval_id": 1,
        "message": "Rule creation pending approval"
      }
order: 2000
