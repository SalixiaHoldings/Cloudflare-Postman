$kind: http-example
id: a43723e0-1bf7-5b3c-ad34-0bc66ae2ac15
name: Unauthorized.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "Reduce false positives on legit CI workers.",
        "content": "rule example { condition: true }",
        "description": "Detects malicious proxy workers",
        "enabled": true,
        "is_public": false,
        "name": "block-malicious-workers",
        "namespaces": [
          "yara/workers"
        ],
        "path": "yara/workers"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 3000
