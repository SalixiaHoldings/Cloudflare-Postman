$kind: http-example
id: ace6d07a-bb46-56f3-8b33-fd7eab8c5e44
name: Another approval is already pending for this rule.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "Reduce false positives on legit CI workers.",
        "content": "rule example { condition: true }",
        "description": "Detects malicious proxy workers",
        "enabled": true,
        "is_public": false,
        "meta": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "name": "block-malicious-workers",
        "namespaces": [
          "yara/workers"
        ],
        "path": "yara/workers"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "An approval is already pending for this rule.",
        "code": "approval_pending",
        "approval_id": 12345
      }
order: 5000
