$kind: http-example
id: 59d463b3-bcfc-5fc3-a0ec-6f29f6a5df90
name: Rule not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "Reduce false positives on legit CI workers.",
        "content": "rule example { condition: true }",
        "description": "Detects malicious proxy workers",
        "enabled": true,
        "is_public": false,
        "name": "block-malicious-workers",
        "namespaces": [
          "yara/workers"
        ],
        "path": "yara/workers"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 4000
