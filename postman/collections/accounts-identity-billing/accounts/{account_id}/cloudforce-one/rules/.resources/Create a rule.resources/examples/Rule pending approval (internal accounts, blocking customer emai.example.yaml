$kind: http-example
id: bee39050-98f6-50d7-82d8-c20c294d16ba
name: Rule pending approval (internal accounts, blocking customer email rules, and customer email rules with compiler warnings).
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "block-malicious-workers",
        "path": "yara/workers",
        "content": "rule example { condition: true }",
        "commit_message": "Add worker rule to catch bpb-panel variants.",
        "description": "Detects malicious proxy workers",
        "enabled": true,
        "is_public": false
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval_id": 1,
        "message": "Rule creation pending approval"
      }
order: 2000
