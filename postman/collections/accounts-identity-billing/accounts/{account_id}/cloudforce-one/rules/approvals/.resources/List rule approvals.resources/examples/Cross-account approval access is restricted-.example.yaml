$kind: http-example
id: 3648cba7-a941-5bc9-8071-3bf7169ee7a3
name: Cross-account approval access is restricted.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: status
      value: pending
      disabled: true
      description: Selects approval statuses. Repeat the parameter to OR-match statuses (for example, status=pending&status=rejected). Use status=all alone to disable status filtering.
    - key: latest_only
      value: "true"
      disabled: true
      description: When true, returns the newest revision in each approval chain.
    - key: limit
      value: "50"
      disabled: true
    - key: offset
      value: "0"
      disabled: true
    - key: reviewer_scope
      value: email
      disabled: true
      description: Limits approvals to the specified reviewer scope.
    - key: change_type
      value: create
      disabled: true
      description: Limits approvals to the specified mutation type.
    - key: rule_id
      value: b1150853-829f-51cc-cae0-b0d4c705801b
      disabled: true
      description: Filter approvals by rule ID.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 3000
