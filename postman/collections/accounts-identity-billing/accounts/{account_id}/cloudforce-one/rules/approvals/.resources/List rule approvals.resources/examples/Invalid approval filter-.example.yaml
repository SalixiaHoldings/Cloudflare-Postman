$kind: http-example
id: 26a6f1f3-6189-52da-a9ab-668a99b2b855
name: Invalid approval filter.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: status
      value: pending
      disabled: true
      description: Selects approval statuses. Repeat the parameter to OR-match statuses (for example, status=pending&status=rejected). Use status=all alone to disable status filtering.
    - key: latest_only
      value: "true"
      disabled: true
      description: When true, returns the newest revision in each approval chain.
    - key: limit
      value: "50"
      disabled: true
    - key: offset
      value: "0"
      disabled: true
    - key: reviewer_scope
      value: email
      disabled: true
      description: Limits approvals to the specified reviewer scope.
    - key: change_type
      value: create
      disabled: true
      description: Limits approvals to the specified mutation type.
    - key: rule_id
      value: b1150853-829f-51cc-cae0-b0d4c705801b
      disabled: true
      description: Filter approvals by rule ID.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 2000
