$kind: http-example
id: 145602bd-53b2-5afd-923e-4eae01ec9492
name: Approval or underlying rule not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals/{{id}}/resubmit"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "string",
        "content": "st",
        "description": "string",
        "enabled": true,
        "name": "s",
        "namespaces": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 4000
