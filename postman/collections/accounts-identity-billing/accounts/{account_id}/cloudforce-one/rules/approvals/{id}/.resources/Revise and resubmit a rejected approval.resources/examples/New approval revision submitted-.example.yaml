$kind: http-example
id: df4835ff-7edd-5eb2-b4bf-48047d445f14
name: New approval revision submitted.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals/{{id}}/resubmit"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "string",
        "content": "st",
        "description": "string",
        "enabled": true,
        "name": "s",
        "namespaces": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "approval_id": 7368.384595029056,
        "supersedes_approval_id": 7665.582445915788,
        "revision_number": 6062,
        "requires_approval": true
      }
order: 1000
