$kind: http-example
id: dd3c665f-5995-552b-a237-bd1170fc6349
name: New approval revision submitted.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals/{{id}}/resubmit"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "string",
        "content": "string",
        "description": "string",
        "enabled": false,
        "name": "string",
        "namespaces": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "approval_id": 6412.441355641931,
        "supersedes_approval_id": 425.2788866870105,
        "revision_number": 9420,
        "requires_approval": true
      }
order: 1000
