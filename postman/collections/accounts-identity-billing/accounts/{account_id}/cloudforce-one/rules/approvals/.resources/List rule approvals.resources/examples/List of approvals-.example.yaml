name: List of approvals.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals?status=pending&latest_only=true&limit=50&offset=0&reviewer_scope=email&change_type=create&rule_id=9039000f-eeac-1561-8605-30576975bcd5"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: status
      value: pending
      description: Selects approval statuses. Repeat the parameter to OR-match statuses (for example, status=pending&status=rejected). Use status=all alone to disable status filtering.
    - key: latest_only
      value: "true"
      description: When true, returns the newest revision in each approval chain.
    - key: limit
      value: "50"
    - key: offset
      value: "0"
    - key: reviewer_scope
      value: email
      description: Limits approvals to the specified reviewer scope.
    - key: change_type
      value: create
      description: Limits approvals to the specified mutation type.
    - key: rule_id
      value: 9039000f-eeac-1561-8605-30576975bcd5
      description: Filter approvals by rule ID.
