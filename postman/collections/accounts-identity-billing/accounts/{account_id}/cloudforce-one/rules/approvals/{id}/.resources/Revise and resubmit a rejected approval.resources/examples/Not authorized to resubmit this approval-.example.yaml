$kind: http-example
id: 1cc40958-95c4-5b69-892e-da9a84f716b9
name: Not authorized to resubmit this approval.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/approvals/{{id}}/resubmit"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "commit_message": "string",
        "content": "string",
        "description": "string",
        "enabled": false,
        "name": "string",
        "namespaces": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 3000
