$kind: http-example
id: afe9db33-7439-5dbe-a9bb-d685040c0181
name: List of integrations.
request:
  url: "{{base_url}}/accounts/{{account_id}}/one/integrations"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: application
      value: string
      disabled: true
      description: Filter by application/vendor (e.g., GOOGLE_WORKSPACE, MICROSOFT_INTERNAL).
    - key: direction
      value: asc
      disabled: true
      description: Direction to order results.
    - key: dlp_enabled
      value: "true"
      disabled: true
      description: Filter by DLP enabled status (true/false).
    - key: order
      value: status
      disabled: true
      description: Field to order results by.
    - key: page
      value: "1209"
      disabled: true
      description: Page number within the paginated result set.
    - key: page_size
      value: "1209"
      disabled: true
      description: Number of results per page.
    - key: search
      value: string
      disabled: true
      description: Search integrations by name or application.
    - key: status
      value: Initializing
      disabled: true
      description: Filter by integration status.
    - key: use_cases
      value: string
      disabled: true
      description: Filter by enabled use cases (e.g., casb, ces). Matches integrations enrolled in any of the specified values. Can be specified multiple times.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": [
          {
            "application": {
              "category": "Productivity",
              "display_name": "Google Workspace",
              "logo": "https://dash.cloudflare.com/v2/static/google_workspace.png"
            },
            "created": "2025-01-15T10:00:00Z",
            "id": "019d2e6a-d995-7185-afbd-4feead9e42ec",
            "is_paused": false,
            "name": "My Google Workspace",
            "status": "Healthy",
            "updated": "2025-04-10T08:30:00Z"
          }
        ],
        "result_info": {
          "count": 1,
          "next": null,
          "page": 1,
          "per_page": 10,
          "previous": null,
          "total_count": 1
        },
        "success": true
      }
order: 1000
