request:
  url: "{{base_url}}/accounts/{{account_id}}/one/integrations?application=string&direction=desc&dlp_enabled=true&order=status&page=8161&page_size=8161&search=string&status=Unhealthy&use_cases=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: application
      value: string
      description: Filter by application/vendor (e.g., GOOGLE_WORKSPACE, MICROSOFT_INTERNAL).
