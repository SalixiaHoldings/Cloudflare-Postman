      value: desc
      description: Direction to order results.
    - key: dlp_enabled
      value: "true"
      description: Filter by DLP enabled status (true/false).
    - key: order
      value: status
      description: Field to order results by.
    - key: page
      value: "8161"
      description: Page number within the paginated result set.
    - key: page_size
      value: "8161"
      description: Number of results per page.
    - key: search
      value: string
      description: Search integrations by name or application.
    - key: status
      value: Unhealthy
      description: Filter by integration status.
    - key: use_cases
      value: string
      description: Filter by enabled use cases (e.g., casb, ces). Matches integrations enrolled in any of the specified values. Can be specified multiple times.
