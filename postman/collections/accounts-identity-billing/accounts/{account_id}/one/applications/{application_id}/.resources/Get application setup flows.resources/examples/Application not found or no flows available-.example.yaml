$kind: http-example
id: 999d6a54-7a56-54d3-ac68-1003ce8cba19
name: Application not found or no flows available.
request:
  url: "{{base_url}}/accounts/{{account_id}}/one/applications/{{application_id}}/setup-flows"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: auth_method
      value: string
      disabled: true
      description: Filter by auth method id. Get available ids from GET /v2/applications.
    - key: environment
      value: fedramp
      disabled: true
      description: Filter by environment.
    - key: page
      value: "1209"
      disabled: true
      description: A page number within the paginated result set.
    - key: page_size
      value: "1209"
      disabled: true
      description: Number of results to return per page.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
