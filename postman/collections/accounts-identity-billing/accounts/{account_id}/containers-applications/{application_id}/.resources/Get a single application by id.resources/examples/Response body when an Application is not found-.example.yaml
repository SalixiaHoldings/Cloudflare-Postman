$kind: http-example
id: c72acf1c-64de-59c2-b5a5-5da0b22ad394
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 3000
