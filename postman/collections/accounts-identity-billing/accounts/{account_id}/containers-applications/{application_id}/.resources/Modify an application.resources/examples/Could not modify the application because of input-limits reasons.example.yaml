$kind: http-example
id: 9fbcf268-a879-5588-bb45-6faaa4275096
name: Could not modify the application because of input/limits reasons, more details in the error code.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "max_instances": 5917,
        "observability": {
          "description": "Top-level application observability settings. Scheduler-backed applications\nhot-reload these settings across existing instances. An existing Durable\nObject-managed application accepts only `logs.enabled` and publishes these settings\nto runtime metadata without creating deployments or rollouts.\n"
        },
        "rollout_active_grace_period": 0
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
