$kind: http-example
id: 036584d7-df87-5de1-90df-7915e2d75077
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "max_instances": 5917,
        "observability": {
          "description": "Top-level application observability settings. Scheduler-backed applications\nhot-reload these settings across existing instances. An existing Durable\nObject-managed application accepts only `logs.enabled` and publishes these settings\nto runtime metadata without creating deployments or rollouts.\n"
        },
        "rollout_active_grace_period": 0
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 5000
