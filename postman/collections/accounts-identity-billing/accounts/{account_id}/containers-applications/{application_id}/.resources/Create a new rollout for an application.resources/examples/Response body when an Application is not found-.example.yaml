$kind: http-example
id: da7abeb4-676a-526a-ad60-4daee8232ecf
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}/rollouts"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "target_configuration": {
          "instance_type": "lite"
        },
        "strategy": "rolling",
        "description": "string",
        "kind": "full_auto",
        "percentage": 97,
        "step_percentage": 10
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 5000
