$kind: http-example
id: 407aecdd-b6e6-5cd9-9851-2c6e5b05be85
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}/rollouts"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "target_configuration": {
          "instance_type": "lite"
        },
        "strategy": "new_instances",
        "description": "string",
        "kind": "full_auto",
        "percentage": 7,
        "step_percentage": 10
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 5000
