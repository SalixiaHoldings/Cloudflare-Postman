id: dd664094-e143-593f-b267-5361647c124b
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 3000
