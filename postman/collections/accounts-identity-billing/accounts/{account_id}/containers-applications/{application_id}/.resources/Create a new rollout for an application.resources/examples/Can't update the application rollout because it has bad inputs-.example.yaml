$kind: http-example
id: bd0f97f0-4bc0-5563-a261-2d571a5cb698
name: Can't update the application rollout because it has bad inputs.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}/rollouts"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "target_configuration": {
          "instance_type": "lite"
        },
        "strategy": "rolling",
        "description": "string",
        "kind": "full_auto",
        "percentage": 97,
        "step_percentage": 10
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
