name: Can't update the application rollout because it has bad inputs.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}/rollouts"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "target_configuration": {
          "instance_type": "lite"
        },
        "strategy": "new_instances",
        "description": "string",
        "kind": "full_auto",
        "percentage": 7,
        "step_percentage": 10
      }
