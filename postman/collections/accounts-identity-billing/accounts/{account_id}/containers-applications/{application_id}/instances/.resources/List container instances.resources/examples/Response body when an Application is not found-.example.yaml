$kind: http-example
id: e96e1dec-7137-5757-8621-b859bad83294
name: Response body when an Application is not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications/{{application_id}}/instances"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "50"
      disabled: true
      description: Maximum number of instances to return per page. Defaults to all.
    - key: page_token
      value: string
      disabled: true
      description: Opaque token from a previous response to retrieve the next page.
    - key: state
      value: active
      disabled: true
      description: |
        Filters instances by lifecycle state. `active` includes provisioning, running, and stopping instances; `not-active` includes stopped and failed instances. When omitted, all instances are returned.
    - key: name_prefix
      value: string
      disabled: true
      description: |
        Filter instances by a case-sensitive name prefix, falling back to the actor ID when no name is known. Keep the same prefix when using a page token.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 4000
