$kind: http-example
id: e4c00662-2dd8-5a5b-a97a-6f222d38f4fe
name: A newly created application.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "{{name}}",
        "scheduling_policy": "default",
        "instances": 0,
        "max_instances": 0,
        "configuration": {
          "image": "{{configuration__image}}"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
