name: Unauthorized.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "{{name}}",
        "scheduling_policy": "default",
        "instances": 0,
        "max_instances": 0,
        "configuration": {
          "image": "{{configuration__image}}"
        }
      }
