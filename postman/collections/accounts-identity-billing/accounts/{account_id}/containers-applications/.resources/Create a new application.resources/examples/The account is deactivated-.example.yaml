$kind: http-example
id: 3ada192a-8087-5970-bd8a-86a5e3609ceb
name: The account is deactivated.
request:
  url: "{{base_url}}/accounts/{{account_id}}/containers/applications"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "{{name}}",
        "scheduling_policy": "default",
        "instances": 0,
        "max_instances": 0,
        "configuration": {
          "image": "{{configuration__image}}"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 4000
