$kind: http-example
id: 98ba3f23-ae0c-5386-a054-0f021c797c4e
name: List account share resources response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/shares/{{share_id}}/resources?status=active&resource_type=<string>&page=2&per_page=20"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: status
      value: active
      description: Filter share resources by status.
    - key: resource_type
      value: <string>
      description: Filter share resources by resource_type.
    - key: page
      value: "2"
      description: |-
        Page number. Defaults to `1` when `per_page` is supplied without
        `page`. May be omitted entirely along with `per_page` to receive a
        non-paginated response.
    - key: per_page
      value: "20"
      description: |-
        Number of objects to return per page. Defaults to `20` when `page`
        is supplied without `per_page`. May be omitted entirely along with
        `page` to receive a non-paginated response.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
