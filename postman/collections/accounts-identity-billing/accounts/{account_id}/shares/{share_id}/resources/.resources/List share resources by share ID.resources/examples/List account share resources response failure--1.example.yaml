id: f1999d0b-dbbf-535c-867c-1bd182f22a2e
name: List account share resources response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/shares/{{share_id}}/resources"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: status
      value: active
      disabled: true
      description: Filter share resources by status.
    - key: resource_type
      value: <string>
      disabled: true
      description: Filter share resources by resource_type.
    - key: page
      value: "2"
      disabled: true
      description: |-
        Page number. Defaults to `1` when `per_page` is supplied without
        `page`. May be omitted entirely along with `per_page` to receive a
        non-paginated response.
    - key: per_page
      value: "20"
      disabled: true
      description: |-
        Number of objects to return per page. Defaults to `20` when `page`
        is supplied without `per_page`. May be omitted entirely along with
        `page` to receive a non-paginated response.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 3000
