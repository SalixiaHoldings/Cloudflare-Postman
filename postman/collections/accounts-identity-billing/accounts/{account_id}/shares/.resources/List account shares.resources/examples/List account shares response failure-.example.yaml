name: List account shares response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/shares"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: status
      value: deleted
      disabled: true
      description: Filter shares by status.
    - key: kind
      value: received
      disabled: true
      description: Filter shares by kind.
    - key: target_type
      value: account
      disabled: true
      description: Filter shares by target_type.
    - key: resource_types
      value: trust-grant
      disabled: true
      description: Filter share resources by resource_types.
    - key: resource_types
      value: gateway-extended-email-matching
      disabled: true
      description: Filter share resources by resource_types.
    - key: order
      value: created
      disabled: true
      description: Order shares by values in the given field.
    - key: direction
      value: asc
      disabled: true
      description: Direction to sort objects.
    - key: page
      value: "2"
      disabled: true
      description: |-
        Page number. Defaults to `1` when `per_page` is supplied without
        `page`. May be omitted entirely along with `per_page` to receive a
        non-paginated response.
    - key: per_page
      value: "20"
      disabled: true
      description: |-
        Number of objects to return per page. Defaults to `20` when `page`
        is supplied without `per_page`. May be omitted entirely along with
        `page` to receive a non-paginated response.
    - key: include_resources
      value: "true"
      disabled: true
      description: Include resources in the response.
    - key: include_recipient_counts
      value: "true"
      disabled: true
      description: Include recipient counts in the response.
    - key: tag
      value: env=production
      disabled: true
      description: Filter shares by tag. Each value is either `key=value` (matches shares whose tags contain that key/value pair) or `key` alone (matches shares that have any value for that key). May be repeated; multiple `tag` parameters are ANDed together. Maximum 20 `tag` parameters per request.
    - key: tag
      value: env=production
      disabled: true
      description: Filter shares by tag. Each value is either `key=value` (matches shares whose tags contain that key/value pair) or `key` alone (matches shares that have any value for that key). May be repeated; multiple `tag` parameters are ANDed together. Maximum 20 `tag` parameters per request.
