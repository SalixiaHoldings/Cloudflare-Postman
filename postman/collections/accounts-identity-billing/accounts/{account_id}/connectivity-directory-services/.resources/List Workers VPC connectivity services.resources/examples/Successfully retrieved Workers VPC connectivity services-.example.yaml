$kind: http-example
id: d44ba7c3-0bb8-5f55-b35b-4b7852f69962
name: Successfully retrieved Workers VPC connectivity services.
request:
  url: "{{base_url}}/accounts/{{account_id}}/connectivity/directory/services?type=tcp&page=1&per_page=1000"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: type
      value: tcp
    - key: page
      value: "1"
      description: Current page in the response
    - key: per_page
      value: "1000"
      description: Max amount of entries returned per page
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
