$kind: http-example
id: 7d201b63-e1fb-5273-aa7f-90ed8b9c2c72
name: Successfully updated Workers VPC connectivity service.
request:
  url: "{{base_url}}/accounts/{{account_id}}/connectivity/directory/services/{{service_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "host": {
          "ipv4": "10.0.0.1",
          "network": {
            "tunnel_id": "0191dce4-9ab4-7fce-b660-8e5dec5172da"
          }
        },
        "name": "postgres-db",
        "tcp_port": 5432,
        "type": "tcp"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
