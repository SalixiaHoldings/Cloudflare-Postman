id: 0834da24-0081-5cf8-8efc-c589b79b7638
name: Internal server error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/dls/regions?cursor=string&per_page=25&type=custom"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      description: Opaque token for cursor-based pagination. Omit for the first page. Pass the value from a previous response to fetch the next page.
    - key: per_page
      value: "25"
    - key: type
      value: custom
      description: Filter regions by type. Omit to return all regions.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
