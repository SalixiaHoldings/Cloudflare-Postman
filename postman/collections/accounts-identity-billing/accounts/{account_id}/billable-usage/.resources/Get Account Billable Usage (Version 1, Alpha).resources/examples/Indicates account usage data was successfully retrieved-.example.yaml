$kind: http-example
id: 30aec3c0-3e4d-534c-8e27-f8bef01d2f1b
name: Indicates account usage data was successfully retrieved.
request:
  url: "{{base_url}}/accounts/{{account_id}}/billable-usage?from=2025-05-01&to=2025-05-31"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: from
      value: 2025-05-01
      description: Start date for the usage query (ISO 8601). The provided time range must include the subscription billing cycle anchor day, otherwise no usage data is returned. Use the info endpoint to retrieve the subscription anchor day.
    - key: to
      value: 2025-05-31
      description: End date for the usage query (ISO 8601).
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
