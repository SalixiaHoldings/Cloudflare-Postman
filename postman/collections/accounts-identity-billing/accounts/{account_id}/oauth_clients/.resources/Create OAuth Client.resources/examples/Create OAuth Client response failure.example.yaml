$kind: http-example
id: d6eab998-1d66-5736-b27d-0823a6d99463
request:
  url: "{{base_url}}/accounts/{{account_id}}/oauth_clients"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "client_name": "My OAuth App",
        "grant_types": [
          "authorization_code",
          "refresh_token"
        ],
        "redirect_uris": [
          "https://example.com/callback"
        ],
        "response_types": [
          "code"
        ],
        "scopes": [
          "account.read"
        ],
        "token_endpoint_auth_method": "client_secret_post"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
