$kind: http-example
id: 55ae71be-c285-50f7-9961-81b98cf571e4
request:
  url: "{{base_url}}/accounts/{{account_id}}/oauth_clients"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "client_name": "My OAuth App",
        "grant_types": [
          "authorization_code",
          "refresh_token"
        ],
        "redirect_uris": [
          "https://example.com/callback"
        ],
        "response_types": [
          "code"
        ],
        "scopes": [
          "account.read"
        ],
        "token_endpoint_auth_method": "client_secret_post"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
