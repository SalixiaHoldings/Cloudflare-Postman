$kind: http-example
id: 8785bddc-7660-5811-ad78-37a78a852171
name: "Unauthorized: Authentication required"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/webhooks/evaluate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "destination_url": "https://example.com/webhook",
        "authentication_type": "Bearer Auth",
        "headers": [
          {
            "key": "Authorization",
            "value": "Bearer token123"
          },
          {
            "key": "X-Custom-Header",
            "value": "value"
          }
        ],
        "signing_secret": "{{signing_secret}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 3000
