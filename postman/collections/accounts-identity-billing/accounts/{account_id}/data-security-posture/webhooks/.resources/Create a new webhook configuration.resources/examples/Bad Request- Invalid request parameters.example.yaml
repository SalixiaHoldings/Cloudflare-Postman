$kind: http-example
id: 2cf1fc29-c0f2-5e58-a99c-392a49e52d26
name: "Bad Request: Invalid request parameters"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/webhooks"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "label": "Send to Slack",
        "destination_url": "https://example.com/webhook",
        "authentication_type": "Bearer Auth",
        "headers": [
          {
            "key": "Authorization",
            "value": "Bearer token123"
          },
          {
            "key": "X-Custom-Header",
            "value": "value"
          }
        ],
        "signing_secret": "{{signing_secret}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 2000
