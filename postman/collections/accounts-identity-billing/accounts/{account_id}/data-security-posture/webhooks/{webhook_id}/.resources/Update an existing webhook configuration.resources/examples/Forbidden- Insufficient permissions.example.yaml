$kind: http-example
id: 347c9890-1f19-5f67-9e04-b2f6d998eb53
name: "Forbidden: Insufficient permissions"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/webhooks/{{webhook_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "label": "Send to Slack",
        "destination_url": "https://example.com/webhook",
        "authentication_type": "Bearer Auth",
        "status": "enabled",
        "headers": [
          {
            "key": "Authorization",
            "value": "Bearer token123"
          },
          {
            "key": "X-Custom-Header",
            "value": "value"
          }
        ],
        "signing_secret": "{{signing_secret}}"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 4000
