name: "Conflict: webhook is associated with one or more policies and cannot be deleted"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/webhooks/{{webhook_id}}"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 3000
