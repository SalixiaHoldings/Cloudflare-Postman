$kind: http-example
id: 75c4165e-1404-5aa4-9431-743b0de1f862
name: "Not Found: Webhook not found"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/webhooks/{{webhook_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "label": "Send to Slack",
        "destination_url": "https://example.com/webhook",
        "authentication_type": "Bearer Auth",
        "status": "enabled",
        "headers": [
          {
            "key": "Authorization",
            "value": "Bearer token123"
          },
          {
            "key": "X-Custom-Header",
            "value": "value"
          }
        ],
        "signing_secret": "{{signing_secret}}"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 5000
