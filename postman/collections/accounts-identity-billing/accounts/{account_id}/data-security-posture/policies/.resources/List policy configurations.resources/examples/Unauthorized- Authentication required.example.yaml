name: "Unauthorized: Authentication required"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/policies?cursor=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      description: Cursor for pagination. Obtained from the `result_info.cursor` field of a previous response.
