$kind: http-example
id: b5812818-adae-5219-bbd8-3ef334f29715
name: "Bad Request: Invalid parameters"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/findings?cursor=string&direction=desc&ignored=true&integration_id=8c0c0e25-bbd0-8390-eae7-333b0eaa1638&max_affliction_date=1984-09-29T01:09:30.463Z&min_affliction_date=1984-09-29T01:09:30.463Z&observation=Issue&order=latest_affliction_date&page=8161&per_page=8161&product=Saas&search=string&severity=Medium&type=Content&vendor=GOOGLE_WORKSPACE&finding_type_ids=d5fd33a8-f1a7-913c-1bf4-e247cc47a111"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      description: A cursor for pagination. Obtained from the `result_info.cursor` field of a previous response.
    - key: direction
      value: desc
      description: Direction to order results.
    - key: ignored
      value: "true"
      description: Filter for only the ignored findings. Set to false to only see "active" items
    - key: integration_id
      value: 8c0c0e25-bbd0-8390-eae7-333b0eaa1638
      description: Filter by an integration ID
    - key: max_affliction_date
      value: 1984-09-29T01:09:30.463Z
      description: Filter to view findings that occurred on or before the affliction date. Can be a date-time in ISO 8601 format or an epoch timestamp.
    - key: min_affliction_date
      value: 1984-09-29T01:09:30.463Z
      description: Filter to view findings that occurred on or after the affliction date. Can be a date-time in ISO 8601 format or an epoch timestamp.
    - key: observation
      value: Issue
      description: Filter by observation type of the finding
    - key: order
      value: latest_affliction_date
      description: Which field to use when ordering the findings.
    - key: page
      value: "8161"
      description: A page number within the paginated result set.
    - key: per_page
      value: "8161"
      description: Number of results to return per page.
    - key: product
      value: Saas
      description: Filter by product category of the finding
    - key: search
      value: string
      description: A search term.
    - key: severity
      value: Medium
      description: Filter by severity
    - key: type
      value: Content
      description: Filter by type of the finding
    - key: vendor
      value: GOOGLE_WORKSPACE
      description: Filter by vendor
    - key: finding_type_ids
      value: d5fd33a8-f1a7-913c-1bf4-e247cc47a111
      description: A comma separated list of UUIDs identifying the finding type(s).
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 2000
