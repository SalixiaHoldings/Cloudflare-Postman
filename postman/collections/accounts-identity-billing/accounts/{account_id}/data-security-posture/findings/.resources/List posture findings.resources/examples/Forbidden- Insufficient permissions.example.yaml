$kind: http-example
id: 734eaf9f-de42-5ef1-91f9-b4393244f7e6
name: "Forbidden: Insufficient permissions"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/findings"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      disabled: true
      description: A cursor for pagination. Obtained from the `result_info.cursor` field of a previous response.
    - key: direction
      value: asc
      disabled: true
      description: Direction to order results.
    - key: ignored
      value: "true"
      disabled: true
      description: Filter for only the ignored findings. Set to false to only see "active" items
    - key: integration_id
      value: 9148c88f-959b-0c2d-477c-c0fbfd5c1978
      disabled: true
      description: Filter by an integration ID
    - key: max_affliction_date
      value: 1989-10-06T19:18:56.385Z
      disabled: true
      description: Filter to view findings that occurred on or before the affliction date. Can be a date-time in ISO 8601 format or an epoch timestamp.
    - key: min_affliction_date
      value: 1989-10-06T19:18:56.385Z
      disabled: true
      description: Filter to view findings that occurred on or after the affliction date. Can be a date-time in ISO 8601 format or an epoch timestamp.
    - key: observation
      value: Issue
      disabled: true
      description: Filter by observation type of the finding
    - key: order
      value: instance_count
      disabled: true
      description: Which field to use when ordering the findings.
    - key: page
      value: "1209"
      disabled: true
      description: A page number within the paginated result set.
    - key: per_page
      value: "1209"
      disabled: true
      description: Number of results to return per page.
    - key: product
      value: Cloud
      disabled: true
      description: Filter by product category of the finding
    - key: search
      value: string
      disabled: true
      description: A search term.
    - key: severity
      value: Critical
      disabled: true
      description: Filter by severity
    - key: type
      value: Posture
      disabled: true
      description: Filter by type of the finding
    - key: vendor
      value: GOOGLE_WORKSPACE
      disabled: true
      description: Filter by vendor
    - key: finding_type_ids
      value: 3e3ed1ad-a884-8501-3fe5-0d219a87f31a
      disabled: true
      description: A comma separated list of UUIDs identifying the finding type(s).
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "messages": []
      }
order: 4000
