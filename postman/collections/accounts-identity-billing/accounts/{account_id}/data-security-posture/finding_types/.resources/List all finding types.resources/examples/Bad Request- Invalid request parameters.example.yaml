id: 81f2f29f-cc1a-54aa-a1e4-328384752fa6
name: "Bad Request: Invalid request parameters"
request:
  url: "{{base_url}}/accounts/{{account_id}}/data-security/posture/finding_types"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1209"
      disabled: true
      description: A page number within the paginated result set.
    - key: per_page
      value: "1209"
      disabled: true
      description: Number of results to return per page.
    - key: vendors
      value: GOOGLE_WORKSPACE,GOOGLE_WORKSPACE
      disabled: true
      description: Filter finding types by vendor. Supports multiple comma-separated values. Each value may be either the vendor enum (GOOGLE_WORKSPACE) or the friendly name returned by the read routes (Google Workspace).
    - key: search
      value: string
      disabled: true
      description: Filter finding types by name or ID (case-insensitive substring match).
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
