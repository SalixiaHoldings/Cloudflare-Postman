$kind: http-example
id: 9280e189-3f1b-5d47-a585-3afe30e8d15f
name: Browser Extension service availability could not be verified.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-extension/config/inventories"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: cursor
      value: string
      disabled: true
      description: Opaque cursor from a previous response to fetch the next page.
    - key: per_page
      value: "50"
      disabled: true
      description: Number of results per page (default 50, max 200).
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {},
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 5000
