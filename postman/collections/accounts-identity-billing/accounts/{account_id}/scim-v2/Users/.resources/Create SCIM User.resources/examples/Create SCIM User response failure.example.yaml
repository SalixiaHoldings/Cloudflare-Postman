$kind: http-example
id: ee4ea7cb-6f3a-56ef-ad50-a922ac4032eb
request:
  url: "{{base_url}}/accounts/{{account_id}}/scim/v2/Users"
  method: POST
  headers:
    Content-Type: application/scim+json
    Accept: application/scim+json
  body:
    type: json
    content: |-
      {
        "schemas": [
          "urn:ietf:params:scim:schemas:core:2.0:User"
        ],
        "userName": "user@example.com",
        "emails": [
          {
            "value": "user@example.com"
          },
          {
            "value": "user@example.com"
          }
        ],
        "active": true,
        "displayName": "Jane Smith",
        "externalId": "idp-user-abc123"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/scim+json
  body:
    type: json
    content: |-
      {
        "schemas": [
          "urn:ietf:params:scim:api:messages:2.0:Error"
        ],
        "status": "400",
        "detail": "Invalid SCIM request: userName is required",
        "scimType": "uniqueness"
      }
order: 2000
