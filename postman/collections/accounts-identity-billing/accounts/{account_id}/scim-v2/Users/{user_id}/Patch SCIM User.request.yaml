  GENERATED FILE — DO NOT EDIT.

  Upstream operation: scim-users-patch
  PATCH /accounts/{account_id}/scim/v2/Users/{user_id}

  Partially updates a SCIM User via PATCH operations (RFC 7644 Section 3.5.2). Supports updating `userName`, `name.givenName`, `name.familyName`, and `active`. Setting `active: false` deprovisions the user (removes them from the account). For IdP compatibility, `emails[type eq "work"].value` is also accepted as an alias for `userName`.


  Authentication support: bearer-only
  Auth declaration SHA-256: cbba9b337efd4dcbaf1248fcfab868d3a542bf11170ae3bcc3755c08bfaa1c27
  Upstream security (operation; OR alternatives, AND within each object): [{"api_token":[]}]
  Selected requirement: {"api_token":[]}
  Use the narrowly scoped api_token; legacy alternatives are not enabled.
url: "{{base_url}}/accounts/{{account_id}}/scim/v2/Users/{{user_id}}"
method: PATCH
headers:
  Content-Type: application/scim+json
  Accept: application/scim+json
body:
  type: json
  content: |-
    {
      "Operations": [
        {
          "op": "replace",
          "path": "active",
          "value": false
        }
      ],
      "schemas": [
        "urn:ietf:params:scim:api:messages:2.0:PatchOp"
      ]
    }
auth:
  type: bearer
  credentials:
