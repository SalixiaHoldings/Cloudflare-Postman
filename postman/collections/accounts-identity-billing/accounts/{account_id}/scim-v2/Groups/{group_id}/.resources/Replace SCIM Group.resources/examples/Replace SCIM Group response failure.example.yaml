$kind: http-example
id: c3a5d100-9cff-52a9-b041-9a7b6b6bfc4e
request:
  url: "{{base_url}}/accounts/{{account_id}}/scim/v2/Groups/{{group_id}}"
  method: PUT
  headers:
    Content-Type: application/scim+json
    Accept: application/scim+json
  body:
    type: json
    content: |-
      {
        "schemas": [
          "urn:ietf:params:scim:schemas:core:2.0:Group"
        ],
        "displayName": "My IdP Group",
        "externalId": "idp-group-456"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/scim+json
  body:
    type: json
    content: |-
      {
        "schemas": [
          "urn:ietf:params:scim:api:messages:2.0:Error"
        ],
        "status": "400",
        "detail": "Invalid SCIM request: userName is required",
        "scimType": "uniqueness"
      }
order: 2000
