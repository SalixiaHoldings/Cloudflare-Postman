$kind: http-example
id: 67af73e6-11a1-5384-b261-787a82f971f5
name: |
  Decompressed upload exceeds the maximum allowed size. The
  server caps the decompressed body at a configured limit
  (default 6 GiB) as a gzip-bomb defence; this response is
  returned before any feed state changes. Resubmit a smaller
  (or non-pathologically-compressed) body.
request:
  url: "{{base_url}}/accounts/{{account_id}}/intel/indicator-feeds/{{feed_id}}/snapshot"
  method: PUT
  headers:
    - key: Cf-Async-Upload
      value: "1"
      description: |
        Set to the literal value `1` to enqueue the upload and receive a
        `202` response with a polling URL. Any other value uses the legacy
        synchronous response.
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
    - key: X-Auth-Email
      value: "{{api_email}}"
    - key: X-Auth-Key
      value: "{{api_key}}"
  body:
    type: formdata
    content:
      - type: text
        key: source
        value: "@/Users/me/test.stix2.gz"
        description: |
          The file to upload. Either a plain STIX2/CRDF body
          or a gzipped one (recognised by `0x1f 0x8b` magic
          bytes or a `.gz` filename suffix).
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 3000
