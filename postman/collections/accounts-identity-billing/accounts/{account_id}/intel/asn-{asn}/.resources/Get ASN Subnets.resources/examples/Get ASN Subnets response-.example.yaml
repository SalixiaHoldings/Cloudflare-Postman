$kind: http-example
id: 305b66f5-ebb3-5676-b050-24d854679aae
name: Get ASN Subnets response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/intel/asn/{{asn}}/subnets"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "asn": "<integer>",
        "count": 1,
        "ip_count_total": 2044,
        "page": 1,
        "per_page": 20,
        "subnets": [
          "192.0.2.0/24",
          "2001:DB8::/32"
        ]
      }
order: 1000
