$kind: http-example
id: 240b0df7-b133-55d6-a526-dac5686a415e
request:
  url: "{{base_url}}/accounts"
  method: POST
  headers:
    - key: Idempotency-Key
      value: string
      description: Optional key that identifies an Account-creation request. Free Account creation can require exactly one valid key, so API clients should send a key with every Account-creation request. Reuse the same key when retrying the same request.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-Auth-Email
      value: "{{api_email}}"
    - key: X-Auth-Key
      value: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
