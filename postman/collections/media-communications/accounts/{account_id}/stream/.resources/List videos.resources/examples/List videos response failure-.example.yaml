id: bf481f7e-9dfe-5c59-a6ef-ef6cada72bd4
name: List videos response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream?status=inprogress&creator=creator-id_abcde12345&type=live&asc=true&video_name=puppy.mp4&search=puppy.mp4&start=2014-01-02T02:20:00Z&end=2014-01-02T02:20:00Z&include_counts=true&id=ea95132c15732412d22c1476fa83f27a&name=string&live_input_id=string&before=1947-08-18T00:32:31.689Z&after=1947-08-18T00:32:31.689Z&limit=554"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: status
      value: inprogress
    - key: creator
      value: creator-id_abcde12345
    - key: type
      value: live
    - key: asc
      value: "true"
    - key: video_name
      value: puppy.mp4
    - key: search
      value: puppy.mp4
    - key: start
      value: 2014-01-02T02:20:00Z
    - key: end
      value: 2014-01-02T02:20:00Z
    - key: include_counts
      value: "true"
    - key: id
      value: ea95132c15732412d22c1476fa83f27a
      description: Filter by video ID(s). Can be a single ID or a comma-separated list of IDs.
    - key: name
      value: string
      description: Filter by video name/UID(s). Can be a single name or a comma-separated list.
    - key: live_input_id
      value: string
      description: Filter by live input ID to find videos associated with a specific live stream.
    - key: before
      value: 1947-08-18T00:32:31.689Z
      description: Alias for 'end'. Returns videos created before this date/time (RFC 3339 format).
    - key: after
      value: 1947-08-18T00:32:31.689Z
      description: Alias for 'start'. Returns videos created after this date/time (RFC 3339 format).
    - key: limit
      value: "554"
      description: Maximum number of videos to return (default 1000, max 1000).
