name: Initiate video uploads using TUS response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream"
  method: POST
  headers:
    - key: Tus-Resumable
      value: 1.0.0
      description: "(Required) "
    - key: Upload-Creator
      value: creator-id_abcde12345
