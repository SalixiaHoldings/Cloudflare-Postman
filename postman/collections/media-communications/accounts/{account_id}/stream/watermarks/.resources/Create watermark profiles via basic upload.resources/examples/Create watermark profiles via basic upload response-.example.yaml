$kind: http-example
id: 072513cb-1c17-501d-b964-1ef7758fd4a0
name: Create watermark profiles via basic upload response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/watermarks"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: formdata
    content:
      - type: text
        key: file
        value: "@/Users/rchen/Downloads/watermark.png"
        description: (Required) The image file to upload.
      - type: text
        key: name
        value: Marketing Videos
      - type: text
        key: opacity
        value: "0.75"
      - type: text
        key: padding
        value: "0.1"
      - type: text
        key: position
        value: center
      - type: text
        key: scale
        value: "0.1"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
