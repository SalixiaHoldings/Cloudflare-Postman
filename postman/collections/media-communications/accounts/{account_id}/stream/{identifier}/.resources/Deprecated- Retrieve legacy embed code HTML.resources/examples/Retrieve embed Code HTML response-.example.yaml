$kind: http-example
id: f9e03999-e6e0-5d36-bb3d-d11ed72a2e13
name: Retrieve embed Code HTML response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/embed"
  method: GET
  headers:
    Accept: text/html
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/html
  body:
    type: text
    content: <stream id="ea95132c15732412d22c1476fa83f27a"></stream><script data-cfasync="false" defer type="text/javascript" src="https://embed.cloudflarestream.com/embed/we4g.fla9.latest.js"></script>
order: 1000
