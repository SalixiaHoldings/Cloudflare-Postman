name: Generate captions or subtitles response for a provided language.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/captions/{{language}}/generate"
  method: POST
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
