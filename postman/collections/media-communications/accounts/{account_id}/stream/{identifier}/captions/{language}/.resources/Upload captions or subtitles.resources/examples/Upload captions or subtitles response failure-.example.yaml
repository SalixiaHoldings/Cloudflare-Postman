$kind: http-example
id: 7c8c3a7e-127f-5289-abbc-cb684abe7b65
name: Upload captions or subtitles response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/captions/{{language}}"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: formdata
    content:
      - type: text
        key: file
        value: "@/Users/kyle/Desktop/tr.vtt"
        description: (Required) The WebVTT file containing the caption or subtitle content.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
