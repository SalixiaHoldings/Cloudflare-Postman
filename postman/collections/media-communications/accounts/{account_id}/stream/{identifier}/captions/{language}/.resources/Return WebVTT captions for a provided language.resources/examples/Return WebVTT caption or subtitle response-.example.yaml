$kind: http-example
id: bb5c24ec-da8f-5994-8188-4e603a8ce16e
name: Return WebVTT caption or subtitle response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/captions/{{language}}/vtt"
  method: GET
  headers:
    Accept: text/vtt
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/vtt
  body:
    type: text
    content: |
      'WEBVTT
       00:00:00.000 --> 00:00:02.480
       This is example response'
order: 1000
