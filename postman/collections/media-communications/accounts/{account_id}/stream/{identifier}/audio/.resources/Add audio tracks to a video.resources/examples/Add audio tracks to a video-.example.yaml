name: Add audio tracks to a video.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/audio/copy"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "label": "director commentary",
        "url": "https://www.examplestorage.com/audio_file.mp3"
      }
