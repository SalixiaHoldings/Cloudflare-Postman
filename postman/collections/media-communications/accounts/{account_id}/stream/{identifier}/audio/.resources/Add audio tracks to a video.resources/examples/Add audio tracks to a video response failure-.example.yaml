$kind: http-example
id: 7fb456dd-c21d-5c33-9c9d-82f6e31c0056
name: Add audio tracks to a video response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/audio/copy"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "label": "director commentary",
        "url": "https://www.examplestorage.com/audio_file.mp3"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
