$kind: http-example
id: 7ec2974c-20ad-55da-a2ec-3001c218c7fc
name: Add audio tracks to a video response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/audio/copy"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "label": "director commentary",
        "url": "https://www.examplestorage.com/audio_file.mp3"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
