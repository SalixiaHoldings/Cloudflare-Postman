name: Deletes additional audio tracks on a video.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/audio/{{audio_identifier}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": "ok"
      }
order: 1000
