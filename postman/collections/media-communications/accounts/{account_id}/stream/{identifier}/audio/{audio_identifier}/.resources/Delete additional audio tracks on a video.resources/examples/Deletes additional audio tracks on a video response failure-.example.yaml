$kind: http-example
id: d65fb57f-3679-56d0-a127-15de8990d2f4
name: Deletes additional audio tracks on a video response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/{{identifier}}/audio/{{audio_identifier}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": "ok"
      }
order: 2000
