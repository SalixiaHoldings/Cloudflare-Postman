$kind: http-example
id: 46e74405-1d69-592e-8b0d-2e7df7d7d010
name: Create a new output, connected to a live input response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/live_inputs/{{live_input_identifier}}/outputs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "url": "rtmp://a.rtmp.youtube.com/live2",
        "streamKey": "uzya-f19y-g2g9-a2ee-51j2",
        "enabled": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
