name: Update a live input response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/stream/live_inputs/{{live_input_identifier}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "defaultCreator": "string",
        "deleteRecordingAfterDays": 45,
        "enabled": true,
        "meta": {
          "name": "test stream 1"
        },
        "preferLowLatency": true,
        "recording": {
          "hideLiveViewerCount": false,
          "mode": "off",
          "requireSignedURLs": false,
          "timeoutSeconds": 0
        }
      }
