$kind: http-example
id: d08e3a5c-c59b-5081-ab4a-09374684c8c6
name: Base image response. Returns uploaded image data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/images/v1/{{image_id}}/blob"
  method: GET
  headers:
    Accept: image/*
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/*
  body:
    type: text
    content: string
order: 1000
