$kind: http-example
id: d1bb02b8-a009-5571-ade0-6ed69348cda7
name: Base image response. Returns uploaded image data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/images/v1/{{image_id}}/blob"
  method: GET
  headers:
    Accept: image/*
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/*
  body:
    type: text
    content: string
order: 1000
