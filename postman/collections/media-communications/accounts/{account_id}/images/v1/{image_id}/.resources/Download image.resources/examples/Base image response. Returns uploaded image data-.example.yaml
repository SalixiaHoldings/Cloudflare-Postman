$kind: http-example
id: 6a3e818f-b456-59d6-b8a6-1b7ebc6cde3c
name: Base image response. Returns uploaded image data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/images/v1/{{image_id}}/blob"
  method: GET
  headers:
    Accept: image/*
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/*
  body:
    type: text
    content: string
order: 1000
