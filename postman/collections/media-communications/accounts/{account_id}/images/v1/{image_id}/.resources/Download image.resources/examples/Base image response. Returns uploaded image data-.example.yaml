$kind: http-example
id: 8dbff108-66ca-5061-936c-13e596b999de
name: Base image response. Returns uploaded image data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/images/v1/{{image_id}}/blob"
  method: GET
  headers:
    Accept: image/*
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/*
  body:
    type: text
    content: string
order: 1000
