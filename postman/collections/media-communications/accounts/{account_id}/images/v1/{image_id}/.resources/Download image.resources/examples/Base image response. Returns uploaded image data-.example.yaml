$kind: http-example
id: 2f180f84-bdfd-57a7-9b95-a06a4d27d132
name: Base image response. Returns uploaded image data.
request:
  url: "{{base_url}}/accounts/{{account_id}}/images/v1/{{image_id}}/blob"
  method: GET
  headers:
    Accept: image/*
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: image/*
  body:
    type: text
    content: string
order: 1000
