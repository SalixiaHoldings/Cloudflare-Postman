$kind: http-example
id: 21ca961b-ce9e-5257-a21e-5fc59a7418fb
name: Client error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/investigate/{{investigate_id}}"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: submission
      value: "true"
      disabled: true
      description: |-
        When true, search the submissions datastore only. When false or omitted, search the
        regular datastore only.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
