name: Client error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/investigate/bulk/{{job_id}}/messages?page=1&per_page=20&status=PENDING"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      description: The number of results per page. Maximum value is 1000.
    - key: status
      value: PENDING
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
