$kind: http-example
id: ed19baaa-3ef4-5d65-b823-f6d025217693
name: The search is taking longer than expected. Use the Location header to poll for results.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/investigate?start=2022-06-25T14:30:00Z&end=2022-07-25T14:30:00Z&query=bob jones&detections_only=true&final_disposition=NONE&metric=string&message_action=QUARANTINE_RELEASED&recipient=me@example.com&sender=noreply@example.com&smtp_helo_ip=192.0.2.1&alert_id=string&domain=example.com&message_id=string&subject=string&delivery_status=bounced&cursor=string&per_page=20&page=1"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: start
      value: 2022-06-25T14:30:00Z
      description: The beginning of the search date range. Defaults to `now - 30 days`. Must not be in the future.
    - key: end
      value: 2022-07-25T14:30:00Z
      description: The end of the search date range. Defaults to `now`.
    - key: query
      value: bob jones
      description: Space-delimited search term. Case-insensitive.
    - key: detections_only
      value: "true"
      description: Whether to include only detections in search results.
    - key: final_disposition
      value: NONE
      description: Dispositions to filter by.
    - key: metric
      value: string
    - key: message_action
      value: QUARANTINE_RELEASED
      description: Message actions to filter by.
    - key: recipient
      value: me@example.com
    - key: sender
      value: noreply@example.com
    - key: smtp_helo_ip
      value: 192.0.2.1
      description: Matches messages whose SMTP HELO server IP address equals this value.
    - key: alert_id
      value: string
    - key: domain
      value: example.com
      description: Sender domains to filter by.
    - key: message_id
      value: string
    - key: subject
      value: string
    - key: delivery_status
      value: bounced
      description: Delivery status to filter by.
    - key: cursor
      value: string
    - key: per_page
      value: "20"
      description: The number of results per page. Maximum value is 1000.
    - key: page
      value: "1"
      description: "Deprecated: Use cursor pagination instead. End of life: November 1, 2026."
response:
  statusCode: 202
  statusText: Accepted
  headers:
    - key: Location
      value: string
      description: URL to poll for search results.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": [],
        "result_info": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
