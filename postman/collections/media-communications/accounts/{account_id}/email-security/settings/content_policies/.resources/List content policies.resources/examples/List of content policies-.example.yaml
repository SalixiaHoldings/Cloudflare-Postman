$kind: http-example
id: 865993fd-6bd9-5102-991a-7eb7daeadd9e
name: List of content policies.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/content_policies"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      disabled: true
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      disabled: true
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: created_at
      disabled: true
      description: Field to sort by.
    - key: direction
      value: desc
      disabled: true
      description: The sorting direction.
    - key: enabled
      value: "true"
      disabled: true
      description: Filter by enabled status.
    - key: name
      value: string
      disabled: true
      description: Filter by exact policy name.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
