$kind: http-example
id: 3f9245f9-ff43-5299-9852-9cd19e79b5dc
name: List of content policies.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/content_policies?page=1&per_page=20&search=string&order=name&direction=asc&enabled=true&name=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: name
      description: Field to sort by.
    - key: direction
      value: asc
      description: The sorting direction.
    - key: enabled
      value: "true"
      description: Filter by enabled status.
    - key: name
      value: string
      description: Filter by exact policy name.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
