name: Created content policy.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/content_policies"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Block phishing keywords",
        "pattern": "urgent.*verify.*account",
        "targets": [
          "SUBJECT"
        ],
        "enabled": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
