$kind: http-example
id: 39698ffa-ba63-556a-b9dc-57ab6fa6ba7e
name: List of allow policies.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/allow_policies"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      disabled: true
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      disabled: true
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: pattern
      disabled: true
      description: Field to sort by.
    - key: direction
      value: desc
      disabled: true
      description: The sorting direction.
    - key: is_exempt_recipient
      value: "true"
      disabled: true
      description: Filter to show only policies where messages to the recipient bypass all detections.
    - key: is_trusted_sender
      value: "true"
      disabled: true
      description: Filter to show only policies where messages from the sender bypass all detections and link following.
    - key: is_acceptable_sender
      value: "true"
      disabled: true
      description: Filter to show only policies where messages from the sender are exempted from Spam, Spoof, and Bulk dispositions (not Malicious or Suspicious).
    - key: verify_sender
      value: "true"
      disabled: true
      description: Filter to show only policies that enforce DMARC, SPF, or DKIM authentication.
    - key: pattern_type
      value: EMAIL
      disabled: true
    - key: pattern
      value: string
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
