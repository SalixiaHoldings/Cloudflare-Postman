id: 880305e5-3338-5f0c-994d-28404161a8aa
name: Replaced allow policy.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/allow_policies/{{policy_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "is_exempt_recipient": false,
        "is_trusted_sender": true,
        "is_acceptable_sender": false,
        "pattern": "test@example.com",
        "is_regex": false,
        "verify_sender": true,
        "pattern_type": "EMAIL"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
