$kind: http-example
id: dfc31a0a-db0a-5e82-8336-85bdff4e4909
name: Client error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/allow_policies?page=1&per_page=20&search=string&order=pattern&direction=asc&is_exempt_recipient=true&is_trusted_sender=true&is_acceptable_sender=true&verify_sender=true&pattern_type=EMAIL&pattern=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: pattern
      description: Field to sort by.
    - key: direction
      value: asc
      description: The sorting direction.
    - key: is_exempt_recipient
      value: "true"
      description: Filter to show only policies where messages to the recipient bypass all detections.
    - key: is_trusted_sender
      value: "true"
      description: Filter to show only policies where messages from the sender bypass all detections and link following.
    - key: is_acceptable_sender
      value: "true"
      description: Filter to show only policies where messages from the sender are exempted from Spam, Spoof, and Bulk dispositions (not Malicious or Suspicious).
    - key: verify_sender
      value: "true"
      description: Filter to show only policies that enforce DMARC, SPF, or DKIM authentication.
    - key: pattern_type
      value: EMAIL
    - key: pattern
      value: string
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
