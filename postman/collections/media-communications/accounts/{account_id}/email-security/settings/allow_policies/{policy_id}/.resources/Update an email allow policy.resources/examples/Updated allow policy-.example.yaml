$kind: http-example
id: c6e52ce7-958b-56c7-9b66-2a84ac885e0b
name: Updated allow policy.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/allow_policies/{{policy_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "comments": "Trust all messages send from test@example.com",
        "is_acceptable_sender": false,
        "is_exempt_recipient": false,
        "is_recipient": false,
        "is_regex": false,
        "is_sender": true,
        "is_spoof": false,
        "is_trusted_sender": true,
        "pattern": "test@example.com",
        "pattern_type": "EMAIL",
        "verify_sender": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
