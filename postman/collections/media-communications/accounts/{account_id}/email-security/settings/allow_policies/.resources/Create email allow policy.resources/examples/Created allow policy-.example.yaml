$kind: http-example
id: bf3a816f-6067-5dda-9df8-7e78f68af31e
name: Created allow policy.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/allow_policies"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "comments": "Trust all messages send from test@example.com",
        "is_acceptable_sender": false,
        "is_exempt_recipient": false,
        "is_recipient": false,
        "is_regex": false,
        "is_sender": true,
        "is_spoof": false,
        "is_trusted_sender": true,
        "pattern": "test@example.com",
        "pattern_type": "EMAIL",
        "verify_sender": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
