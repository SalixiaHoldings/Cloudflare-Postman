$kind: http-example
id: 470fcf86-a7bd-5823-ac47-b36a7301a242
name: List of blocked senders.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/block_senders"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      disabled: true
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      disabled: true
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: created_at
      disabled: true
      description: Field to sort by.
    - key: direction
      value: asc
      disabled: true
      description: The sorting direction.
    - key: pattern_type
      value: EMAIL
      disabled: true
      description: Filter by pattern type.
    - key: pattern
      value: string
      disabled: true
      description: Filter by pattern value.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
