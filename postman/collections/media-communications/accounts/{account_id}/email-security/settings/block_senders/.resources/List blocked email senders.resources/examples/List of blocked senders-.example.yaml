$kind: http-example
id: eedc9654-213c-5e12-a821-0ec1070fed3a
name: List of blocked senders.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/block_senders?page=1&per_page=20&search=string&order=pattern&direction=asc&pattern_type=EMAIL&pattern=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Current page within paginated list of results.
    - key: per_page
      value: "20"
      description: The number of results per page. Maximum value is 1000.
    - key: search
      value: string
      description: Search term for filtering records. Behavior may change.
    - key: order
      value: pattern
      description: Field to sort by.
    - key: direction
      value: asc
      description: The sorting direction.
    - key: pattern_type
      value: EMAIL
      description: Filter by pattern type.
    - key: pattern
      value: string
      description: Filter by pattern value.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
