$kind: http-example
id: 4a803d81-0393-5a50-b2d2-ecabb9735c81
name: Created blocked sender.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email-security/settings/block_senders"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "comments": "Block sender with email test@example.com",
        "is_regex": false,
        "pattern": "test@example.com",
        "pattern_type": "EMAIL"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
