      {
        "domain": "docker.io",
        "auth": {
          "public_credential": "example-user",
          "private_credential": {
            "store_id": "14758f1afd44c09b7992073ccf00b43d",
            "secret_name": "{{secret_name}}"
          }
        },
        "kind": "ECR",
        "is_public": false
      }
