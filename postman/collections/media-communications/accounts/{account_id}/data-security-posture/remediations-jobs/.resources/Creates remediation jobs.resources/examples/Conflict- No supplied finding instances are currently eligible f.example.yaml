    Accept: application/json
  body:
    type: json
    content: |-
      {
        "finding_instance_ids": [
          "aaf5c84e-4875-267d-dd7a-f754a8c45d4d",
          "a3e992a7-3896-26da-87e3-fccecd185d00"
        ],
        "remediation_type_id": "5a7d9e2f-1b3c-4d5e-8f6a-7b8c9d0e1f2a"
