    content: |-
      {
        "finding_instance_ids": [
          "19a3e992-3738-6f26-ab87-34fccecd185d",
          "9d7bbd4f-84e3-6967-dba3-c559e8c73810"
        ],
        "remediation_type_id": "5a7d9e2f-1b3c-4d5e-8f6a-7b8c9d0e1f2a"
