$kind: http-example
id: 946f3133-9834-590b-9293-17fa36d4640b
name: Update pending approval (internal accounts, blocking customer rules, and customer rules with compiler warnings).
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "operator": "==",
              "type": "scalar",
              "field": "string",
              "value": "string"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "name": "string",
        "status": "blocking"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval_id": 1,
        "message": "Rule creation pending approval"
      }
order: 2000
