$kind: http-example
id: 0612de36-5eab-5f5f-b8a3-8198fda10a31
name: Another approval is already pending for this rule.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": false,
        "name": "string",
        "status": "blocking"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "An approval is already pending for this rule.",
        "code": "approval_pending",
        "approval_id": 12345
      }
order: 6000
