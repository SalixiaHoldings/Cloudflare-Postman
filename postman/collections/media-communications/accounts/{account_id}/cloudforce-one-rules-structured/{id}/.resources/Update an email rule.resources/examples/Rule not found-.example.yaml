$kind: http-example
id: 92af46e1-10cb-57e4-b5ea-44bab9ebe959
name: Rule not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "operator": "==",
              "type": "scalar",
              "field": "string",
              "value": "string"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "name": "string",
        "status": "blocking"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 5000
