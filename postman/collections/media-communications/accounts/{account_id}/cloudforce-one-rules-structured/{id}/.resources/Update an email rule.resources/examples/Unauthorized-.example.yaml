$kind: http-example
id: d2cb27e5-37e6-5c07-8659-aadf8fef83a6
name: Unauthorized.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "name": "string",
        "status": "blocking"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 4000
