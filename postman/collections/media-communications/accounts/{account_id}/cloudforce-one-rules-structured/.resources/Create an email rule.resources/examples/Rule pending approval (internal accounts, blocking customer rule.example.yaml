$kind: http-example
id: b0e09e13-78bd-5c85-8375-987fd69b49b5
name: Rule pending approval (internal accounts, blocking customer rules, and customer rules with compiler warnings).
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "status": "silent"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval_id": 1,
        "message": "Rule creation pending approval"
      }
order: 2000
