$kind: http-example
id: f57f2d5f-5476-53ea-b5b6-5e1450c1f010
name: Approval is not pending or is not a structured EML rule.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/approvals/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: module
      value: eml
      disabled: true
      description: Structured rule module.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          "operator": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          "conditions": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "description": "string",
        "enabled": true,
        "meta": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "status": "silent"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 5000
