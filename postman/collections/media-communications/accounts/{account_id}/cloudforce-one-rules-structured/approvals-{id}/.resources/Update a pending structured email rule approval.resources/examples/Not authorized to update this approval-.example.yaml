$kind: http-example
id: d67658fc-4ebe-574e-9128-dd0babd62099
name: Not authorized to update this approval.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/approvals/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: module
      value: eml
      disabled: true
      description: Structured rule module.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "status": "silent"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 3000
