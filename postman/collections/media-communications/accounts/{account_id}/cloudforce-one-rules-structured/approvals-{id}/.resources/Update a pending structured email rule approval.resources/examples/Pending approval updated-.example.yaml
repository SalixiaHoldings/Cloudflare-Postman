$kind: http-example
id: e19933b4-39e8-5750-9320-730d7a97736e
name: Pending approval updated.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/approvals/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: module
      value: eml
      disabled: true
      description: Structured rule module.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "operator": "==",
              "type": "scalar",
              "field": "string",
              "value": "string"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "status": "silent"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval": {
          "current_rule": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        }
      }
order: 1000
