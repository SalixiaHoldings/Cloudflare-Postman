$kind: http-example
id: 648ffeb4-6de2-57ee-9f1d-9ce718a688b7
name: Pending approval updated.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/approvals/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: module
      value: eml
      disabled: true
      description: Structured rule module.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "status": "silent"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "approval": {
          "current_rule": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        }
      }
order: 1000
