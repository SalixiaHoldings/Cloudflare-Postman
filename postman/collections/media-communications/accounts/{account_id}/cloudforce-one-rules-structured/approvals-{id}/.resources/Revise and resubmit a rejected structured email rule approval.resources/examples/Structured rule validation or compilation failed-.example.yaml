$kind: http-example
id: a760d38f-9b41-5d73-b337-3ddd87267250
name: Structured rule validation or compilation failed.
request:
  url: "{{base_url}}/accounts/{{account_id}}/cloudforce-one/rules/structured/approvals/{{id}}/resubmit"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: module
      value: eml
      disabled: true
      description: Structured rule module.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "condition": {
          "type": "group",
          "operator": "and",
          "conditions": [
            {
              "type": "scalar",
              "field": "{{condition__conditions__0__field}}",
              "operator": "==",
              "value": "{{condition__conditions__0__value}}"
            }
          ]
        },
        "description": "string",
        "enabled": true,
        "status": "silent"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Not found"
      }
order: 2000
