$kind: http-example
id: 25748f67-e78e-54f5-8d87-22cb9dcec09d
name: Returns the updated Email Sending suppression.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/suppressions/{{suppression_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "expires_at": "2027-01-01T00:00:00Z",
        "note": "Customer re-confirmed opt-in"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "success": true,
        "result": {
          "id": "396a5436-d4b0-42a6-b3fc-48e8fa522321",
          "email": "user@example.com",
          "reason": "hard_bounce",
          "created_at": "2026-01-02T02:20:00Z",
          "expires_at": "2027-01-01T00:00:00Z",
          "read_only": false,
          "note": "Imported from CRM"
        }
      }
order: 1000
