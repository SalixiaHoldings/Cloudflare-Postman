name: Invalid request, generally because of the format/content of the email send request. No email will be sent when this happens.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/send"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "attachments": [
          {
            "content": "JVBERi0xLjQK...",
            "disposition": "attachment",
            "filename": "report.pdf",
            "type": "application/pdf"
          }
        ],
        "from": "sender@example.com",
        "html": "<h1>Hello</h1><p>Please find your report attached.</p>",
        "subject": "Monthly Report",
        "text": "Hello\n\nPlease find your report attached.",
        "to": [
          "recipient@example.com"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "messages": [
          "string",
          "string"
        ],
        "errors": [
          {
            "code": {
