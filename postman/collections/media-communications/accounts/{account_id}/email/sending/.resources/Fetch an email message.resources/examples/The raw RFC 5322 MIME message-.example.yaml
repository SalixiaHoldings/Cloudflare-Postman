$kind: http-example
id: 75f037c7-47d3-5e8c-b1f7-85bccd9d96f5
name: The raw RFC 5322 MIME message.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/messages/{{message_id}}"
  method: GET
  headers:
    Accept: message/rfc822
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: message/rfc822
  body:
    type: text
    content: string
order: 1000
