$kind: http-example
id: 34df3bc1-4768-5a92-aa46-cd963581a20a
name: The raw RFC 5322 MIME message.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/messages/{{message_id}}"
  method: GET
  headers:
    Accept: message/rfc822
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: message/rfc822
  body:
    type: text
    content: string
order: 1000
