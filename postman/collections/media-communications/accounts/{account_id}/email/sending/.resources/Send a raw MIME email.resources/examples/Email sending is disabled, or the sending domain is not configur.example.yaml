id: 7e856074-1866-54d5-a31d-94dcdc6e40d0
name: Email sending is disabled, or the sending domain is not configured for email sending.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/send_raw"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "from": "sender@example.com",
        "mime_message": "From: sender@example.com\r\nTo: recipient@example.com\r\nSubject: Hello\r\nContent-Type: text/plain\r\n\r\nHello, World!",
        "recipients": [
          "recipient@example.com"
        ]
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "messages": [
          "string",
          "string"
        ],
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          },
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "result": null
      }
order: 3000
