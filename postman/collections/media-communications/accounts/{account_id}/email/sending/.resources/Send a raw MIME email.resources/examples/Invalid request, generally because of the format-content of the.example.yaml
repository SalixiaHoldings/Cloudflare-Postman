name: Invalid request, generally because of the format/content of the email send request. No email will be sent when this happens.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/sending/send_raw"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "from": "sender@example.com",
        "mime_message": "From: sender@example.com\r\nTo: recipient@example.com\r\nSubject: Hello\r\nContent-Type: text/plain\r\n\r\nHello, World!",
        "recipients": [
          "recipient@example.com"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "messages": [
          "string",
          "string"
        ],
        "errors": [
          {
            "code": {
