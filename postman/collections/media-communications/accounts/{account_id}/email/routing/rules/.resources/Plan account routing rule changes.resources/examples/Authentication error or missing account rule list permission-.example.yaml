$kind: http-example
id: c8db1a3c-368d-5d99-96fc-bbf21aa26f51
name: Authentication error or missing account rule list permission.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/routing/rules/plan"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "catch_all_rules": [
          {
            "rule": {
              "actions": [
                {
                  "type": "worker",
                  "value": [
                    "my-worker"
                  ]
                }
              ],
              "matchers": [
                {
                  "type": "all"
                }
              ]
            },
            "target": "*@example.com"
          }
        ],
        "owner_worker_tag": "a7e6fb77503c41d8a7f3113c6918f10c",
        "rules": [
          {
            "actions": [
              {
                "type": "worker",
                "value": [
                  "my-worker"
                ]
              }
            ],
            "matchers": [
              {
                "field": "to",
                "type": "literal",
                "value": "support@example.com"
              }
            ]
          },
          {
            "actions": [
              {
                "type": "worker",
                "value": [
                  "my-worker"
                ]
              }
            ],
            "matchers": [
              {
                "field": "to",
                "type": "literal",
                "value": "info@example.com"
              }
            ]
          },
          {
            "actions": [
              {
                "type": "worker",
                "value": [
                  "my-worker"
                ]
              }
            ],
            "matchers": [
              {
                "field": "to",
                "type": "literal",
                "value": "billing@example.com"
              }
            ]
          }
        ]
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
