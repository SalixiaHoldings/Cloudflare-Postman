$kind: http-example
id: d0f37d7a-4a10-5666-8bae-cb974596b7c0
name: Authentication error or missing account rule list permission.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/routing/rules"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "20"
      disabled: true
    - key: enabled
      value: "true"
      disabled: true
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
