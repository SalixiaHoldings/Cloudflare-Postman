                "type": "literal"
              }
            ]
          },
          {
            "actions": [
              {
                "type": "worker",
                "value": [
                  "my-worker"
                ]
              }
            ],
            "matchers": [
              {
                "type": "literal"
              },
              {
                "type": "literal"
              }
            ]
          }
        ]
      }
