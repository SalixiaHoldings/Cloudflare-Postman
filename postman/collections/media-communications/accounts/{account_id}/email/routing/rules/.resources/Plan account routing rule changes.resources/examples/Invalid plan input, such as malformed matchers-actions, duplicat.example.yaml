$kind: http-example
id: e65295e1-5889-5720-8acf-e57ab20ab05c
name: Invalid plan input, such as malformed matchers/actions, duplicate targets, or an owner_worker_tag that does not resolve to a known Worker script.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/routing/rules/plan"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "owner_worker_tag": "a7e6fb77503c41d8a7f3113c6918f10c"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 4000
