$kind: http-example
id: e6991788-a2d6-51ec-9b66-e09d0a225465
name: Authentication error or missing email routing address list permission.
request:
  url: "{{base_url}}/accounts/{{account_id}}/email/routing/addresses"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "20"
      disabled: true
    - key: direction
      value: asc
      disabled: true
    - key: verified
      value: "true"
      disabled: true
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
