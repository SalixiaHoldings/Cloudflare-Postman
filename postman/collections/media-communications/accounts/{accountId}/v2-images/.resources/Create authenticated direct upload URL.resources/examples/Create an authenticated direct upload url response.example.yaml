$kind: http-example
id: 08aef899-e58f-54d1-a965-4626d22361ee
request:
  url: "{{base_url}}/accounts/{{accountId}}/v2/images/direct_upload"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: expiry
        value: string
        description: "The date after which the upload will not be accepted. Minimum: Now + 2 minutes."
      - type: text
        key: id
        value: string
        description: Optional Image Custom ID. Up to 1024 chars. Can include any number of subpaths, and utf8 characters. Cannot start nor end with a / (forward slash). Cannot be a UUID.
      - type: text
        key: metadata
        value: "{}"
        description: User modifiable key-value store. Can use used for keeping references to another system of record for managing images.
      - type: text
        key: requireSignedURLs
        value: "false"
        description: Indicates whether the image requires a signature token for the access.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "result": {
          "id": "string",
          "uploadURL": "string"
        }
      }
order: 1000
