$kind: http-example
id: 7619b541-d6aa-500b-886b-2bf4eee7a496
request:
  url: "{{base_url}}/accounts/{{accountId}}/v2/images"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "1000"
      disabled: true
      description: Number of items per page
    - key: continuation_token
      value: string
      disabled: true
      description: Continuation token for a next page. List images V2 returns continuation_token
    - key: creator
      value: string
      disabled: true
      description: Internal user ID set within the creator field. Setting to empty string will return images where creator field is not set
    - key: sort_order
      value: desc
      disabled: true
      description: Sorting order by upload time
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "images": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ],
          "continuation_token": "string"
        }
      }
order: 1000
