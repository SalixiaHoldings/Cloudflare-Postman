$kind: http-example
id: f492aad8-3ce1-5786-8ac4-811851d70f9e
request:
  url: "{{base_url}}/accounts/{{accountId}}/v2/images?per_page=1000&continuation_token=string&creator=string&sort_order=desc"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "1000"
      description: Number of items per page
    - key: continuation_token
      value: string
      description: Continuation token for a next page. List images V2 returns continuation_token
    - key: creator
      value: string
      description: Internal user ID set within the creator field. Setting to empty string will return images where creator field is not set
    - key: sort_order
      value: desc
      description: Sorting order by upload time
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "error": {}
      }
order: 2000
