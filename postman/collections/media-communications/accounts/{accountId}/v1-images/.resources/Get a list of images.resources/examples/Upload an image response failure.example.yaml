$kind: http-example
id: 3b3086ee-949d-5216-8898-e2e0db4a4005
request:
  url: "{{base_url}}/accounts/{{accountId}}/v1/images"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "1000"
      disabled: true
      description: Number of items per page
    - key: continuation_token
      value: string
      disabled: true
      description: Continuation token for a next page. List images V2 returns continuation_token
    - key: creator
      value: string
      disabled: true
      description: Internal user ID set within the creator field. Setting to empty string will return images where creator field is not set
    - key: sort_order
      value: desc
      disabled: true
      description: Sorting order by upload time
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "error": {}
      }
order: 2000
