$kind: http-example
id: b077e53a-acf2-5371-9fe9-dc7f16649749
request:
  url: "{{base_url}}/accounts/{{accountId}}/v1/images?per_page=1000&continuation_token=string&creator=string&sort_order=desc"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "1000"
      description: Number of items per page
    - key: continuation_token
      value: string
      description: Continuation token for a next page. List images V2 returns continuation_token
    - key: creator
      value: string
      description: Internal user ID set within the creator field. Setting to empty string will return images where creator field is not set
    - key: sort_order
      value: desc
      description: Sorting order by upload time
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "images": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ],
          "continuation_token": "string"
        }
      }
order: 1000
