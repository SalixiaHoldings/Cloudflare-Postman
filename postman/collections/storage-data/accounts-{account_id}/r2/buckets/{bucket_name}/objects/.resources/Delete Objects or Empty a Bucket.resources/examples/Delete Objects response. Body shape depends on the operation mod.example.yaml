$kind: http-example
id: c7f9b560-2bbd-5f79-9f18-71fba2bd2725
name: |
  Delete Objects response. Body shape depends on the operation mode:
  - "delete by list" returns an array of `{ key }` entries for successfully deleted objects;
  - "delete by prefix" returns the prefix-delete job descriptor.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects"
  method: DELETE
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: cf-r2-data-catalog-check
      value: string
      description: Set this header to reject the operation when R2 Data Catalog is enabled for the bucket.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  queryParams:
    - key: prefix
      value: ""
      disabled: true
  body:
    type: json
    content: |-
      [
        "path/to/object-a.txt",
        "path/to/object-b.txt"
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "endTime": "2026-07-20T12:00:00Z",
          "id": "69f94626-a3fe-47bc-9615-e791b4d53c53",
          "jobType": "prefixDelete",
          "prefixDelete": {
            "deletedObjects": 0,
            "isBucketClear": true,
            "prefix": ""
          },
          "startTime": "2026-07-20T12:00:00Z",
          "status": "COMPLETED"
        },
        "success": true
      }
order: 1000
