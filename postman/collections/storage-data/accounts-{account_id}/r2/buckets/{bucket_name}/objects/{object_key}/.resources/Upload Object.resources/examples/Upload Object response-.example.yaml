$kind: http-example
id: 7299c2b2-d1e5-599d-b283-6b232cc7236f
name: Upload Object response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects/{{object_key}}"
  method: PUT
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Content-Length
      value: "1081"
    - key: cf-r2-storage-class
      value: Standard
      description: Storage class for this object. Overrides the bucket default.
    - key: Content-Type
      value: application/octet-stream
    - key: Accept
      value: application/json
  body:
    type: file
    content: {}
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
