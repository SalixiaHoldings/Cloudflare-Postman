$kind: http-example
id: 4a3dea70-a1d6-535e-b038-99ed53a4f360
name: Not Modified. Returned when conditional request headers indicate the object has not changed.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects/{{object_key}}"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: If-None-Match
      value: string
    - key: If-Modified-Since
      value: string
    - key: Accept
      value: application/octet-stream
response:
  statusCode: 304
  statusText: Not Modified
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
