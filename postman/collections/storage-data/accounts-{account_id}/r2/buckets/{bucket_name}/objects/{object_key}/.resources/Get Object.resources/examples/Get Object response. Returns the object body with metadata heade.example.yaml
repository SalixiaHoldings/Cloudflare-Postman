$kind: http-example
id: 27c47f1d-9b52-5db4-a5ca-4e89c7c4c3f0
name: Get Object response. Returns the object body with metadata headers.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects/{{object_key}}"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: If-None-Match
      value: string
    - key: If-Modified-Since
      value: string
    - key: Accept
      value: application/octet-stream
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Length
      value: "4405"
      description: The size of the object in bytes.
    - key: ETag
      value: string
      description: |
        The entity tag for the object, wrapped in double-quotes per RFC 7232,
        e.g. `"d41d8cd98f00b204e9800998ecf8427e"`.
    - key: Last-Modified
      value: string
      description: |
        The date and time the object was last modified, formatted as an HTTP-date (RFC 7231),
        e.g. `Tue, 15 Jan 2024 10:30:00 GMT`.
    - key: cf-r2-storage-class
      value: Standard
      description: The storage class of the object.
    - key: Content-Type
      value: application/octet-stream
  body:
    type: text
    content: string
order: 1000
