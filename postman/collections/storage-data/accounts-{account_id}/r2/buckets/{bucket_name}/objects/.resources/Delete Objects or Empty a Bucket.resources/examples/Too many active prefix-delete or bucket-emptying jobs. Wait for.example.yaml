$kind: http-example
id: ed96c50a-5c24-5092-a5da-699c8d0dd194
name: Too many active prefix-delete or bucket-emptying jobs. Wait for an existing job to finish, then retry.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects"
  method: DELETE
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: cf-r2-data-catalog-check
      value: string
      description: Set this header to reject the operation when R2 Data Catalog is enabled for the bucket.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  queryParams:
    - key: prefix
      value: ""
      disabled: true
  body:
    type: json
    content: |-
      [
        "path/to/object-a.txt",
        "path/to/object-b.txt"
      ]
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 10058,
            "message": "Too many concurrent prefix delete jobs for this bucket. Please wait for existing jobs to complete."
          }
        ],
        "messages": [
          "Request failed."
        ],
        "result": null,
        "success": false
      }
order: 3000
