$kind: http-example
id: b0eb2bf4-f7ae-5b73-a042-c0f1fb2d9fca
name: Delete Objects response failure. The bucket may not exist, the request may be invalid, or the caller may not be authorized.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/objects"
  method: DELETE
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: cf-r2-data-catalog-check
      value: string
      description: Set this header to reject the operation when R2 Data Catalog is enabled for the bucket.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  queryParams:
    - key: prefix
      value: ""
      disabled: true
  body:
    type: json
    content: |-
      [
        "path/to/object-a.txt",
        "path/to/object-b.txt"
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "result": null
      }
order: 4000
