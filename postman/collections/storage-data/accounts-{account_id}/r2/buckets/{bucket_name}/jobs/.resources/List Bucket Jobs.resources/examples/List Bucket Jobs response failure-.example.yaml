name: List Bucket Jobs response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/jobs?jobType=prefixDelete&status=COMPLETED&maxKeys=719&continuationToken=string"
  method: GET
  headers:
    cf-r2-jurisdiction: default
    Accept: application/json
  queryParams:
    - key: jobType
      value: prefixDelete
      description: Restricts results to jobs of the specified type.
    - key: status
      value: COMPLETED
      description: Restricts results to jobs with the specified status. `jobType` is required when this parameter is provided.
    - key: maxKeys
      value: "719"
      description: Maximum number of jobs to return.
    - key: continuationToken
      value: string
      description: Pagination token received as `nextContinuationToken` in the previous response.
