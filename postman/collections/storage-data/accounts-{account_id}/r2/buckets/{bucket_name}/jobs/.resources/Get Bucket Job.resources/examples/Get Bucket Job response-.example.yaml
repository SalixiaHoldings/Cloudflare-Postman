$kind: http-example
id: 7ab1f85e-1459-5c77-97c1-f3689423a1b8
name: Get Bucket Job response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/jobs/{{job_id}}"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "endTime": "2026-07-20T12:14:31Z",
          "id": "7f24658b-31d7-4b91-9a12-cb5a2c99b294",
          "jobType": "prefixDelete",
          "prefixDelete": {
            "deletedObjects": 2481,
            "isBucketClear": true,
            "prefix": ""
          },
          "startTime": "2026-07-20T12:00:00Z",
          "status": "COMPLETED"
        },
        "success": true
      }
order: 1000
