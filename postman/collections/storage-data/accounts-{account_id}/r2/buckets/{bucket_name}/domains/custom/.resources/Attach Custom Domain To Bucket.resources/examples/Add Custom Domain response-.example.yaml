$kind: http-example
id: eb25cb5a-69ad-5f3c-90a2-023963a583ee
name: Add Custom Domain response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/domains/custom"
  method: POST
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "domain": "prefix.example-domain.com",
        "enabled": true,
        "zoneId": "36ca64a6d92827b8a6b90be344bb1bfd"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
