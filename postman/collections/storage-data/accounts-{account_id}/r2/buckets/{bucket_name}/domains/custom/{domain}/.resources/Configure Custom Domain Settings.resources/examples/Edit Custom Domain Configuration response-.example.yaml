$kind: http-example
id: bc8d58ed-61af-56c9-b6ab-7ab350cc4251
name: Edit Custom Domain Configuration response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/domains/custom/{{domain}}"
  method: PUT
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true,
        "minTLS": "1.2"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
