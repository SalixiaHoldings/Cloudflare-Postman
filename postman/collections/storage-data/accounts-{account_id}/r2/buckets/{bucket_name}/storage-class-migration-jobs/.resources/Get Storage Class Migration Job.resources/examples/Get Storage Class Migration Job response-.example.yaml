$kind: http-example
id: 75e5814e-21dc-5cbd-80ad-f00f57f8cc51
name: Get Storage Class Migration Job response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/storage-class-migration-jobs/{{job_id}}"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "endTime": "2026-09-04T12:14:31Z",
          "id": "7f24658b-31d7-4b91-9a12-cb5a2c99b294",
          "jobType": "storageClassMigration",
          "startTime": "2026-09-04T12:00:00Z",
          "status": "COMPLETED",
          "storageClassMigration": {
            "destinationStorageClass": "Standard",
            "migratedObjects": 2481,
            "sourceStorageClass": "InfrequentAccess"
          }
        },
        "success": true
      }
order: 1000
