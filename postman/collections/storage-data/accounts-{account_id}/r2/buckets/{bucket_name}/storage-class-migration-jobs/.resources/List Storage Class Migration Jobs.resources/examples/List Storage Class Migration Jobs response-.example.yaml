$kind: http-example
id: aee767dc-f836-520e-b406-ba8616ac7891
name: List Storage Class Migration Jobs response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/storage-class-migration-jobs?status=<string>&maxKeys=719&continuationToken=string"
  method: GET
  headers:
    cf-r2-jurisdiction: default
    Accept: application/json
  queryParams:
    - key: status
      value: <string>
      description: Restricts results to jobs with the specified status.
    - key: maxKeys
      value: "719"
      description: Maximum number of jobs to return.
    - key: continuationToken
      value: string
      description: Pagination token received as `nextContinuationToken` in the previous response.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "jobs": [
            {
              "id": "7f24658b-31d7-4b91-9a12-cb5a2c99b294",
              "jobType": "storageClassMigration",
              "startTime": "2026-09-04T12:00:00Z",
              "status": "RUNNING",
              "storageClassMigration": {
                "destinationStorageClass": "Standard",
                "migratedObjects": 1350,
                "sourceStorageClass": "InfrequentAccess"
              }
            }
          ],
          "nextContinuationToken": "eyJ2IjoxLCJzdGFydEFmdGVyIjoiLi4uIn0="
        },
        "success": true
      }
order: 1000
