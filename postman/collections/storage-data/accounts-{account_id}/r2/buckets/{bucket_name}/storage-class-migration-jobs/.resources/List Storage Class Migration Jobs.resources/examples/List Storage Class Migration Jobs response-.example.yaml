$kind: http-example
id: 1a534bb4-0c71-5310-838f-c73b5b860071
name: List Storage Class Migration Jobs response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets/{{bucket_name}}/storage-class-migration-jobs"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Accept
      value: application/json
  queryParams:
    - key: status
      value: <string>
      disabled: true
      description: Restricts results to jobs with the specified status.
    - key: maxKeys
      value: "599"
      disabled: true
      description: Maximum number of jobs to return.
    - key: continuationToken
      value: string
      disabled: true
      description: Pagination token received as `nextContinuationToken` in the previous response.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "jobs": [
            {
              "id": "7f24658b-31d7-4b91-9a12-cb5a2c99b294",
              "jobType": "storageClassMigration",
              "startTime": "2026-09-04T12:00:00Z",
              "status": "RUNNING",
              "storageClassMigration": {
                "destinationStorageClass": "Standard",
                "migratedObjects": 1350,
                "sourceStorageClass": "InfrequentAccess"
              }
            }
          ],
          "nextContinuationToken": "eyJ2IjoxLCJzdGFydEFmdGVyIjoiLi4uIn0="
        },
        "success": true
      }
order: 1000
