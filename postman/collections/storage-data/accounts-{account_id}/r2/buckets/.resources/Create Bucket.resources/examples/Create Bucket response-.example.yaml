name: Create Bucket response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets"
  method: POST
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "example-bucket",
        "locationHint": "wnam",
        "storageClass": "Standard"
      }
