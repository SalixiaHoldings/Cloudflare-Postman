$kind: http-example
id: 7f8d85c2-9c5d-51d8-8c13-266a208cb622
name: List Buckets response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2/buckets"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Accept
      value: application/json
  queryParams:
    - key: name_contains
      value: my-bucket
      disabled: true
    - key: start_after
      value: my-bucket
      disabled: true
    - key: per_page
      value: "20"
      disabled: true
    - key: order
      value: name
      disabled: true
    - key: direction
      value: desc
      disabled: true
    - key: cursor
      value: string
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "buckets": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        }
      }
order: 1000
