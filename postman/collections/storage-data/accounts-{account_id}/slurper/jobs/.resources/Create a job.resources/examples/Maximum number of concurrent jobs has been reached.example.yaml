$kind: http-example
id: f0784234-79f9-578d-a5c8-c4fb06f3b7fe
request:
  url: "{{base_url}}/accounts/{{account_id}}/slurper/jobs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "overwrite": true,
        "source": {
          "vendor": "s3",
          "bucket": "{{source__bucket}}",
          "secret": {
            "accessKeyId": "{{source__secret__accessKeyId}}",
            "secretAccessKey": "{{source__secret__secretAccessKey}}"
          }
        },
        "target": {
          "vendor": "r2",
          "bucket": "{{target__bucket}}",
          "secret": {
            "accessKeyId": "{{target__secret__accessKeyId}}",
            "secretAccessKey": "{{target__secret__secretAccessKey}}"
          }
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "success": false
      }
order: 2000
