$kind: http-example
id: e1611673-ebad-56b1-b8bc-4242d62a0913
request:
  url: "{{base_url}}/accounts/{{account_id}}/slurper/jobs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "overwrite": true,
        "target": {
          "vendor": "r2",
          "bucket": "{{target__bucket}}",
          "secret": {
            "accessKeyId": "{{target__secret__accessKeyId}}",
            "secretAccessKey": "{{target__secret__secretAccessKey}}"
          }
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "success": false
      }
order: 2000
