    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "vendor": "s3",
        "bucket": "{{bucket}}",
        "secret": {
          "accessKeyId": "{{secret__accessKeyId}}",
          "secretAccessKey": "{{secret__secretAccessKey}}"
        }
      }
