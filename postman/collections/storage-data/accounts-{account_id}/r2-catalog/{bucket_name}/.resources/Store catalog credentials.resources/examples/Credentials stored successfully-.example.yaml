$kind: http-example
id: 955ce564-0bba-59dc-8d7b-4c92f8b9ce26
name: Credentials stored successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/credential"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "token": "your-cloudflare-api-token-here"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": null,
        "success": true
      }
order: 1000
