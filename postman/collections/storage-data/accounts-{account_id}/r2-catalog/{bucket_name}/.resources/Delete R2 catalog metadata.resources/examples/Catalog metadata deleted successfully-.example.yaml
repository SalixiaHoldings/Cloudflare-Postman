$kind: http-example
id: 36ba748f-cadb-5379-b5a7-fea7ff1fd703
name: Catalog metadata deleted successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/delete?force=false"
  method: POST
  headers:
    Accept: application/json
  queryParams:
    - key: force
      value: "false"
      description: Remove child metadata before deleting the catalog.
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
