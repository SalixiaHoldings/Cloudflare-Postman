$kind: http-example
id: 563668cf-b03b-5677-8b6c-dff059ef22c3
name: Catalog is non-empty, has unfinished work, is protected, or exceeds the force-delete limit.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/delete"
  method: POST
  headers:
    Accept: application/json
  queryParams:
    - key: force
      value: "false"
      disabled: true
      description: Remove child metadata before deleting the catalog.
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "success": false
      }
order: 5000
