$kind: http-example
id: 3b1ffd16-d5ce-5363-9201-66fffc18dda8
name: Forbidden.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/namespaces/{{namespace}}/tables?page_token=MSYxNzU5NzU2MTI4NTU2Njk2JjAxOTliOWEzLTkxMmUtN2ZhMS05YzllLTg5MTAxMGQzYTg0MQ&page_size=100&return_uuids=true&return_details=true"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page_token
      value: MSYxNzU5NzU2MTI4NTU2Njk2JjAxOTliOWEzLTkxMmUtN2ZhMS05YzllLTg5MTAxMGQzYTg0MQ
      description: |
        Opaque pagination token from a previous response.
        Use this to fetch the next page of results.
    - key: page_size
      value: "100"
      description: |
        Maximum number of tables to return per page.
        Defaults to 100, maximum 1000.
    - key: return_uuids
      value: "true"
      description: |
        Whether to include table UUIDs in the response.
        Set to true to receive the table_uuids array.
    - key: return_details
      value: "true"
      description: |
        Whether to include additional metadata (timestamps, locations).
        When true, response includes created_at, updated_at, metadata_locations, and locations arrays.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "success": false
      }
order: 4000
