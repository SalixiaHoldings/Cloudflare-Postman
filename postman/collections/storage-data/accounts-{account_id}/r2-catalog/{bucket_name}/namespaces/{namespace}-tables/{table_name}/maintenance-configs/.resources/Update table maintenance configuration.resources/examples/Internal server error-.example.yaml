$kind: http-example
id: d5e9ced2-022f-59f1-b306-897a8dc61b84
name: Internal server error.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/namespaces/{{namespace}}/tables/{{table_name}}/maintenance-configs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "compaction": {
          "state": "enabled",
          "target_size_mb": "256"
        },
        "snapshot_expiration": {
          "max_snapshot_age": "14d",
          "min_snapshots_to_keep": 5,
          "state": "enabled"
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "success": false
      }
order: 6000
