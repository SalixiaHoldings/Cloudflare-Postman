$kind: http-example
id: 17acb03c-ae5f-533c-9172-37baf2e44b47
name: List of namespaces retrieved successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/namespaces"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page_token
      value: MSYxNzU5NzU1NTc4NTA0MTk0JjAxOTliOTliLTJjODgtNzNiMy04ZGJiLTQyMWUwZThmMjc1Nw
      disabled: true
      description: |
        Opaque pagination token from a previous response.
        Use this to fetch the next page of results.
    - key: page_size
      value: "100"
      disabled: true
      description: |
        Maximum number of namespaces to return per page.
        Defaults to 100, maximum 1000.
    - key: parent
      value: bronze
      disabled: true
      description: |
        Parent namespace to filter by. Only returns direct children of this namespace.
        For nested namespaces, use %1F as separator (e.g., "bronze%1Fanalytics").
        Omit this parameter to list top-level namespaces.
    - key: return_uuids
      value: "true"
      disabled: true
      description: |
        Whether to include namespace UUIDs in the response.
        Set to true to receive the namespace_uuids array.
    - key: return_details
      value: "true"
      disabled: true
      description: |
        Whether to include additional metadata (timestamps).
        When true, response includes created_at and updated_at arrays.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "details": [
            {
              "created_at": "2025-10-07T10:00:00Z",
              "namespace": [
                "bronze"
              ],
              "namespace_uuid": "0199b999-6869-7383-bb1f-d30e059d5326",
              "updated_at": "2025-10-07T12:00:00Z"
            },
            {
              "created_at": "2025-10-07T10:15:00Z",
              "namespace": [
                "silver"
              ],
              "namespace_uuid": "0199b99b-2c88-73b3-8dbb-421e0e8f2757",
              "updated_at": null
            },
            {
              "created_at": "2025-10-07T10:30:00Z",
              "namespace": [
                "gold"
              ],
              "namespace_uuid": "0199b99c-3d99-73c4-9dcc-532f1f9f3868",
              "updated_at": "2025-10-07T11:00:00Z"
            }
          ],
          "namespace_uuids": [
            "0199b999-6869-7383-bb1f-d30e059d5326",
            "0199b99b-2c88-73b3-8dbb-421e0e8f2757",
            "0199b99c-3d99-73c4-9dcc-532f1f9f3868"
          ],
          "namespaces": [
            [
              "bronze"
            ],
            [
              "silver"
            ],
            [
              "gold"
            ]
          ],
          "next_page_token": null
        },
        "success": true
      }
order: 1000
