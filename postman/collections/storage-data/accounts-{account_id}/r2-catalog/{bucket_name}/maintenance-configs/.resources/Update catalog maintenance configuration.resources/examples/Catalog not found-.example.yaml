$kind: http-example
id: 7fe79057-5418-57ff-8a0a-cc49ff3db51f
name: Catalog not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/maintenance-configs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "compaction": {
          "state": "enabled",
          "target_size_mb": "256"
        },
        "snapshot_expiration": {
          "max_snapshot_age": "14d",
          "min_snapshots_to_keep": 5,
          "state": "enabled"
        }
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "success": false
      }
order: 5000
