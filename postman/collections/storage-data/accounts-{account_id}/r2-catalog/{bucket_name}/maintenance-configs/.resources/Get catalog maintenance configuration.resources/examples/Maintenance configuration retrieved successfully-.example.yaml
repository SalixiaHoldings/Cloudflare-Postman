$kind: http-example
id: a642ad21-4bd1-5118-a566-21213f08e1d7
name: Maintenance configuration retrieved successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/maintenance-configs"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "credential_status": "present",
          "maintenance_config": {
            "compaction": {
              "state": "enabled",
              "target_size_mb": "128"
            },
            "snapshot_expiration": {
              "max_snapshot_age": "7d",
              "min_snapshots_to_keep": 100,
              "state": "enabled"
            }
          }
        },
        "success": true
      }
order: 1000
