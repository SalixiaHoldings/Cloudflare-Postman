$kind: http-example
id: 1adb623e-291d-5b87-bafd-1d1dabe4581f
name: Maintenance configuration updated successfully.
request:
  url: "{{base_url}}/accounts/{{account_id}}/r2-catalog/{{bucket_name}}/maintenance-configs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "compaction": {
          "state": "enabled",
          "target_size_mb": "256"
        },
        "snapshot_expiration": {
          "max_snapshot_age": "14d",
          "min_snapshots_to_keep": 5,
          "state": "enabled"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {
          "compaction": {
            "state": "enabled",
            "target_size_mb": "256"
          },
          "snapshot_expiration": {
            "max_snapshot_age": "14d",
            "min_snapshots_to_keep": 5,
            "state": "enabled"
          }
        },
        "success": true
      }
order: 1000
