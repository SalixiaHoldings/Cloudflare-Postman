$kind: http-example
id: fc16e7c1-e13f-506c-a359-99d5411eaef2
name: Delete store failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: force
      value: "false"
      disabled: true
      description: |
        When true, cascade-deletes all secrets in the store before deleting the store itself.
        Required when deleting a non-empty store. Without this parameter, attempting to
        delete a non-empty store returns 409.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 3000
