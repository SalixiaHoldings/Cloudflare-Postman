$kind: http-example
id: e5b0e28a-658a-5d4b-844e-27ace6c3af86
name: Store is not empty. Use force=true to cascade-delete all secrets.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}"
  method: DELETE
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: force
      value: "false"
      disabled: true
      description: |
        When true, cascade-deletes all secrets in the store before deleting the store itself.
        Required when deleting a non-empty store. Without this parameter, attempting to
        delete a non-empty store returns 409.
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
