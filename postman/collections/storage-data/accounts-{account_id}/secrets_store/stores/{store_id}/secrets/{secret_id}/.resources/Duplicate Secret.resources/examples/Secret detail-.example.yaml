$kind: http-example
id: d40a94d6-6535-5b2b-9581-53acb67ae83a
name: Secret detail.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}/secrets/{{secret_id}}/duplicate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "MY_API_KEY",
        "scopes": [
          "workers",
          "ai_gateway",
          "dex",
          "access",
          "websearch"
        ],
        "comment": "info about my secret"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
