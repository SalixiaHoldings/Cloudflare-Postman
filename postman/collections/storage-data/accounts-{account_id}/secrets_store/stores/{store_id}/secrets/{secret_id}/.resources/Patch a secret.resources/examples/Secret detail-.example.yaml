$kind: http-example
id: 659427db-a52b-5d76-b318-7a3fc0447275
name: Secret detail.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}/secrets/{{secret_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "comment": "info about my secret",
        "scopes": [
          "workers",
          "ai_gateway",
          "dex",
          "access",
          "websearch"
        ],
        "value": "api-token-secret-123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
