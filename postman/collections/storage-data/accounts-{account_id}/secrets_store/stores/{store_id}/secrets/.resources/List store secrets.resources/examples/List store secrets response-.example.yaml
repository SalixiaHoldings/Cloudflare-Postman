name: List store secrets response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}/secrets"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: direction
      value: desc
      disabled: true
      description: Direction to sort objects.
    - key: page
      value: "2"
      disabled: true
      description: Page number.
    - key: per_page
      value: "20"
      disabled: true
      description: Number of objects to return per page.
    - key: search
      value: string
      disabled: true
      description: Search secrets using a filter string, filtering across name and comment.
    - key: order
      value: created
      disabled: true
      description: Order secrets by values in the given field.
    - key: scopes
      value: workers,websearch
      disabled: true
      description: Only secrets with the given scopes will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
