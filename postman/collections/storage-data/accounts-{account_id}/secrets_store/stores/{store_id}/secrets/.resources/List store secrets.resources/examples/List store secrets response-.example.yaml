name: List store secrets response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/secrets_store/stores/{{store_id}}/secrets?direction=desc&page=2&per_page=20&search=string&order=created&scopes=websearch,containers"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: direction
      value: desc
      description: Direction to sort objects.
    - key: page
      value: "2"
      description: Page number.
    - key: per_page
      value: "20"
      description: Number of objects to return per page.
    - key: search
      value: string
      description: Search secrets using a filter string, filtering across name and comment.
    - key: order
      value: created
      description: Order secrets by values in the given field.
    - key: scopes
      value: websearch,containers
      description: Only secrets with the given scopes will be returned.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
