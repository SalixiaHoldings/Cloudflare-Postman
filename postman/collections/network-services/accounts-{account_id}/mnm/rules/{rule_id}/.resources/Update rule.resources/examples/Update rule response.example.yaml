$kind: http-example
id: e1e32874-a340-5887-9c06-7f95d71b90e4
request:
  url: "{{base_url}}/accounts/{{account_id}}/mnm/rules/{{rule_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "my_rule_1",
        "prefixes": [
          "203.0.113.1/32",
          "203.0.113.1/32"
        ],
        "automatic_advertisement": true,
        "type": "zscore",
        "bandwidth_threshold": 1000,
        "duration": "1m",
        "packet_threshold": 10000,
        "prefix_match": "exact",
        "zscore_sensitivity": "high",
        "zscore_target": "bits"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
