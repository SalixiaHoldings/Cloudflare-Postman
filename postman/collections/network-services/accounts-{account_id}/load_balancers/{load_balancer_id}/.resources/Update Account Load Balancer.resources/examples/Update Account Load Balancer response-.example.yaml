name: Update Account Load Balancer response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/load_balancers/{{load_balancer_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "www.example.com",
        "default_pools": [
          "{{default_pools__0}}",
          "{{default_pools__1}}"
        ],
        "fallback_pool": "{{fallback_pool}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
