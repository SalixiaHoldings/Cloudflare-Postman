id: d03fbe3f-06f3-5a33-a7d0-83a1082a7500
name: Invalid Credentials.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/cloud/resources/{{resource_id}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: v2
      value: "true"
      disabled: true
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": null,
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 3000
