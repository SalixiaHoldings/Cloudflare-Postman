$kind: http-example
id: 3ccc577a-1b2c-5bdc-b6ef-ad6c65d5d326
name: Exported file.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/cloud/onramps/{{onramp_id}}/export"
  method: POST
  headers:
    Accept: application/zip
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Disposition: attachment; filename="exported-file.zip"
    Content-Type: application/zip
  body:
    type: text
    content: string
order: 1000
