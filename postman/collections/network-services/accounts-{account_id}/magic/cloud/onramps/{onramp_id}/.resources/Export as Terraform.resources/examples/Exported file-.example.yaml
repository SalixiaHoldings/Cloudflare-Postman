$kind: http-example
id: 7602b10b-ed90-5826-a937-95d2718da865
name: Exported file.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/cloud/onramps/{{onramp_id}}/export"
  method: POST
  headers:
    Accept: application/zip
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Disposition: attachment; filename="exported-file.zip"
    Content-Type: application/zip
  body:
    type: text
    content: string
order: 1000
