$kind: http-example
id: 3c8f31ba-e61e-55d5-ae8f-8e2e35e7c246
name: Exported file.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/cloud/onramps/{{onramp_id}}/export"
  method: POST
  headers:
    Accept: application/zip
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Disposition: attachment; filename="exported-file.zip"
    Content-Type: application/zip
  body:
    type: text
    content: string
order: 1000
