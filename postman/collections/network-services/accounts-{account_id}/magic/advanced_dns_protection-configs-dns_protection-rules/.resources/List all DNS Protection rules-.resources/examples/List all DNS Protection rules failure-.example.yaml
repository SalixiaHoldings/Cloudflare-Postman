$kind: http-example
id: a38fa048-7d84-573a-bf09-680ff6ab2f74
name: List all DNS Protection rules failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/advanced_dns_protection/configs/dns_protection/rules?page=1033&per_page=1033&order=string&direction=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1033"
      description: The page number for pagination. Defaults to 1.
    - key: per_page
      value: "1033"
      description: The number of items per page. Must be between 10 and 1000. Defaults to 25.
    - key: order
      value: string
      description: The field to order by. Defaults to 'prefix'.
    - key: direction
      value: string
      description: The direction of ordering (ASC or DESC). Defaults to 'ASC'.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
