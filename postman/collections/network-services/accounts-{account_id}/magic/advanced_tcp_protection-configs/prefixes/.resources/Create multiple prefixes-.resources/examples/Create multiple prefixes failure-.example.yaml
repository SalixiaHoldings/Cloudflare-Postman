name: Create multiple prefixes failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/advanced_tcp_protection/configs/prefixes/bulk"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      [
        {
          "prefix": "192.0.2.0/24",
          "comment": "{{0__comment}}",
          "excluded": false
        },
        {
          "prefix": "192.0.2.0/24",
          "comment": "{{1__comment}}",
          "excluded": false
        }
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
