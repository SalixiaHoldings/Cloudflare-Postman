name: List all prefixes response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/advanced_tcp_protection/configs/prefixes?page=1033&per_page=1033&order=string&direction=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1033"
      description: The page number for pagination. Defaults to 1.
    - key: per_page
      value: "1033"
      description: The number of items per page. Must be between 10 and 1000. Defaults to 25.
    - key: order
      value: string
      description: The field to order by. Defaults to 'prefix'.
    - key: direction
      value: string
      description: The direction of ordering (ASC or DESC). Defaults to 'ASC'.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
