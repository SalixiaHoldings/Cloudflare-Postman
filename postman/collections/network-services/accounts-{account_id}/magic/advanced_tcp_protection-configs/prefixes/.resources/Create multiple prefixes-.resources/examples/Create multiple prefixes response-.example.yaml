$kind: http-example
id: 71266339-948a-5ab4-b2e0-393aa6fffb8e
name: Create multiple prefixes response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/advanced_tcp_protection/configs/prefixes/bulk"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      [
        {
          "prefix": "192.0.2.0/24",
          "comment": "{{0__comment}}",
          "excluded": false
        },
        {
          "prefix": "192.0.2.0/24",
          "comment": "{{1__comment}}",
          "excluded": false
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
order: 1000
