$kind: http-example
id: 1d66f0eb-52cf-5c9b-82f3-79031ac8c941
name: List all TCP Flow Protection filters failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/advanced_tcp_protection/configs/tcp_flow_protection/filters?mode=string&page=1033&per_page=1033&order=string&direction=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: mode
      value: string
      description: "The mode of the filters to get. Optional. Valid values: 'enabled', 'disabled', 'monitoring'."
    - key: page
      value: "1033"
      description: The page number for pagination. Defaults to 1.
    - key: per_page
      value: "1033"
      description: The number of items per page. Must be between 10 and 1000. Defaults to 25.
    - key: order
      value: string
      description: The field to order by. Defaults to 'prefix'.
    - key: direction
      value: string
      description: The direction of ordering (ASC or DESC). Defaults to 'ASC'.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
