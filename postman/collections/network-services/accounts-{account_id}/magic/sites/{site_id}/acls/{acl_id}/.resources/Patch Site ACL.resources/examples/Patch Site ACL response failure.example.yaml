id: fd2bfb9f-b589-565c-8af8-cdb696d632b5
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/sites/{{site_id}}/acls/{{acl_id}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "description": "Allows local traffic between PIN pads and cash register.",
        "forward_locally": true,
        "lan_1": {
          "lan_id": "{{lan_1__lan_id}}"
        },
        "lan_2": {
          "lan_id": "{{lan_2__lan_id}}"
        },
        "name": "PIN Pad - Cash Register",
        "protocols": [
          "tcp",
          "tcp"
        ],
        "unidirectional": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
