$kind: http-example
id: f6620ba4-7925-511f-af67-bdb6cc14caf6
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/sites/{{site_id}}/acls"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "PIN Pad - Cash Register",
        "lan_1": {
          "lan_id": "{{lan_1__lan_id}}"
        },
        "lan_2": {
          "lan_id": "{{lan_2__lan_id}}"
        },
        "description": "Allows local traffic between PIN pads and cash register.",
        "forward_locally": false,
        "protocols": [
          "icmp",
          "udp"
        ],
        "unidirectional": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
