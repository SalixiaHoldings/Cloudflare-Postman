$kind: http-example
id: cc373a36-8604-56ff-866d-e7b4861ea209
request:
  url: "{{base_url}}/accounts/{{account_id}}/magic/sites/{{site_id}}/acls"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "name": "PIN Pad - Cash Register",
        "lan_1": {
          "lan_id": "{{lan_1__lan_id}}"
        },
        "lan_2": {
          "lan_id": "{{lan_2__lan_id}}"
        },
        "description": "Allows local traffic between PIN pads and cash register.",
        "forward_locally": false,
        "protocols": [
          "tcp",
          "udp"
        ],
        "unidirectional": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
