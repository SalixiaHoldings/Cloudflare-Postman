$kind: http-example
id: 2235f712-43dc-5a11-9a8c-08f5ecb9d0ff
name: Create PCAP request response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/pcaps"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "time_limit": 300,
        "packet_limit": 10000,
        "type": "simple",
        "system": "magic-transit"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
