id: 38b10252-ce13-5161-8025-e56deb9d2f12
name: Create PCAP request response failure (client error).
request:
  url: "{{base_url}}/accounts/{{account_id}}/pcaps"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "time_limit": 300,
        "packet_limit": 10000,
        "type": "simple",
        "system": "magic-transit"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "result": null
      }
order: 2000
