id: dababeb5-a558-5db3-bf8f-efa1ca642c17
name: Create PCAP request response failure (server error).
request:
  url: "{{base_url}}/accounts/{{account_id}}/pcaps"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "time_limit": 300,
        "packet_limit": 10000,
        "type": "simple",
        "system": "magic-transit"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "result": null
      }
order: 3000
