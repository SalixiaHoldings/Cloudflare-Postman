$kind: http-example
id: 84b35453-5f7b-537e-babc-b790626e865d
name: Return a snippet response.
request:
  url: "{{base_url}}/zones/{{zone_id}}/snippets/{{snippet_name}}"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: metadata
        value: '{"main_module":"main.js"}'
        description: (Required) Provide metadata about the snippet.
      - type: file
        key: files
        src: ""
        description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": true,
        "errors": [],
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
