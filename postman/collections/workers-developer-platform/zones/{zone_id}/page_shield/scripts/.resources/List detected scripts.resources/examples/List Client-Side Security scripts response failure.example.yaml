$kind: http-example
id: f7baf299-d95a-58ee-bf03-46216b885576
request:
  url: "{{base_url}}/zones/{{zone_id}}/page_shield/scripts"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: exclude_urls
      value: blog.cloudflare.com,www.example
      disabled: true
    - key: urls
      value: blog.cloudflare.com,www.example
      disabled: true
    - key: hosts
      value: blog.cloudflare.com,www.example*,*cloudflare.com
      disabled: true
    - key: page
      value: string
      disabled: true
    - key: per_page
      value: "100"
      disabled: true
    - key: order_by
      value: first_seen_at
      disabled: true
    - key: direction
      value: asc
      disabled: true
    - key: prioritize_malicious
      value: "true"
      disabled: true
    - key: exclude_cdn_cgi
      value: "true"
      disabled: true
    - key: exclude_duplicates
      value: "true"
      disabled: true
    - key: status
      value: active,inactive
      disabled: true
    - key: page_url
      value: example.com/page,*/checkout,example.com/*,*checkout*
      disabled: true
    - key: export
      value: csv
      disabled: true
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "result": null
      }
order: 2000
