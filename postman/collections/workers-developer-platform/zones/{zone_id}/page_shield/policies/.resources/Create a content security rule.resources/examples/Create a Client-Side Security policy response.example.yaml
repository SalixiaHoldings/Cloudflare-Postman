id: 0c442a33-fd12-5a6f-9cce-73c1581e55bb
request:
  url: "{{base_url}}/zones/{{zone_id}}/page_shield/policies"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "description": "Checkout page CSP policy",
        "action": "allow",
        "expression": "ends_with(http.request.uri.path, \"/checkout\")",
        "enabled": true,
        "value": "script-src 'none';"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
