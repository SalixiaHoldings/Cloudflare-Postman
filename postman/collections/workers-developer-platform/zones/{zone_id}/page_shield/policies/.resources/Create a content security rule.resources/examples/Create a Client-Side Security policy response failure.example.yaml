$kind: http-example
id: dd1d2057-228f-561d-be50-49564bd6b715
request:
  url: "{{base_url}}/zones/{{zone_id}}/page_shield/policies"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "description": "Checkout page CSP policy",
        "action": "allow",
        "expression": "ends_with(http.request.uri.path, \"/checkout\")",
        "enabled": true,
        "value": "script-src 'none';"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "result": null
      }
order: 2000
