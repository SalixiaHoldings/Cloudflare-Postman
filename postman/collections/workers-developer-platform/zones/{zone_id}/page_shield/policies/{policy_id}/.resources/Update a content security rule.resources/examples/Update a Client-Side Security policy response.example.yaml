$kind: http-example
id: cb637ba5-7ab6-500c-bca9-2b0a8574b1a1
request:
  url: "{{base_url}}/zones/{{zone_id}}/page_shield/policies/{{policy_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "action": "allow",
        "description": "Checkout page CSP policy",
        "enabled": true,
        "expression": "ends_with(http.request.uri.path, \"/checkout\")",
        "value": "script-src 'none';"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
