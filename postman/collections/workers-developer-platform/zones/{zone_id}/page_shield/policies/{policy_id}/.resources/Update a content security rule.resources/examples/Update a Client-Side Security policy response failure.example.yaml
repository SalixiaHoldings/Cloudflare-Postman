$kind: http-example
id: 6ddf474c-6f7b-59c2-aeae-41495e6c58cd
request:
  url: "{{base_url}}/zones/{{zone_id}}/page_shield/policies/{{policy_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "action": "allow",
        "description": "Checkout page CSP policy",
        "enabled": true,
        "expression": "ends_with(http.request.uri.path, \"/checkout\")",
        "value": "script-src 'none';"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [],
        "result": null
      }
order: 2000
