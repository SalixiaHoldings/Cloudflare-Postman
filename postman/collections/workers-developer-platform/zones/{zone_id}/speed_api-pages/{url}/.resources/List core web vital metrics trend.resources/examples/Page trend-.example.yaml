$kind: http-example
id: 84b81574-73db-57f0-a7a0-954b6a37909c
name: Page trend.
request:
  url: "{{base_url}}/zones/{{zone_id}}/speed_api/pages/{{url}}/trend?region=us-central1&deviceType=DESKTOP&start=2014-01-01T05:20:00.12345Z&tz=America/Chicago&metrics=performanceScore,ttfb,fcp,si,lcp,tti,tbt,cls"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: region
      value: us-central1
      description: "(Required) "
    - key: deviceType
      value: DESKTOP
      description: "(Required) "
    - key: start
      value: 2014-01-01T05:20:00.12345Z
      description: "(Required) "
    - key: end
      value: 2014-01-01T05:20:00.12345Z
      disabled: true
    - key: tz
      value: America/Chicago
      description: (Required) The timezone of the start and end timestamps.
    - key: metrics
      value: performanceScore,ttfb,fcp,si,lcp,tti,tbt,cls
      description: (Required) A comma-separated list of metrics to include in the results.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
