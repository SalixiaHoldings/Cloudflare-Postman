$kind: http-example
id: 20fb0dfe-2391-5758-a486-992d9a8d1557
name: Returns a list of models. Default shape is the standard envelope; when `format` is supplied the marketplace-specific shape is returned instead.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai/models/search"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: "100"
      disabled: true
    - key: page
      value: "1"
      disabled: true
    - key: task
      value: Text Generation
      disabled: true
      description: Filter by Task Name.
    - key: author
      value: ""
      disabled: true
      description: Filter by Author.
    - key: source
      value: "6526.501139160246"
      disabled: true
      description: Filter by Source Id.
    - key: hide_experimental
      value: "false"
      disabled: true
      description: Filter to hide experimental models.
    - key: search
      value: ""
      disabled: true
      description: Search.
    - key: include_deprecated
      value: "false"
      disabled: true
      description: If true, include models for up to three months after their deprecation date. Defaults to false.
    - key: format
      value: openrouter
      disabled: true
      description: If set, return models in the requested marketplace format instead of the default response.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
