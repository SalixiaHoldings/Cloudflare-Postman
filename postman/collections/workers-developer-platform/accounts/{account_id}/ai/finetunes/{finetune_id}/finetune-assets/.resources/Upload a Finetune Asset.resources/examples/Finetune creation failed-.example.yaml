name: Finetune creation failed.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai/finetunes/{{finetune_id}}/finetune-assets"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
