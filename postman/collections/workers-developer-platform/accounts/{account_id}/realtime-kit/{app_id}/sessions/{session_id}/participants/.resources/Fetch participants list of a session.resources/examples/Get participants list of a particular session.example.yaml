request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/sessions/{{session_id}}/participants"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: search
      value: string
      disabled: true
      description: The search query string. You can search using participant ID, custom participant ID, or display name.
    - key: page_no
      value: "9019.511197693646"
      disabled: true
      description: The page number from which you want your page search results to be displayed.
    - key: per_page
      value: "25"
      disabled: true
      description: Number of results per page.
    - key: sort_order
      value: ASC
      disabled: true
    - key: sort_by
      value: duration
      disabled: true
    - key: include_peer_events
      value: "false"
      disabled: true
      description: if true, response includes all the peer events of participants.
    - key: view
      value: raw
      disabled: true
      description: In breakout room sessions, the view parameter can be set to `raw` for session specific duration for participants or `consolidated` to accumulate breakout room durations.
