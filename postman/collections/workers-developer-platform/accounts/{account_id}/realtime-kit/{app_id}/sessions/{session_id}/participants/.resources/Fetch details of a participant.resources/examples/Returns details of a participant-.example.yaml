$kind: http-example
id: 34eafa67-57a7-5ca7-90e1-00913c87a329
name: Returns details of a participant.
request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/sessions/{{session_id}}/participants/{{participant_id}}"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: include_peer_events
      value: "false"
      disabled: true
      description: if true, response includes all the peer events of participant.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "participant": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "success": true
      }
order: 1000
