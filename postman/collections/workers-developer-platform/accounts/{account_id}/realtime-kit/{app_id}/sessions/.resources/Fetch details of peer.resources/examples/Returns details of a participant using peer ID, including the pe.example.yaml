$kind: http-example
id: 6690e9bd-d7ae-5da3-a726-4466ccc1e141
name: Returns details of a participant using peer ID, including the peer report.
request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/sessions/peer-report/{{peer_id}}"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: filters
      value: device_info
      disabled: true
      description: Filter to apply to the peer report.
    - key: include_peer_events
      value: "false"
      disabled: true
      description: if true, response includes all the peer events of participant.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "participant": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "success": true
      }
order: 1000
