$kind: http-example
id: 524f48e5-f39a-5d71-bace-a16fec150ce9
request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/webhooks"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "All events webhook",
        "url": "https://webhook.site/b23a5bbd-c7b0-4ced-a9e2-78ae7889897e",
        "events": [
          "meeting.started",
          "meeting.ended",
          "meeting.participantJoined",
          "meeting.participantLeft",
          "meeting.chatSynced",
          "recording.statusUpdate",
          "livestreaming.statusUpdate",
          "meeting.transcript",
          "meeting.summary"
        ],
        "enabled": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "\"{\\n  success: false,\\n  error: { code: 400, message: 'BAD_REQUEST: \\\"name\\\" is required' }\\n}\\n\""
order: 2000
