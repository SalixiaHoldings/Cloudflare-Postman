$kind: http-example
id: 07905b0c-97fc-5229-8913-68d338181105
request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/webhooks"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "All events webhook",
        "url": "https://webhook.site/b23a5bbd-c7b0-4ced-a9e2-78ae7889897e",
        "events": [
          "meeting.started",
          "meeting.ended",
          "meeting.participantJoined",
          "meeting.participantLeft",
          "meeting.chatSynced",
          "recording.statusUpdate",
          "livestreaming.statusUpdate",
          "meeting.transcript",
          "meeting.summary"
        ],
        "enabled": true
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '"{\n  message: \"Unauthorized\"\n}\n"'
order: 3000
