request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/{{app_id}}/recordings"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: meeting_id
      value: 1a0e9cf2-ae97-9863-a7d4-8bc8db3254ba
