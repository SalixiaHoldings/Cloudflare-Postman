$kind: http-example
id: cc789cfe-7c6c-51c5-a963-0a0c7fb69cc1
request:
  url: "{{base_url}}/accounts/{{account_id}}/realtime/kit/apps?page_no=1&per_page=20&search=string&sort_order=DESC"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page_no
      value: "1"
      description: The page number from which you want your page search results to be displayed.
    - key: per_page
      value: "20"
      description: Number of results per page.
    - key: search
      value: string
      description: Search string that matches apps by name.
    - key: sort_order
      value: DESC
      description: Sort order for apps by creation time.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "created_at": "2025-01-01T08:16:40.644Z",
            "id": "14a396e7-ca44-4937-bf1f-050a69118543",
            "name": "my-first-app"
          }
        ],
        "paging": {
          "end_offset": 1,
          "start_offset": 1,
          "total_count": 1
        },
        "success": true
      }
order: 1000
