$kind: http-example
id: cd82005e-31fa-5d33-a7cc-361100684684
name: Connect project source response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/pages/projects/{{project_name}}/source"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "type": "github",
        "config": {
          "deployments_enabled": true,
          "owner": "my-org",
          "owner_id": "12345678",
          "path_excludes": [
            "{{config__path_excludes__0}}",
            "{{config__path_excludes__1}}"
          ],
          "path_includes": [
            "{{config__path_includes__0}}",
            "{{config__path_includes__1}}"
          ],
          "pr_comments_enabled": false,
          "preview_branch_excludes": [
            "{{config__preview_branch_excludes__0}}",
            "{{config__preview_branch_excludes__1}}"
          ],
          "preview_branch_includes": [
            "{{config__preview_branch_includes__0}}",
            "{{config__preview_branch_includes__1}}"
          ],
          "preview_deployment_setting": "all",
          "production_branch": "main",
          "production_deployments_enabled": false,
          "repo_id": "12345678",
          "repo_name": "my-repo"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
