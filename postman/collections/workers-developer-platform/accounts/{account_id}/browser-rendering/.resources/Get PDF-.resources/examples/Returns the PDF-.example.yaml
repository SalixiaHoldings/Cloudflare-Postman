$kind: http-example
id: f753a64d-6f21-5e6a-8001-5f0e62e5a76c
name: Returns the PDF.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/pdf"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/pdf
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: cacheTTL
      value: "5"
      disabled: true
      description: Cache TTL default is 5s. Set to 0 to disable.
  body:
    type: json
    content: |-
      {
        "url": "https://www.example.com/"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/pdf
  body:
    type: text
    content: string
order: 1000
