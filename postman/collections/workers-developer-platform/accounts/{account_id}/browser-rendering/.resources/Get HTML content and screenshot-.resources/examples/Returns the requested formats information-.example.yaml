  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: cacheTTL
      value: "5"
      description: Cache TTL default is 5s. Set to 0 to disable.
  body:
    type: json
    content: |-
      {
        "formats": [
          "content",
          "screenshot"
        ],
        "url": "https://www.example.com/"
      }
