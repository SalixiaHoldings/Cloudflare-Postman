$kind: http-example
id: 55e68771-04ae-5b91-b7b1-cd9f08abf9b7
name: Returns the session details.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/devtools/session/{{session_id}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "sessionId": "9bc0c0bb-699d-3668-42ef-e6a792214594",
        "closeReason": 6195.752650965005,
        "closeReasonText": "string",
        "connectionEndTime": 7561.073424294591,
        "connectionId": "string",
        "connectionStartTime": 7626.223457045853,
        "devtoolsFrontendUrl": "string",
        "endTime": 4137.430440168828,
        "lastUpdated": 3523.26002670452,
        "startTime": 3379.928399808705,
        "webSocketDebuggerUrl": "string"
      }
order: 1000
