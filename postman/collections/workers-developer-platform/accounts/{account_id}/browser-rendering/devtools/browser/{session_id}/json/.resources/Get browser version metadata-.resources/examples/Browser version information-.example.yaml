$kind: http-example
id: b0c89d18-b1a9-568c-945d-a178e8667341
name: Browser version information.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/devtools/browser/{{session_id}}/json/version"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "Browser": "string",
        "Protocol-Version": "string",
        "User-Agent": "string",
        "V8-Version": "string",
        "WebKit-Version": "string",
        "webSocketDebuggerUrl": "string"
      }
order: 1000
