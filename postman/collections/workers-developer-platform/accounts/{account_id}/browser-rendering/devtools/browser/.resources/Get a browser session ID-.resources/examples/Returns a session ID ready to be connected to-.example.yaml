$kind: http-example
id: ae8aa0c3-d0d4-55ff-b6f7-2f24c77d6606
name: Returns a session ID ready to be connected to.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/devtools/browser"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: keep_alive
      value: "60000"
      disabled: true
      description: Keep-alive time in milliseconds.
    - key: lab
      value: "false"
      disabled: true
      description: Use experimental browser.
    - key: targets
      value: "false"
      disabled: true
      description: Include browser targets in response.
    - key: liveViewUrlExpiresInMs
      value: "300000"
      disabled: true
      description: How long the live view URL remains valid, in milliseconds (max 60 minutes). Only used when targets is true.
    - key: recording
      value: "false"
      disabled: true
  body:
    type: json
    content: |-
      {
        "guardrails": {
          "allowedDomainSets": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ],
          "allowedDomains": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "sessionId": "string",
        "webSocketDebuggerUrl": "string"
      }
order: 1000
