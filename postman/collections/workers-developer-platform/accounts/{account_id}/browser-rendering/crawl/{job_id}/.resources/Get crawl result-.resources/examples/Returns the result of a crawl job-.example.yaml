$kind: http-example
id: 573369f4-b2c4-55fe-83f5-a395889985eb
name: Returns the result of a crawl job.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/crawl/{{job_id}}?cacheTTL=5&status=disallowed&cursor=0&limit=50"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: cacheTTL
      value: "5"
      description: Cache TTL default is 5s. Set to 0 to disable.
    - key: status
      value: disallowed
      description: Filter by URL status.
    - key: cursor
      value: "0"
      description: Cursor for pagination.
    - key: limit
      value: "50"
      description: Limit for pagination.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
