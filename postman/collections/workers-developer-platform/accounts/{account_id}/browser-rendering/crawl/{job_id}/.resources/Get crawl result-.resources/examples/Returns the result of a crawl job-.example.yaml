$kind: http-example
id: 6099c8f9-40bc-5f8a-8e1a-48cc63dee9ac
name: Returns the result of a crawl job.
request:
  url: "{{base_url}}/accounts/{{account_id}}/browser-rendering/crawl/{{job_id}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: cacheTTL
      value: "5"
      disabled: true
      description: Cache TTL default is 5s. Set to 0 to disable.
    - key: status
      value: cancelled
      disabled: true
      description: Filter by URL status.
    - key: cursor
      value: "0"
      disabled: true
      description: Cursor for pagination.
    - key: limit
      value: "50"
      disabled: true
      description: Limit for pagination.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
