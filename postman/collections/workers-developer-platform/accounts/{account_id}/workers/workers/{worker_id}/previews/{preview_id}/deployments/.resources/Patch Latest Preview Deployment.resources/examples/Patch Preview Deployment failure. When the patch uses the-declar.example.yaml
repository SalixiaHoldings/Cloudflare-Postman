$kind: http-example
id: 3a2574a7-afc2-504d-a39d-680ab87faada
name: |
  Patch Preview Deployment failure. When the patch uses the
  declarative `exports` field and one or more entries fail
  reconciliation, the response is the exports reconciliation
  error envelope (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/workers/{{worker_id}}/previews/{{preview_id}}/deployments/latest"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: ignore_defaults
      value: "true"
      disabled: true
  body:
    type: json
    content: |-
      {
        "cache_options": {
          "enabled": true
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
