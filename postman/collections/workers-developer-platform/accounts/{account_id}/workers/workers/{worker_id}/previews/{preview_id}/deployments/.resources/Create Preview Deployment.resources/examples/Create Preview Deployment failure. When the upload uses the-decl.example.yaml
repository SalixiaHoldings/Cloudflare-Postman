$kind: http-example
id: 5c8e6e7f-6d20-5b33-914c-81a73650ae7f
name: |
  Create Preview Deployment failure. When the upload uses the
  declarative `exports` field and one or more entries fail
  reconciliation, the response is the exports reconciliation
  error envelope (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/workers/{{worker_id}}/previews/{{preview_id}}/deployments"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  queryParams:
    - key: ignore_defaults
      value: "false"
      disabled: true
  body:
    type: formdata
    content:
      - type: text
        key: metadata
        value: '{"cache_options":{"enabled":true}}'
        contentType: application/json
        description: "(Required) "
      - type: file
        key: files
        src: ""
        description: |
          Code, sourcemaps, and other content used at runtime. Each
          part's filename is the module name. Sourcemaps use
          `application/source-map`.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
