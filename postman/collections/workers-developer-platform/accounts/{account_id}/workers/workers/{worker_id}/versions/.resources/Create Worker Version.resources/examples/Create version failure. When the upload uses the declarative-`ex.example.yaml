$kind: http-example
id: 485192a0-bedc-5b05-bdd1-3f63f8683649
name: |
  Create version failure. When the upload uses the declarative
  `exports` field and one or more entries fail reconciliation,
  the response is the exports reconciliation error envelope
  (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/workers/{{worker_id}}/versions"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: deploy
      value: "true"
      disabled: true
  body:
    type: json
    content: |-
      {
        "annotations": {
          "workers/message": "Fixed bug.",
          "workers/tag": "v1.0.1"
        },
        "assets": {
          "config": {
            "run_worker_first": false
          },
          "jwt": "string"
        },
        "bindings": [
          {
            "name": "MY_ENV_VAR",
            "text": "my_data",
            "type": "plain_text"
          }
        ],
        "cache_options": {
          "enabled": true
        },
        "compatibility_date": "2021-01-01T00:00:00Z",
        "compatibility_flags": [
          "nodejs_compat"
        ],
        "containers": [
          {
            "class_name": "MyDurableObject"
          }
        ],
        "limits": {
          "cpu_ms": 50,
          "subrequests": 1000
        },
        "main_module": "index.js",
        "usage_model": "standard"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
