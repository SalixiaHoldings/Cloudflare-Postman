$kind: http-example
id: afca54c6-3989-52e3-8162-98829dde0d3b
name: |
  Patch version failure. When the patch uses the declarative
  `exports` field and one or more entries fail reconciliation,
  the response is the exports reconciliation error envelope
  (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/workers/{{worker_id}}/versions/latest"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: deploy
      value: "true"
      disabled: true
  body:
    type: json
    content: |-
      {
        "cache_options": {
          "enabled": true
        },
        "placement": {
          "mode": "smart"
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
