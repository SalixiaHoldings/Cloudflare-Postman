$kind: http-example
id: 3a483bcf-5a4c-50c7-848b-301e50f64182
name: Too many requests are currently modifying the script.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/secrets-bulk"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "secrets": {
          "key_0": {
            "name": "myBinding",
            "type": "secret_text",
            "text": "My secret."
          }
        },
        "version_tags": {
          "key_0": true,
          "key_1": false
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
