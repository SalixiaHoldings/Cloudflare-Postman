name: Too many requests are currently modifying the script.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/secrets-bulk"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "secrets": {
          "key_0": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "version_tags": {
          "key_0": true,
          "key_1": false
        }
      }
