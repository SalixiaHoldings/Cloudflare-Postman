name: List scripts in namespace response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: tags
      value: production:yes,staging:no
      disabled: true
      description: "Filter scripts by tags. Format: comma-separated list of tag:allowed pairs where allowed is 'yes' or 'no'."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
