$kind: http-example
id: aa272d35-80e0-5a1a-bc8c-7dc0c5afa3b0
name: Get script content.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/content"
  method: GET
  headers:
    Accept: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: string
  body:
    type: text
    content: |
      export default {
        async fetch(request, env, ctx) {
          return new Response("Hello, world!");
        }
      };
order: 1000
