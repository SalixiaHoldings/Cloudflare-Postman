name: |
  Patch script settings failure. When the patch uses the
  declarative `exports` field and one or more entries fail
  reconciliation, the response is the exports reconciliation
  error envelope (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/settings"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: settings
        value: '{"bindings":{"value":"<Error: Too many levels of nesting to fake this schema>"},"cache_options":{"value":"<Error: Too many levels of nesting to fake this schema>"},"compatibility_date":{"value":"<Error: Too many levels of nesting to fake this schema>"},"compatibility_flags":{"value":"<Error: Too many levels of nesting to fake this schema>"},"exports":{"value":"<Error: Too many levels of nesting to fake this schema>"},"exports_reconciliation":{"value":"<Error: Too many levels of nesting to fake this schema>"},"limits":{"value":"<Error: Too many levels of nesting to fake this schema>"},"logpush":{"value":"<Error: Too many levels of nesting to fake this schema>"},"migrations":{"value":"<Error: Too many levels of nesting to fake this schema>"},"observability":{"value":"<Error: Too many levels of nesting to fake this schema>"},"placement":{"value":"<Error: Too many levels of nesting to fake this schema>"},"tags":{"value":"<Error: Too many levels of nesting to fake this schema>"},"tail_consumers":{"value":"<Error: Too many levels of nesting to fake this schema>"},"usage_model":{"value":"<Error: Too many levels of nesting to fake this schema>"}}'
        contentType: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
