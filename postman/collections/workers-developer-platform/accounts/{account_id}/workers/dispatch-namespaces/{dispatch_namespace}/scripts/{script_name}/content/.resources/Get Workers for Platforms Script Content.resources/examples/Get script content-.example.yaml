$kind: http-example
id: 899926b6-e9d7-5f82-a379-291c849b2a6d
name: Get script content.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/content"
  method: GET
  headers:
    Accept: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: string
  body:
    type: text
    content: |
      export default {
        async fetch(request, env, ctx) {
          return new Response("Hello, world!");
        }
      };
order: 1000
