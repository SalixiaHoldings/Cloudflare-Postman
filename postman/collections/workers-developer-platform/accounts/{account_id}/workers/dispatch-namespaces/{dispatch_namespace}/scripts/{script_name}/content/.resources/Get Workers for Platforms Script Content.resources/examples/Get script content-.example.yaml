$kind: http-example
id: fd6bee5f-dafd-51e4-8e08-ba150b5c8b6b
name: Get script content.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/content"
  method: GET
  headers:
    Accept: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: string
  body:
    type: text
    content: |
      export default {
        async fetch(request, env, ctx) {
          return new Response("Hello, world!");
        }
      };
order: 1000
