$kind: http-example
id: c4b0ee34-d0ac-54d3-b6fa-2afc4ae95b70
name: Get script content.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts/{{script_name}}/content"
  method: GET
  headers:
    Accept: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: string
  body:
    type: text
    content: |
      export default {
        async fetch(request, env, ctx) {
          return new Response("Hello, world!");
        }
      };
order: 1000
