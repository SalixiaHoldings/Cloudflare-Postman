$kind: http-example
id: f1fe6e09-3846-51d3-82b6-dfc2c69213e5
name: Delete scripts in namespace response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/dispatch/namespaces/{{dispatch_namespace}}/scripts"
  method: DELETE
  headers:
    Accept: application/json
  queryParams:
    - key: tags
      value: production:yes,staging:no
      disabled: true
      description: "Filter scripts by tags before deletion. Format: comma-separated list of tag:allowed pairs where allowed is 'yes' or 'no'."
    - key: limit
      value: "1000"
      disabled: true
      description: Limit the number of scripts to delete.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
