$kind: http-example
id: d34d8f0a-ddb3-59d5-a260-f8de63ca798b
name: |
  Patch script settings failure. When the patch uses the
  declarative `exports` field and one or more entries fail
  reconciliation, the response is the exports reconciliation
  error envelope (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/services/{{service_name}}/environments/{{environment_name}}/settings"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
        "result": {},
        "success": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
