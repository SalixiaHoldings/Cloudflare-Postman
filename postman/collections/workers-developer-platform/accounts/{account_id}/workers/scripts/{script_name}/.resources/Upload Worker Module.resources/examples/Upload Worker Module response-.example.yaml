$kind: http-example
id: 73bce5a5-1f41-5b28-903b-121c613aaf89
name: Upload Worker Module response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  queryParams:
    - key: bindings_inherit
      value: strict
      disabled: true
      description: When set to "strict", the upload will fail if any `inherit` type bindings cannot be resolved against the previous version of the Worker. Without this, unresolvable inherit bindings are silently dropped.
  body:
    type: formdata
    content:
      - type: file
        key: files
        src: ""
        description: undefined
      - type: text
        key: metadata
        value: '{"compatibility_flags":["nodejs_compat"],"main_module":"worker.js"}'
        contentType: application/json
        description: undefined
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [],
        "messages": [],
