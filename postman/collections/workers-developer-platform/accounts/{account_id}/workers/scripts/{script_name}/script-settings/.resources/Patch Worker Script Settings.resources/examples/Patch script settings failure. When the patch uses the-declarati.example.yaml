$kind: http-example
id: 1c8a16b4-62f9-5302-975f-9b26586cdd5c
name: |
  Patch script settings failure. When the patch uses the
  declarative `exports` field and one or more entries fail
  reconciliation, the response is the exports reconciliation
  error envelope (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/script-settings"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "logpush": false,
        "observability": {},
        "tags": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ],
        "tail_consumers": [
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          },
          {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
