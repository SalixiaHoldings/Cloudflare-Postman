name: Create Deployment response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/deployments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: force
      value: "true"
      disabled: true
      description: If set to true, the deployment will be created even if normally blocked by something such rolling back to an older version when a secret has changed.
  body:
    type: json
    content: |-
      {
        "strategy": "percentage",
        "versions": [
          {
            "version_id": "string",
            "percentage": 100
          },
          {
            "version_id": "string",
            "percentage": 100
          }
        ],
        "annotations": {
          "workers/message": "Deploy bug fix."
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
