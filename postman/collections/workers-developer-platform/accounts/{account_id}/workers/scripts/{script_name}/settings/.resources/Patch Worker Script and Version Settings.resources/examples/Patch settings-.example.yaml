$kind: http-example
id: 17bec3db-a36c-52c1-8568-22085af9d9d1
name: Patch settings.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/settings"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: settings
        value: '{"cache_options":{"enabled":true},"observability":{"enabled":true}}'
        contentType: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
