$kind: http-example
id: 213d0a06-4459-5e92-8070-0a0caa1a9e09
name: Patch settings.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/settings"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: settings
        value: '{"cache_options":{"enabled":true},"observability":{"enabled":true}}'
        contentType: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
