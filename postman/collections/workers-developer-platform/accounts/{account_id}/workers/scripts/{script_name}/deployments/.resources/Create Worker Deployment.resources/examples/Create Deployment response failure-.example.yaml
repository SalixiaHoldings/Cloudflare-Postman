$kind: http-example
id: f64b17b3-6e01-5c4f-b454-1ef306380e70
name: Create Deployment response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/deployments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: force
      value: "true"
      disabled: true
      description: If set to true, the deployment will be created even if normally blocked by something such rolling back to an older version when a secret has changed.
  body:
    type: json
    content: |-
      {
        "strategy": "percentage",
        "versions": [
          {
            "version_id": "{{versions__0__version_id}}",
            "percentage": 100
          },
          {
            "version_id": "{{versions__1__version_id}}",
            "percentage": 100
          }
        ],
        "annotations": {
          "workers/message": "Deploy bug fix."
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
