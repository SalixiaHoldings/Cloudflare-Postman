$kind: http-example
id: c6402683-cbfe-580d-b3dd-8d58bb33c14d
name: Create Deployment response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/deployments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: force
      value: "true"
      disabled: true
      description: If set to true, the deployment will be created even if normally blocked by something such rolling back to an older version when a secret has changed.
  body:
    type: json
    content: |-
      {
        "strategy": "percentage",
        "versions": [
          {
            "percentage": 100,
            "version_id": "023e105f-2a42-4f8b-a1c1-73f6a2a30c0f"
          }
        ],
        "annotations": {
          "workers/message": "Deploy bug fix."
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
