$kind: http-example
id: cb4d8e06-f55d-5a0b-9b46-c0de3b23a94e
name: Too many requests are currently modifying the script.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/secrets-bulk"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "secrets": {
          "key_0": {
            "value": "<Error: Too many levels of nesting to fake this schema>"
          }
        },
        "version_tags": {
          "key_0": true,
          "key_1": false
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
