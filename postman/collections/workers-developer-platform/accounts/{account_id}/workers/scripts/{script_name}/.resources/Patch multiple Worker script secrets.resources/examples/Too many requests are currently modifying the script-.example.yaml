name: Too many requests are currently modifying the script.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/secrets-bulk"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "version_tags": {
          "key_0": true,
          "key_1": false
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
