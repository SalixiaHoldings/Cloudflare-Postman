$kind: http-example
id: f51eeaa1-c9da-50a6-8e8c-a1ec72a3fd40
name: Worker successfully downloaded. Returns script content as a multipart form, with no metadata part and no JSON encoding applied.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}"
  method: GET
  headers:
    Accept: application/javascript
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/javascript
  body:
    type: text
    content: |
      export default {
        async fetch(request, env, ctx) {
          return new Response("Hello, world!");
        }
      };
order: 1000
