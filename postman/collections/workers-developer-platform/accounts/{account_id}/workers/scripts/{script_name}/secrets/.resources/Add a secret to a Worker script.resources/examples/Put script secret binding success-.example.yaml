name: Put script secret binding success.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/secrets"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "myBinding",
        "type": "secret_text",
        "text": "My secret."
      }
