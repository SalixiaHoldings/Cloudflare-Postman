name: Patch script secrets bulk success.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/secrets-bulk"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "secrets": {
          "key_0": {
            "name": "myBinding",
            "type": "secret_text",
            "text": "My secret."
          }
        },
        "version_tags": {
          "key_0": true,
          "key_1": false
        }
      }
