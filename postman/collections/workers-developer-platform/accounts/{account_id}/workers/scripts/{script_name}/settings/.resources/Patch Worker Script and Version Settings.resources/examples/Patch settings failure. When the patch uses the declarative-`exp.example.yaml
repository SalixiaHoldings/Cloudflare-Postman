$kind: http-example
id: 20d4b8b6-1c5b-50f9-812b-8315b91c2cf5
name: |
  Patch settings failure. When the patch uses the declarative
  `exports` field and one or more entries fail reconciliation,
  the response is the exports reconciliation error envelope
  (error code 100402) with per-class detail in
  `errors[].meta.details`.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workers/scripts/{{script_name}}/settings"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: settings
        value: '{"cache_options":{"enabled":true},"observability":{"enabled":true}}'
        contentType: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 2000
