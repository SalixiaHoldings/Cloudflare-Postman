$kind: http-example
id: 19033646-f406-52c7-aa88-0434629e6762
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/tokens?page=1&per_page=50"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: Page number for pagination
    - key: per_page
      value: "50"
      description: Number of items per page
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
