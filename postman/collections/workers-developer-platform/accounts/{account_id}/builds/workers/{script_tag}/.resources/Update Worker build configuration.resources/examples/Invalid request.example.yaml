$kind: http-example
id: 63917f95-ae6b-53a2-b2ed-005ef36c1815
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/workers/{{script_tag}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: patch_existing_previews
      value: "false"
      disabled: true
      description: Apply a previews_base_config patch to every existing Preview of the Worker as well as to the base config.
  body:
    type: json
    content: |-
      {
        "production_settings": {
          "build_command": "npm run build:production",
          "deploy_command": "npx wrangler deploy --env production"
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12002,
            "message": "Invalid request body"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
