$kind: http-example
id: b17ee58d-4cda-511c-b397-13e12af458ed
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/workers/{{script_tag}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: patch_existing_previews
      value: "false"
      disabled: true
      description: Apply a previews_base_config patch to every existing Preview of the Worker as well as to the base config.
  body:
    type: json
    content: |-
      {
        "production_settings": {
          "build_command": "npm run build:production",
          "deploy_command": "npx wrangler deploy --env production"
        }
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12000,
            "message": "Not found"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 4000
