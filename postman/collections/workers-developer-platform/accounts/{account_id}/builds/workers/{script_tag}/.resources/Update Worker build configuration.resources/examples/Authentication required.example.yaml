$kind: http-example
id: 52d369be-7d9f-52a5-829a-5a707e7e6dec
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/workers/{{script_tag}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "production_settings": {
          "build_command": "npm run build:production",
          "deploy_command": "npx wrangler deploy --env production"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
