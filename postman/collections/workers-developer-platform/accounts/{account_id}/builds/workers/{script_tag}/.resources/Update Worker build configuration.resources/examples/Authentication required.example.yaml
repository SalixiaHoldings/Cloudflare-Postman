$kind: http-example
id: c0f98ddd-2ec8-5861-a826-0b58f933f071
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/workers/{{script_tag}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "production_settings": {
          "build_command": "npm run build:production",
          "deploy_command": "npx wrangler deploy --env production"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
