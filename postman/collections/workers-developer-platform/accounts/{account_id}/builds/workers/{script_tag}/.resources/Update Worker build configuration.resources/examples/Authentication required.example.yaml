$kind: http-example
id: 775b7c45-13af-552d-9e0e-6e83f7060aa6
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/workers/{{script_tag}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: patch_existing_previews
      value: "false"
      disabled: true
      description: Apply a previews_base_config patch to every existing Preview of the Worker as well as to the base config.
  body:
    type: json
    content: |-
      {
        "production_settings": {
          "build_command": "npm run build:production",
          "deploy_command": "npx wrangler deploy --env production"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
