  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12049,
            "message": "Resource already exists"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
