id: 327a073b-8ce9-5d25-b312-eca25c019dc7
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/triggers/{{trigger_uuid}}/environment_variables"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "API_KEY": "{{api_key}}",
        "NODE_ENV": {
          "is_secret": "{{is_secret}}",
          "value": "production"
        }
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12000,
            "message": "Not found"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
