$kind: http-example
id: 419851c1-5520-556c-af3f-5e727c3359b2
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/triggers/{{trigger_uuid}}"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "branch_includes": [
          "main"
        ],
        "build_caching_enabled": false,
        "build_command": "npm run build",
        "build_token_uuid": "{{build_token_uuid}}",
        "deploy_command": "npx wrangler deploy",
        "path_excludes": [
          "*.md"
        ],
        "path_includes": [
          "*"
        ],
        "root_directory": "/",
        "trigger_name": "Production Deploy"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12000,
            "message": "Not found"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 3000
