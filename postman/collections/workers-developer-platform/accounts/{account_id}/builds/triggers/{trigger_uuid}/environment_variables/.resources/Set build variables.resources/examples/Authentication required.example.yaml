$kind: http-example
id: b8963b79-5b42-5ff7-8733-f39595d9a3bc
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/triggers/{{trigger_uuid}}/environment_variables"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "API_KEY": "{{api_key}}",
        "NODE_ENV": {
          "is_secret": "{{is_secret}}",
          "value": "production"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
