$kind: http-example
id: 409a66dd-ab25-527a-8539-c5a3d31e38d5
request:
  url: "{{base_url}}/accounts/{{account_id}}/builds/triggers/{{trigger_uuid}}/environment_variables"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "API_KEY": {
          "is_secret": true,
          "value": "secret-key"
        },
        "NODE_ENV": {
          "is_secret": false,
          "value": "production"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 12005,
            "message": "Missing token from authorization header"
          }
        ],
        "messages": [],
        "result": null,
        "success": false
      }
order: 2000
