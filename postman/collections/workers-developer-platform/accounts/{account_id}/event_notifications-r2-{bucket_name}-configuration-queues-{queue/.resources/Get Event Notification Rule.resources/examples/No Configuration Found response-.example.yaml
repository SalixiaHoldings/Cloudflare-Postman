$kind: http-example
id: 81750b1d-5278-555a-bede-89928fc2c9c5
name: No Configuration Found response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/event_notifications/r2/{{bucket_name}}/configuration/queues/{{queue_id}}"
  method: GET
  headers:
    - key: cf-r2-jurisdiction
      value: default
      description: Jurisdiction where objects in this bucket are guaranteed to be stored.
    - key: Accept
      value: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 11015,
            "message": "workers.api.error.no_configs_found_for_bucket"
          }
        ],
        "messages": [
          "Request failed."
        ],
        "result": null,
        "success": false
      }
order: 2000
