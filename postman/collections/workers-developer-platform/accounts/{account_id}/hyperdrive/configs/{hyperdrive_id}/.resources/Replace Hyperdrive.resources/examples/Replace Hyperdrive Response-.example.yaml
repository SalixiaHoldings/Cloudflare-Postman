      {
        "name": "example-hyperdrive",
        "origin": {
          "scheme": "postgres",
          "database": "postgres",
          "user": "postgres",
          "password": "{{password}}",
          "host": "database.example.com",
          "port": 5432
        },
        "origin_connection_limit": 60
      }
