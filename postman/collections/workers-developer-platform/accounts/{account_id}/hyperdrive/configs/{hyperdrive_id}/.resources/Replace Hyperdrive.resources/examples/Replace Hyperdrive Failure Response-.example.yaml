$kind: http-example
id: ad821974-8c44-55d4-9aba-8a9317fb4914
name: Replace Hyperdrive Failure Response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/hyperdrive/configs/{{hyperdrive_id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "example-hyperdrive",
        "origin": {
          "scheme": "postgres",
          "database": "postgres",
          "user": "postgres",
          "password": "{{origin__password}}",
          "host": "database.example.com",
          "port": 5432
        },
        "origin_connection_limit": 60
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": null
      }
order: 2000
