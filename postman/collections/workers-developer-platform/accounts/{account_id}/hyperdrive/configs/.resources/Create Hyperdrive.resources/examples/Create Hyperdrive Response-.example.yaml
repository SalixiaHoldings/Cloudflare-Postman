id: 185c2bc8-57ab-5517-99c8-1649c3d1340e
name: Create Hyperdrive Response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/hyperdrive/configs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "example-hyperdrive",
        "origin": {
          "scheme": "postgres",
          "database": "postgres",
          "user": "postgres",
          "password": "{{origin__password}}",
          "host": "database.example.com",
          "port": 5432
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
