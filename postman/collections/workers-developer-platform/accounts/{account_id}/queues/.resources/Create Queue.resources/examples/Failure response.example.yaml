  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "success": false
      }
