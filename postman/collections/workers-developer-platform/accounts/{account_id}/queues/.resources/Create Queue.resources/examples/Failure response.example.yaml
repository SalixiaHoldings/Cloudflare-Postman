request:
  url: "{{base_url}}/accounts/{{account_id}}/queues"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "queue_name": "example-queue",
        "jurisdiction": "eu"
      }
