            }
          },
          "source_id": "string",
          "last_seen_at": "1944-04-04T08:07:21.999Z",
          "created_at": "1976-06-15T22:14:05.876Z",
          "error": "string",
          "warnings": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ]
        }
      }
order: 1000
