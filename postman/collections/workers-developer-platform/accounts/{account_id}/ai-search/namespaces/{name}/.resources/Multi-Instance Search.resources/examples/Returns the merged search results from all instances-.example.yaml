name: Returns the merged search results from all instances.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai-search/namespaces/{{name}}/search"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "ai_search_options": {
          "instance_ids": [
            "my-ai-search"
          ],
          "custom_metadata": {
            "test": true,
            "user_id": "user-123"
          }
        },
        "query": "string"
      }
