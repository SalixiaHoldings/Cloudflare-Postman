$kind: http-example
id: 7227f79b-be19-5df2-ab1d-8a41351f8433
name: Returns the updated token.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai-search/tokens/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "my-token",
        "cf_api_id": "a1b2c3d4e5f6",
        "cf_api_key": "{{cf_api_key}}",
        "legacy": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "id": "a4192f17-7491-157e-6d9e-5791679f8c36",
          "name": "string",
          "cf_api_id": "string",
          "created_at": "1936-02-17T08:32:16.753Z",
          "modified_at": "1929-06-15T17:25:11.598Z",
          "created_by": "string",
          "enabled": true,
          "legacy": true,
          "modified_by": "string"
        }
      }
order: 1000
