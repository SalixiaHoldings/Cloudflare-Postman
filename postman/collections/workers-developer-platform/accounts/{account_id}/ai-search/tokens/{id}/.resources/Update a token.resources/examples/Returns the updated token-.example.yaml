$kind: http-example
id: ffff20cf-2286-5824-98f5-415a400aa26f
name: Returns the updated token.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai-search/tokens/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "my-token",
        "cf_api_id": "a1b2c3d4e5f6",
        "cf_api_key": "{{cf_api_key}}",
        "legacy": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "id": "3e47d63e-419f-f94a-5160-b573bda4b55e",
          "name": "string",
          "cf_api_id": "string",
          "created_at": "1970-11-10T23:13:54.702Z",
          "modified_at": "1923-06-30T16:05:26.870Z",
          "created_by": "string",
          "enabled": true,
          "legacy": true,
          "modified_by": "string"
        }
      }
order: 1000
