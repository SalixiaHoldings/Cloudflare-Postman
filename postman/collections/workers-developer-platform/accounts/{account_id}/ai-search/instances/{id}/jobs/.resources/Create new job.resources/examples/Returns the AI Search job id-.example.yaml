    type: json
    content: |-
      {
        "success": true,
        "result": {
          "id": "string",
          "source": "schedule",
          "description": "string",
          "end_reason": "string",
          "ended_at": "string",
          "last_seen_at": "string",
          "started_at": "string"
        }
      }
order: 1000
