id: dabfa19c-1189-522a-8975-420a5d6e8d73
name: Returns the AI Search job id.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai-search/instances/{{id}}/jobs"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "description": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
