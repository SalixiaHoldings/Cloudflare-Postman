name: Returns the search results.
request:
  url: "{{base_url}}/accounts/{{account_id}}/ai-search/instances/{{id}}/search"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "ai_search_options": {
          "custom_metadata": {
            "test": true,
            "user_id": "user-123"
          }
        },
        "query": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "result": {
          "query_kind": "text",
          "chunks": [
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          ],
          "search_query": "string"
        }
      }
order: 1000
