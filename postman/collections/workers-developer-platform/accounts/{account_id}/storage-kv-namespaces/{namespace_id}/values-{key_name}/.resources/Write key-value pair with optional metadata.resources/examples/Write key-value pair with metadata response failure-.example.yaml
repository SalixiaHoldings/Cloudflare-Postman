$kind: http-example
id: 6f0d56e3-9cd6-5807-93dc-53a9980b49c2
name: Write key-value pair with metadata response failure.
request:
  url: "{{base_url}}/accounts/{{account_id}}/storage/kv/namespaces/{{namespace_id}}/values/{{key_name}}"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  queryParams:
    - key: expiration
      value: "1578435000"
      disabled: true
    - key: expiration_ttl
      value: "300"
      disabled: true
  body:
    type: formdata
    content:
      - type: text
        key: value
        value: Some Value
        description: "(Required) "
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "errors": [
          {
            "code": 7003,
            "message": "No route for the URI"
          }
        ],
        "messages": [],
        "result": {}
      }
order: 2000
