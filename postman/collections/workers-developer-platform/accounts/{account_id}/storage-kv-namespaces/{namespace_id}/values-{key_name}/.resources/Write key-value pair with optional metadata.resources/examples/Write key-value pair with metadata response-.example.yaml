$kind: http-example
id: c1f83a15-1e6a-5d8e-88b9-13ba6462f1e6
name: Write key-value pair with metadata response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/storage/kv/namespaces/{{namespace_id}}/values/{{key_name}}"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  queryParams:
    - key: expiration
      value: "1578435000"
      disabled: true
    - key: expiration_ttl
      value: "300"
      disabled: true
  body:
    type: formdata
    content:
      - type: text
        key: value
        value: Some Value
        description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "errors": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "messages": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        },
        "result": {}
      }
order: 1000
