$kind: http-example
id: d1a9af9d-4951-5eda-944c-44187aaec024
name: Get multiple key-value pairs response.
request:
  url: "{{base_url}}/accounts/{{account_id}}/storage/kv/namespaces/{{namespace_id}}/bulk/get"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "keys": [
          "My-Key",
          "My-Key"
        ],
        "type": "text",
        "withMetadata": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "value": "<Error: Too many levels of nesting to fake this schema>"
        }
      }
order: 1000
