$kind: http-example
id: d4e43886-2501-59ee-bc15-b6b078642ad1
name: Indicates an error updating pipeline.
request:
  url: "{{base_url}}/accounts/{{account_id}}/pipelines/{{pipeline_name}}"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "sample_pipeline",
        "source": [
          {
            "type": "{{source__0__type}}",
            "format": "json"
          }
        ],
        "destination": {
          "type": "r2",
          "format": "json",
          "batch": {},
          "compression": {},
          "path": {
            "bucket": "bucket",
            "prefix": "base"
          },
          "credentials": {
            "endpoint": "https://123f8a8258064ed892a347f173372359.r2.cloudflarestorage.com",
            "access_key_id": "<access key id>",
            "secret_access_key": "{{secret_access_key}}"
          }
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "results": {},
        "errors": []
      }
order: 2000
