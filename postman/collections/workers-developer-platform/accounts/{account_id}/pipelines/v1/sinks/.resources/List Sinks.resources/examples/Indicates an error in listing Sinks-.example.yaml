$kind: http-example
id: d3992901-723f-54e0-8a34-e982d7338a57
name: Indicates an error in listing Sinks.
request:
  url: "{{base_url}}/accounts/{{account_id}}/pipelines/v1/sinks"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: pipeline_id
      value: string
      disabled: true
    - key: name
      value: string
      disabled: true
      description: Filters sinks by name (case-insensitive substring).
    - key: page
      value: "1"
      disabled: true
    - key: per_page
      value: "55.74601935222745"
      disabled: true
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
