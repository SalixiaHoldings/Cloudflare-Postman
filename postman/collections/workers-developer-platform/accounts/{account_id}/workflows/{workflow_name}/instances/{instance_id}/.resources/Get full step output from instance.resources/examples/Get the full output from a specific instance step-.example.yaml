$kind: http-example
id: 1dd5006b-44e5-5d51-b1cf-4f497cf572fa
name: Get the full output from a specific instance step.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances/{{instance_id}}/step?name=string&type=waitForEvent"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: name
      value: string
      description: (Required) Exact step name from the instance logs response, including the generated counter suffix.
    - key: type
      value: waitForEvent
      description: (Required) Step type to disambiguate step.do and waitForEvent entries that share the same name.
    - key: attempt
      value: "1742039714627584"
      disabled: true
      description: Specific attempt number to retrieve output or error for.
