$kind: http-example
id: b743767c-95a6-5ecd-a8d5-db34b84dee8e
name: Step completed but its stored output is corrupt or missing (server-side data-integrity failure).
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances/{{instance_id}}/step?name=string&type=waitForEvent"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: name
      value: string
      description: (Required) Exact step name from the instance logs response, including the generated counter suffix.
    - key: type
      value: waitForEvent
      description: (Required) Step type to disambiguate step.do and waitForEvent entries that share the same name.
    - key: attempt
      value: "7866970372308991"
      disabled: true
      description: Specific attempt number to retrieve output or error for.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "messages": [
          "string",
          "string"
        ],
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          },
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "result": null
      }
order: 5000
