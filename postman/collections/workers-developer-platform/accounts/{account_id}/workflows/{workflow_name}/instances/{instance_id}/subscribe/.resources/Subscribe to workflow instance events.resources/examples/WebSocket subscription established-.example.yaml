$kind: http-example
id: 60dd3ccc-4695-588b-bb9b-775b1d18e45f
name: WebSocket subscription established.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances/{{instance_id}}/subscribe"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: cursor
      value: "6836"
      disabled: true
      description: Last event ID already received.
    - key: filter
      value: step_started
      disabled: true
      description: Workflow event types to include. Send multiple event types by repeating the filter query parameter.
    - key: filter
      value: wait_completed
      disabled: true
      description: Workflow event types to include. Send multiple event types by repeating the filter query parameter.
response:
  statusCode: 101
  statusText: Switching Protocols
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
