$kind: http-example
id: ddae777f-7fd0-58f8-abe0-60634390fa51
name: Step output requests are rate limited.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances/{{instance_id}}/step?name=string&type=step"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: name
      value: string
      description: (Required) Exact step name from the instance logs response, including the generated counter suffix.
    - key: type
      value: step
      description: (Required) Step type to disambiguate step.do and waitForEvent entries that share the same name.
    - key: attempt
      value: "5050633830793216"
      disabled: true
      description: Specific attempt number to retrieve output or error for.
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "messages": [
          "string",
          "string"
        ],
        "errors": [
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          },
          {
            "code": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            },
            "message": {
              "value": "<Error: Too many levels of nesting to fake this schema>"
            }
          }
        ],
        "result": null
      }
order: 4000
