name: Create workflow instance. Body is a JSON parsable string that it's passed into the new instance as the event payload.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  body:
    type: json
    content: |-
      {
        "instance_id": "1",
        "location_hint": "me",
        "params": "string"
      }
