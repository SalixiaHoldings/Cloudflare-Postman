name: Instance not found.
request:
  url: "{{base_url}}/accounts/{{account_id}}/workflows/{{workflow_name}}/instances/{{instance_id}}"
  method: GET
  headers:
    Accept: application/json
    X-Auth-Email: "{{api_email}}"
    X-Auth-Key: "{{api_key}}"
  queryParams:
    - key: simple
      value: "false"
      disabled: true
      description: When true, omits step details and returns only metadata with step_count.
    - key: order
      value: asc
      disabled: true
      description: 'Step ordering: "asc" (default, oldest first) or "desc" (newest first).'
